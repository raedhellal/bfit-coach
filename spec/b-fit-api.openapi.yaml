        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/routine/generations:
    post:
      summary: Start an async progressive routine generation from the onboarding profile (EV-124)
      description: >
        Charges one AI GENERATE credit and answers 202 immediately with a job id. Generation is
        progressive (ADR-0002): a fast skeleton call fixes the split, then each training day is
        generated in parallel and revealed as it lands. Poll GET /me/routine/generations/{jobId}.


        Two request encodings are accepted. `application/json` is the profile alone.
        `multipart/form-data` carries the same profile as a `profile` part plus an optional `photo`
        part; the photo is used for qualitative cues only and is never stored or logged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineGenerateRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  $ref: "#/components/schemas/RoutineGenerateRequest"
                photo:
                  type: string
                  format: binary
                  description: Optional photo; transient, never persisted.
            encoding:
              profile:
                contentType: application/json
      responses:
        "202":
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineGenerationAcceptedResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >
            Monthly AI credit allowance exhausted (code AI_QUOTA_EXCEEDED). The GENERATE credit is
            charged once, at submit, AFTER the catalog pre-flight and before the job is queued — so
            this is answered instead of the 202 and no job is created. The ordering matters to a
            client: a 503 CATALOG_UNAVAILABLE below is free and retryable, because the refusal
            happens above the meter and no credit is spent (BUG-057 / ADR-0013 D1.2).
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying — what is left of the fixed window that
                refused the request (BUG-152). Always at least 1, and capped at 86400 so a
                long reset (the monthly AI quota) is still a value a client can schedule.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >
            The exercise catalog for the active provider is empty, so no routine can be grounded in
            real exercises (code CATALOG_UNAVAILABLE). Nothing is charged and no job is created —
            the request is safe to retry once an operator has synced the catalog. The body carries
            no provider name, environment-variable name or other configuration state; the
            operator-facing version of this fact lives on /actuator/health/catalog behind ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/routine/generations/{jobId}:
    get:
      summary: Poll an async routine generation job (EV-124)
      description: >
        While GENERATING, `progress` and `planId` are non-null once the skeleton lands and `routine`
        carries the READY days' exercises as they stream in — the client may open and start the first
        READY day from `planId` before the job COMPLETED. At COMPLETED, `routine` is the finalized
        full plan. `error` is set only when FAILED. `progress`/`planId` are additive; a pre-EV-124
        client ignores them and works off `status` + `routine`.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status; progress + partial routine while GENERATING, finalized at COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineGenerationStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown job (or another user's job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/me:
    get:
      summary: The signed-in coach's profile and capacity (Evoli Pro)
      description: >-
        EV-183 / ADR-0012 D4. Requires ROLE_COACH **and** a `coach_profiles` row — the role claim
        and the profile row are two different facts and both are needed, because the portal renders
        a display name, a tier and a capacity that only the row has. AC1's meter reads
        "`active` / `capacity` profiles · `tier`"; the sentence is the client's, in its own i18n.
        The tier names a capacity, renders no price and links to no checkout.
        NOTE for operators: roles are a JWT claim, so an account granted COACH must sign out and
        sign in again before any of these endpoints will serve it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile and capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach (AUTH_FORBIDDEN), or a COACH role with no coach_profiles row
            (COACH_ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients:
    get:
      summary: The coach's ACTIVE roster, paged
      description: >-
        ACTIVE rows for the authenticated principal only. There is no parameter through which
        another coach's roster can be named — the coach id comes from the authentication, never
        from the request, so a client-supplied `coachId` is not ignored so much as unrepresentable.
        REVOKED links are history and are never listed.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: >-
            EV-187a AC2's triage order. `needs_attention` (the default) is flagged first —
            descending by the number of fired red flags, then ascending by the date of the last
            completed workout so the longest silence is highest, then by display name, then by id
            so the order is stable across reloads for unchanged data. A row whose link shares
            neither WORKOUTS nor WEIGH_INS has no flag count at all (`redFlagCount: null`) and
            sorts LAST, never among the zero-flag rows: a coach must not read a consent boundary as
            good news. `recent_activity` is most recently active first, unknown activity last.
            **The API sorts, not the portal** — the key spans the whole roster and the portal holds
            one page of it, so a client-side sort would order page 1 among itself and call it
            triage. Any other value is a 400, not a silent fall-back to the default.
          schema:
            type: string
            enum: [needs_attention, recent_activity]
            default: needs_attention
      responses:
        "200":
          description: A page of roster rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachClientPageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/invites:
    post:
      summary: Mint a single-use coach invite (7-day TTL)
      description: >-
        Returns the raw token **once**, in this response and nowhere else; the database stores only
        its SHA-256 digest, so a lost token cannot be recovered and a new invite must be issued.
        The invite URL is composed by the client from its own origin (`<origin>/i/<token>`) — the
        API deliberately does not build it, because it cannot know the demo's origin and a guessed
        base URL is a QR code that does not match the link it is shown beside.
        Capacity is pre-checked here as well as at accept, so the coach gets an honest refusal
        rather than a trainee hitting the wall after opening a link.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: The token and its expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachInviteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, or `COACH_CAPACITY_REACHED` — every profile the tier allows is in use.
            403 rather than 409 follows EV-183 edge case 5, which pins the status in the story text;
            the staff review noted 409 is the better status for "your plan is full" and routed it to
            senior-po as a story change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}:
    get:
      summary: A read-only overview of one trainee
      description: >-
        EV-183 AC5. `{id}` is the **coach_clients row id**, not a user id — the coach portal never
        addresses a person directly. Read-only is structural: an ArchUnit rule fails the build if a
        coach-portal controller reaches any application use case outside the coach-portal package,
        so there is no write path to hide behind a disabled button.
        **403, uniformly**, for a link belonging to another coach, for a revoked link AND for an id
        that does not exist. That is a deliberate deviation from ADR-0004's house 404, and it costs
        nothing precisely because it is uniform: the responses are byte-identical, so the prefix is
        not an existence oracle. `OwnershipAuthzSuiteTest` asserts that on every coach-portal
        mapping.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeOverviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, not this coach's client, revoked, or no such id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/progress:
    get:
      summary: Eight weeks of adherence, the last ten sessions, and red-flag evidence
      description: >-
        EV-187a AC3/AC4/AC5 — the monitoring page's three blocks in one read: adherence per ISO week
        over a fixed 8-week horizon, the last ten completed sessions with the difficulty the trainee
        reported, and every red flag that fired WITH the evidence it fired on.
        **Requires the PROGRESS scope at the guard.** A link that does not carry it answers the same
        undifferentiated 403 as another coach's client, a revoked link and an id that never existed
        (ADR-0012 D4) — so the denial says nothing about which of the four it was, and the portal
        renders "This trainee has not shared their progress with you." from
        `TraineeOverviewResponse.scopes`, never from this status.
        Inside, each block still blanks on its OWN scope: `adherence` and `sessions` are null
        without WORKOUTS, matching the overview's `adherenceThisWeek` and `lastSession`, so the two
        pages cannot show different numbers for the same trainee.
        `redFlags` here is the overview's `redFlags` with the evidence attached — one evaluation,
        two projections, so the badge and the evidence cannot disagree.
        **GET only.** This story adds no non-GET mapping anywhere on this prefix; nothing on the
        monitoring page writes to a trainee's plan, sessions, nutrition, weigh-ins or targets.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The three monitoring blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProgressResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            PROGRESS — one body for all five.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/revoke:
    post:
      summary: End the coaching link from the coach's side
      description: >-
        EV-183 AC6's coach side. Not idempotent by design: a second call has no ACTIVE link to end
        and therefore answers the same 403 as a foreign id, which is what keeps "did this link
        exist?" unanswerable. The trainee's consent row is stamped `withdrawn_at` in the same
        transaction — a live consent attached to a dead link would make "does this coach hold
        consent?" answer yes for a coach with no access.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The link is REVOKED
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, not this coach's client, already revoked, or no such id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine:
    get:
      summary: The trainee's live routine, with their stored guardrails
      description: >-
        EV-184 AC1. The routine document is the one the trainee's own app renders, so the coach's
        page and the phone agree by construction rather than by two renderers agreeing — which is
        what AC1 has QA check, exercise by exercise, phone next to browser.
        `routine` is null for a trainee who has never had one: the portal renders "No active plan"
        and a single "Build a plan" control, never a blank page or `null`.
        `guardrails` is display-only, and that is the API's property rather than the UI's — at MVE-3
        the submitter is the coach, so "resolve from the profile, never from the request" is the
        difference between the trainee's injuries and a stranger's claim about them (CS-22 /
        ADR-0001). The policy resolves injuries and equipment from `user_profiles`, and since
        BUG-185 so does the `plans.equipment` column the trainee's own app reads on `GET /me/plan`.
        A submitted routine document does carry a `constraints` block — `constraints.equipment` and
        `constraints.injuries` are both required on `Routine`, so a coach CANNOT omit them — but the
        server reads neither as a claim about the trainee: submitted equipment is ignored outright,
        and submitted injuries are unioned with the stored ones, which can only narrow what may be
        prescribed and never widen it.
        Requires the **WORKOUTS** scope on the link (ADR-0015 D5): a link that did not share
        workouts answers 403, not an empty editor.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            WORKOUTS — one undifferentiated body for all five, so a 403 tells the caller nothing
            about which applied and "which scope am I missing" is not a probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/draft:
    get:
      summary: The coach's unpublished draft for this link
      description: >-
        EV-184 AC2. `document` is null when there is no draft — a 200, never a 404: the absence IS
        the information, and the draft lives in its own table (`coach_plan_drafts`) that no
        trainee-facing path reads. AC2 calls a draft leaking to the trainee the single worst failure
        this story can produce, and the prevention is structural rather than careful.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The draft, or nulls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineDraftResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Save the draft (last write wins)
      description: >-
        EV-184 AC2. The body is a full Routine, validated by exactly the constraints
        `PUT /me/coach/routine` validates, so a draft that could never be published cannot be stored.
        Two tabs editing one draft: the second save wins and the stale tab's reload shows the winner
        — not a merge and not a crash (edge case 2). The trainee's plan is untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Routine"
      responses:
        "200":
          description: The saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineDraftResponse"
        "400":
          description: The routine is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Discard the draft
      description: >-
        EV-184 AC2. The page returns to the published plan exactly, because the published plan was
        never touched. Idempotent: a second discard has nothing to delete and answers the same 204,
        which is the honest answer to a double tap and the only one that does not make "is there a
        draft?" a question with a side effect.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: There is no draft for this link
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/publish/preview:
    post:
      summary: What publishing this draft would change
      description: >-
        EV-184 AC3, phase one of the two-phase publish (ADR-0015 D4). Runs the safety guardrail
        against the trainee's STORED injuries and equipment and **writes nothing**.
        `RoutinePolicy` repairs; it does not refuse — so `repairs` is what the coach is asked to
        acknowledge, and an empty list means the modal reads "No changes were needed" with one
        "Publish" control. `repairCount` is `repairs.length`, so AC3's heading "We changed N things
        to keep this safe" cannot disagree with the list beside it.
        Refusal order, all before any write: guard + scope, then 400 COACH_PLAN_EMPTY, then
        503 CATALOG_UNAVAILABLE, then the policy.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The repairs and the digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPublishPreviewResponse"
        "400":
          description: COACH_PLAN_EMPTY — no draft, or a draft with no training day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            CATALOG_UNAVAILABLE — the active exercise provider has no catalog rows. The asymmetry is
            deliberate: the trainee may generate against an empty catalog, the coach may not PUBLISH
            against one, because a coach's plan is published under a named professional's byline to
            a third party and neither party can see that half its exercises resolve to nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/publish:
    post:
      summary: Publish the draft as the trainee's active plan
      description: >-
        EV-184 AC3, phase two. Requires the digest from the immediately preceding preview. Publish
        re-runs the policy and compares the resulting repair set to the acknowledged one — that
        comparison, not the digest alone, is what closes the time-of-check/time-of-use window
        (edge case 2's second tab). A constant `confirm: true` was rejected: it carries no
        information about WHAT was acknowledged.
        Writes `plans.source = COACH`, `plans.authored_by` = the coach and `plans.owner_id` = the
        trainee, as a **new** plan row with the previous one deactivated — never an in-place update,
        because the trainee's "Your coach updated your plan" line is keyed on the plan id in slice 1.
        Writes **no** `plan_assignments` row: deferred to EV-184d behind EV-040c, and enforced by an
        ArchUnit rule rather than by an omission test.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachPublishRequest"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPublishResultResponse"
        "400":
          description: COACH_PLAN_EMPTY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            COACH_PUBLISH_REPAIRS_UNACKNOWLEDGED — the digest is absent or no longer matches the
            repairs this draft produces. Nothing is written. The portal's answer is to preview again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/save-as-template:
    post:
      summary: Save this trainee's routine into the coach's own library
      description: >-
        EV-188 AC1. `source=PLAN` copies the trainee's currently published routine document;
        `source=DRAFT` copies the coach's unpublished draft for this link. Guarded by
        `requireActiveLinkRow(WORKOUTS)` like every other mapping that reads a trainee's data — the
        subject here is still a trainee, which is why this one lives under `/clients/{id}` and the
        rest of the library does not.
        The stored template carries the prescription and **no answer the trainee gave about
        themselves**: `constraints.equipment` and `constraints.injuries` are normalised empty at the
        write boundary and refused at the read boundary. A trainee with an active plan and no
        routine document is refused with 400 COACH_TEMPLATE_SOURCE_EMPTY, never an empty template.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateFromRoutineRequest"
      responses:
        "201":
          description: The new template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: >-
            COACH_TEMPLATE_SOURCE_EMPTY, or COACH_TEMPLATE_TOO_LARGE naming the day and its count.
            Nothing is truncated, dropped or saved partially.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN, or COACH_TEMPLATE_LIMIT_REACHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates:
    get:
      summary: The coach's own routine library
      description: >-
        EV-188 AC2. Newest-updated first; each row carries name, day count, exercise count and the
        last-updated date, and nothing else. Unpaged because the cap is 50 rows per coach, enforced
        at the write under a pessimistic lock — a bounded collection, not an unbounded query. A
        second coach sees an EMPTY library, never a filtered view of this one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a template
      description: >-
        EV-188 AC1's "New template". The submitted `constraints.equipment` and
        `constraints.injuries` are stored EMPTY whatever they contain — a template carries the
        prescription and nothing a trainee told us about themselves — and the read boundary refuses
        any row where they are not.
        The document is validated against the FULL publish contract — a template is held to exactly
        the contract a draft is held to, so `trainingDays` must carry 2..6 days and `daysPerWeek`
        must agree. There is no "template validation group": an earlier design had one and it was
        withdrawn, because *strict now, relax later* is reversible while *permissive now, strict
        later* strands rows in a store whose rows live for months.
        The cost is deliberate and the portal must plan for it: **the server is not a scratchpad.**
        An editor may not autosave a document with fewer than two training days; transient invalid
        state belongs to the client, which is where every form editor already keeps it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateSaveRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: >-
            The document is invalid, or COACH_TEMPLATE_TOO_LARGE — a day over 12 exercises, named
            with its count. Nothing is truncated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN, or COACH_TEMPLATE_LIMIT_REACHED at 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}:
    get:
      summary: One template, with its document
      description: >-
        EV-188 AC1. Every denial on this mapping is ONE body — a template belonging to another
        coach, an id that never existed and a template deleted in another tab are the same branch of
        `requireOwnedTemplate`, not three branches that happen to agree. A template has no status
        column and is not soft-deleted, so there is no third state to diverge.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Replace a template
      description: >-
        EV-188 AC2's Edit. Editing REPLACES; there is no versioning and no history, and two variants
        are a Duplicate plus a Rename. **Editing a template after it has been used changes nothing
        for any trainee it was used on** — the copy was one-way and the link was severed at the
        moment of copying. Deleting one changes nothing either.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateSaveRequest"
      responses:
        "200":
          description: The saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: Invalid, or COACH_TEMPLATE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a template
      description: >-
        EV-188 AC2. After it, every draft and every published plan previously produced from this
        template is COMPLETELY unchanged — `coach_plan_drafts.source_template_id` is ON DELETE SET
        NULL, so the editor's "Started from {name}" line disappears and nothing else does. That is a
        delete RULE, not a test.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/rename:
    post:
      summary: Rename a template
      description: >-
        EV-188 AC2. Its own mapping rather than a nullable document on the save body: a rename from
        the library list must not have to fetch the whole document first, and "null means leave it
        alone" is the suppression-parameter shape this API rejects by rule. A name the coach already
        uses is refused and leaves BOTH templates unchanged. The uniqueness key folds case and
        surrounding whitespace, because a coach who has "Push Day" does mean they already have
        "push day ".
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateRenameRequest"
      responses:
        "200":
          description: The renamed template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: Empty, whitespace-only, or over 80 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/duplicate:
    post:
      summary: Duplicate a template
      description: >-
        EV-188 AC2. The copy is named "{name} (copy)", then "(copy 2)" and so on — the name key is
        folded and unique, so the suffix must probe, and the probe is BOUNDED rather than a loop.
        The copy is **semantically** identical (same days, same exercises, same prescriptions), not
        byte-identical: it re-serialises through the same write boundary, and copying the raw JSONB
        in SQL would bypass the boundary the stripping guarantee depends on. No template write path
        may bypass it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_LIMIT_REACHED at 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/apply:
    post:
      summary: Use this template on a trainee
      description: >-
        EV-188 AC3. Fills THAT trainee's draft and touches nothing else: no `plans` row, no
        `user_plan` row, no assignment row. The trainee's app, refreshed at that moment, still shows
        their old plan. Publishing is EV-184's unchanged preview → digest → publish, with the same
        repair acknowledgement and the same provenance — `plans.authored_by` is the coach,
        `plans.source` is COACH and `plans.source_plan_id` stays NULL. A template-derived plan is
        indistinguishable, to the trainee, from a hand-built one, and that is intended.
        **Apply is DEFAULT-REFUSING.** Without `replacesDraftUpdatedAt`, an existing draft answers
        409 COACH_DRAFT_EXISTS carrying that draft's `updatedAt`, and the retry echoes it. The
        comparison happens inside the write transaction, so a second tab that saved in between
        causes the retry to be refused AGAIN rather than to overwrite — which is the only thing that
        makes the portal's "this replaces your unpublished draft" sentence true.
        Apply runs NO policy and reads NOTHING about the trainee: the trainee's injuries and
        equipment are applied when the plan is PUBLISHED. `unbindableExercises` is advisory — every
        exercise is copied verbatim and nothing is ever removed except by the coach pressing Remove.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateApplyRequest"
      responses:
        "200":
          description: The trainee's draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateApplyResponse"
        "400":
          description: >-
            COACH_PLAN_EMPTY for a template with no training day, or
            COACH_TEMPLATE_NOT_PUBLISHABLE for a day count a plan cannot carry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Foreign, unknown or deleted template; a clientId this coach is not linked to; or a link
            without WORKOUTS. Answered EVEN WHILE the catalogue is unavailable, so a stranger never
            learns the catalogue's state from a 503 where they should have had a 403.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_DRAFT_EXISTS — `details.existingUpdatedAt` is what the retry echoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/recipes:
    get:
      summary: The coach's own recipe library
      description: >-
        EV-256a / ADR-0026 D26.1. Alphabetical by name; each row carries the name, the macros and
        the ingredient count. Unpaged because the cap is 100 recipes per coach, enforced at the
        write under the coach-profile row lock and repeated as the query's LIMIT, so it is a bounded
        collection rather than an unbounded query. A second coach sees an EMPTY library, never this
        one's. Not behind the placement flag (EV-256 ruling R5).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a recipe
      description: >-
        EV-256a AC1. One serving. Every ingredient key must be exactly one returned by
        `GET /coach-portal/ingredients`: the key is checked AS SENT against
        `^[a-z][a-z0-9_]{1,63}$` and then against the vocabulary, so `Chicken_Breast` and
        `" chicken_breast "` are refused even though they would normalise to a known key. Nothing is
        checked against any trainee here: a recipe belongs to no trainee, and a trainee's food rules
        are checked when a recipe is placed on their plan (EV-256c).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeSaveRequest"
      responses:
        "201":
          description: Created. The same body `GET /coach-portal/recipes/{id}` returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "400":
          description: >-
            `COACH_RECIPE_UNKNOWN_INGREDIENT` with `details.key` (as sent) and `details.field`, for
            a key that is blank, has upper case, does not match the pattern, or is not in the
            vocabulary. `COACH_RECIPE_MACROS_INCONSISTENT` with `details.computedKcal` when
            `|kcal − (4·P + 4·C + 9·F)| > max(50, 0.15 × kcal)`. `VALIDATION_ERROR` for every
            other bound, naming the field in `details.field` or at the start of `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `COACH_RECIPE_NAME_TAKEN` (this coach already has the name, ignoring case and
            surrounding spaces), or `COACH_RECIPE_LIMIT_REACHED` at 100 recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/recipes/{id}:
    get:
      summary: One recipe
      description: >-
        EV-256a AC6. Every denial on this mapping is ONE body: a recipe belonging to another coach,
        an id that never existed and a recipe deleted in another tab are the same branch of
        `requireOwnedRecipe`. A recipe has no status column and is not soft-deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Replace a recipe
      description: >-
        EV-256a AC7. Replaces the whole recipe and applies every save rule again, including the
        name rule against this coach's OTHER recipes (keeping or re-casing its own name is not a
        collision). No versioning and no history. A meal the recipe was already placed on keeps the
        version that was placed (EV-256 default D-f).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeSaveRequest"
      responses:
        "200":
          description: The saved recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "400":
          description: As for POST /coach-portal/recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_RECIPE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a recipe
      description: >-
        EV-256a AC7. After it, the id answers the same 403 body as a foreign or random id. A meal
        the recipe was already placed on is a copy and is unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/ingredients:
    get:
      summary: Search the ingredients a recipe may use
      description: >-
        EV-256a AC8 / ADR-0026 D26.2. An in-memory filter over the canonical ingredient vocabulary;
        only vocabulary keys can be returned. At most 20 entries whose label contains the trimmed
        `q` (an underscore counts as a space, so a pasted key finds itself), ignoring case: labels
        that START with `q` first, then the rest, each group
        alphabetical. A blank or absent `q` gives the first 20 by label, alphabetically. A search
        with no result answers `[]` and is logged as `coach_recipe_ingredient_search_empty` (the
        demand list for new vocabulary keys). Labels are English, derived from the key.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            default: ""
      responses:
        "200":
          description: Matching ingredients, possibly none
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/CoachIngredientOption"
        "400":
          description: VALIDATION_ERROR, q longer than 100 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/catalog/exercises:
    get:
      summary: The exercise catalog the coach picks from
      description: >-
        EV-184 AC2 — the coach picks, never types; creating, renaming or deleting a catalog entry is
        out of scope entirely.
        **No client id**, deliberately: the catalog is Evoli's, identical for every coach and every
        trainee, and carries no trainee data — so there is no scope to name and nothing a link could
        grant. The check is the same `requireCoachProfile` every coach endpoint makes first.
        `q`, `muscle` and `equipment` treat an EMPTY STRING as absent, not as a filter matching
        nothing: the portal sends all three unconditionally.
        `muscles` and `equipment` are the facet vocabularies, derived from the catalog and returned
        with the page — a hard-coded list in the web tier drifts from the catalog on the next sync,
        and the drift is invisible because the filter simply returns nothing and looks like an empty
        catalog.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Free-text name match. An empty string is absent.
        - name: muscle
          in: query
          required: false
          schema:
            type: string
          description: One value from `muscles`. An empty string is absent.
        - name: equipment
          in: query
          required: false
          schema:
            type: string
          description: One value from `equipment`. An empty string is absent.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of exercises plus the facet vocabularies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCatalogPageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition:
    get:
      summary: The trainee's live targets, meal week and dietary restrictions
      description: >-
        EV-185 AC1. One read for the whole tab. `targets` and `week` are null for a trainee who has
        neither, and that pair is AC1's "No nutrition set up yet" — never a zeroed card and never a
        `NaN`.
        Reading this page does NOT compute a first target as a side effect: `NutritionService.getTarget`
        computes and persists one on first access, so this reads the stored row directly. A coach
        looking must not create the trainee's first target.
        `dietProfile` is READ-ONLY. No request on this prefix carries an allergy, a food rule or a
        dislike — the absence of the field IS the mechanism, and the exclusion policy reads
        `nutrition_preferences` inside the engine, which is the only place it has ever read them from.
        `currentWeekStart` is the Monday the SERVER considers current, on the server clock: the
        portal sends no `X-Timezone` (ADR-0011 is mobile-only) and a browser-derived Monday would
        disagree across a zone boundary, making "Apply" fail with COACH_WEEK_OUT_OF_RANGE for
        reasons invisible to the coach.
        `targets.setByYou` is a server-computed BOOLEAN and never a user id (ADR-0015 D6 ruling
        (b)/Q2): a raw `set_by` would be the first user id of another person this surface has ever
        received, and a previous coach's uuid on two trainees would tell this coach those two
        trainees shared a coach.
        Requires the **NUTRITION** scope on the link (ADR-0015 D5).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The trainee's nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNutritionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            NUTRITION — one undifferentiated body for all five, so a 403 tells the caller nothing
            about which of them it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/targets:
    put:
      summary: Set the trainee's macro targets
      description: >-
        EV-185 AC2. Four numbers and nothing else — no dietary field, no trainee id, no coach id.
        Calories are clamped SERVER-side by the engine's floor (1500 kcal for a male profile, 1200
        otherwise), the same floor the trainee's own app applies, because it lives in one function
        both callers go through. `floorCalories` is the NUMBER it was raised to, non-null exactly
        when the floor moved the value; the sentence lives in the portal's copy file.
        The saved row carries `source = COACH` and the coach's id in `nutrition_targets.set_by`. The
        trainee's own next edit replaces both — a MANUAL or AUTO write is a full-row replace with no
        setter, so the byline stops rendering by construction (AC5).
        **Evoli checks calories against a safe minimum and does NOT check protein or fat.** No such
        bound exists in the engine and this endpoint does not invent one; the portal renders that
        sentence so a coach cannot infer a protection that is not there.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTargetsRequest"
      responses:
        "200":
          description: The saved targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTargetsResult"
        "400":
          description: VALIDATION_ERROR — a missing or out-of-range number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/progress-goal:
    put:
      summary: Set the trainee's programme start date and milestone weight
      description: >-
        EV-202a AC1. **TWO values, and there is no third.** Start weight, current weight, start body
        fat and current body fat are DERIVED from the trainee's own `weigh_ins` and
        `body_measurements` rows — the trainee owns their body data and already records it, a
        coach-typed baseline would be a second writer on it, and a derived one cannot go stale
        against the chart printed below it. No field on this request could carry one.
        A **PUT of the whole representation**: an omitted value CLEARS that value, which is an
        explicit write and not a no-op — the row survives with a null milestone, `set_by` updated,
        and the trainee's milestone row disappears from their Measurements screen.
        Last write wins. Two scalars, one actor, no trainee writer.
        The response is the SAME block `GET /coach-portal/clients/{id}` embeds, recomputed from the
        trainee's readings, so the portal needs no refetch.
        🔴 **G-GOAL**: the milestone weight is a NARRATIVE number. No routine generator, no
        nutrition target calculation, no prompt and no policy reads it. A coach typing 60 here does
        not move a calorie target by one kilocalorie.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachProgressGoalRequest"
      responses:
        "200":
          description: The saved goal and the derived block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProgressGoal"
        "400":
          description: >-
            COACH_MILESTONE_OUT_OF_RANGE — the milestone is outside 25..300 kg. NOTHING is written,
            including the start date that arrived in the same body, and the value is never clamped.
            Or VALIDATION_ERROR for a number that does not fit NUMERIC(5,2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            WEIGH_INS — one undifferentiated body for all five. A revoke takes effect on the very
            next request; the guard caches nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/apply:
    post:
      summary: Apply a meal week to the trainee, immediately
      description: >-
        EV-185 AC3. There is NO draft in slice 1 — a nutrition draft is a fork of a five-table
        aggregate (EV-092) — so the trainee sees this straight away and the portal's confirm dialog
        says so in those words.
        Idempotent in row count and not in content: a second apply REPLACES the week rather than
        duplicating it, and meals the trainee LOCKED are carried forward, which is what the `locked`
        flag on each meal exists to show.
        Current week only. Any other `weekStart` is 400 COACH_WEEK_OUT_OF_RANGE, decided on the
        SERVER clock — read `currentWeekStart` from GET …/nutrition rather than computing a Monday
        in the browser.
        Capped at **one apply per link per day** (429 COACH_WEEK_APPLY_RATE_LIMIT): a week is one
        model call per day plus an image call per meal, and slice 1 charges NOBODY — not the coach
        (EV-091 and ⛔ D9 are unbuilt) and not the trainee, whose GENERATE credit the /me path
        spends and this one does not.
        The trainee's stored allergies, HALAL/KOSHER rules and dislikes decide the meals. This
        request carries none of them and there is no field that could.
        EV-190a / N1: the OPTIONAL `mealStructure` (meals per day 1-6 + snacks) applies to THIS
        WEEK ONLY. It is recorded on `weekly_meal_plan`, read again by the day regeneration below
        so a regenerated day matches the week it belongs to, and CLEARED when the trainee
        regenerates their own week. It is never written to the trainee's `nutrition_preferences` or
        profile — for any field — which is asserted by a test over this write path and by a
        full-row before/after comparison of the trainee's stored preferences, not by review.
        Out of range is 400 COACH_MEAL_STRUCTURE_OUT_OF_RANGE naming the bound, with NOTHING
        generated and nothing written: a silently clamped value would leave the coach believing
        they had set something they did not.
        EV-190 AC7 — **a key this request body does not declare is REFUSED, not ignored**:
        400 COACH_FIELD_NOT_ACCEPTED naming the key, with nothing generated and nothing written.
        The keys this catches are the ones that matter — `allergies`, `foodRules`,
        `dietaryPattern`, `injuries`, `gender`, `weightKg`, `traineeId` — and the honest answer to
        all of them is "this endpoint does not accept that", not a 200 that looks like it worked.
        ⚠️ **This changed on 2026-09-17.** Before EV-190a the extra keys were silently dropped and
        this endpoint answered 200, because Spring Boot disables FAIL_ON_UNKNOWN_PROPERTIES
        globally. The refusal is implemented on THIS request type (and its nested `mealStructure`)
        rather than as a global setting, so no /me route and no mobile client changes with it —
        which also means the other coach nutrition writes (`PUT …/nutrition/targets`,
        `POST …/swap`) still IGNORE unknown keys. That asymmetry is known, is EV-185a's shipped
        behaviour, and was deliberately not widened by this story.
        Returns a FINISHED week: unlike the trainee's own generation, which streams days in on a
        pool, the coach's apply completes before it answers — a skeleton week makes AC1's
        phone-next-to-browser comparison unreadable. With AI enabled that makes this a slow request.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachApplyWeekRequest"
      responses:
        "200":
          description: The applied week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: >-
            COACH_WEEK_OUT_OF_RANGE — slice 1 serves the current week only; or
            COACH_MEAL_STRUCTURE_OUT_OF_RANGE — `mealStructure.mealsPerDay` outside 1-6, refused
            at the control with nothing generated and never clamped; or COACH_FIELD_NOT_ACCEPTED —
            the body carried a key this request does not declare, named in the message, with
            nothing generated and nothing written; or VALIDATION_ERROR when `mealStructure`
            carries only one of its two fields (they are one fact)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the CLIENT's allergies and food rules rule out every
            recipe the server can check. Nothing was written: a coach's refusal is a non-event for
            that week (AC5), so the trainee's existing week is untouched and no REFUSED row is
            created — that persistence is the trainee's own path only.


            This operation answered **500** before EV-071a. The portal decides what to show from
            this **code**; the `message` is developer-facing and is not copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: COACH_WEEK_APPLY_RATE_LIMIT — this link has already had a week applied today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/days/{index}/regenerate:
    post:
      summary: Regenerate one day of the trainee's current week
      description: >-
        EV-185 AC3. `index` is 0-6 from the week start; `planned_day` ids are not served on this
        prefix, so there is none for the portal to hold or for anyone to guess.
        Free, but the daily cap lives on the TRAINEE's plan row, so this spends the trainee's
        allowance and can be refused by regenerations the coach never made — 429
        COACH_DAY_REGEN_LIMIT, a code distinct from the trainee's own DAY_REGEN_LIMIT precisely so
        the coach is never shown a sentence about regenerations they did not perform. The portal
        discloses the sharing ("Day regenerations share {trainee}'s daily limit"); EV-091 is the fix.
        The week's attribution is carried forward UNCHANGED: a day regeneration is not a whole-week
        write, so a coach regenerating one day of the trainee's own week does not make that week the
        coach's, and a trainee regenerating one day of the coach's week does not unmake it.
        EV-190a: the week's MEAL STRUCTURE is carried forward by the same rule and for the same
        reason. The rebuilt day is generated against the structure THE WEEK was applied with — read
        from the week, never from the trainee's profile — so the day a coach regenerates matches
        the week they applied.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
      responses:
        "200":
          description: The week, with that day regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND — no current week, or no such day index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the CLIENT's allergies and food rules rule out every
            recipe the server can check. Nothing was written: a coach's refusal is a non-event for
            that week (AC5), so the trainee's existing week is untouched and no REFUSED row is
            created — that persistence is the trainee's own path only.


            This operation answered **500** before EV-071a. The portal decides what to show from
            this **code**; the `message` is developer-facing and is not copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: COACH_DAY_REGEN_LIMIT — the trainee's daily allowance is spent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/meals/{mealId}/swap:
    get:
      summary: Cached swap candidates for one meal
      description: >-
        EV-185 AC3. The CACHED reader, never the refreshing one: `refreshSwapOptions` charges the
        TRAINEE a CHAT credit and is the one path a caller could otherwise spam into unbounded model
        calls, so it has no mapping on this prefix at all.
        The candidates respect the trainee's stored exclusions for the same reason the week does —
        the engine reads `nutrition_preferences`, and nothing in this request could override them.
        A meal id belonging to somebody else answers 404: ownership is resolved through the
        trainee's id, so a guessed id buys nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachSwapOptions"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND — no such meal for this trainee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Swap one meal for a cached candidate
      description: >-
        EV-185 AC3. Day-level, so the week's attribution is carried forward unchanged. The swapped
        meal is marked LOCKED by the engine, exactly as the trainee's own swap is — which is why the
        next apply keeps it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachApplySwapRequest"
      responses:
        "200":
          description: The week, with that meal swapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: VALIDATION_ERROR — no candidate at that index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/meals/{mealId}/recipe:
    post:
      summary: Put one of the coach's recipes on one meal of the trainee's week
      description: >-
        EV-256c (ADR-0026 D26.4, D26.5). The meal keeps its id, slot, position and day; its content
        becomes a COPY of the recipe (editing or deleting the recipe later changes nothing already
        placed), with provenance COACH_RECIPE, no image, unlocked and uneaten. Every other meal in
        the week is untouched. Checked under the plan lock against the meal as it is now, in this
        order: an eaten or trainee-locked meal is refused; a trainee with any typed allergy, or the
        KOSHER rule, is refused (the system cannot check either against a recipe yet); a key
        retired from the vocabulary since the recipe was saved is refused; every ingredient and the
        recipe's NAME go through the trainee's exclusions exactly as a generated meal's do (the
        steps are not checked); a placement that would take the day under the calorie floor (1500
        kcal for a male profile, 1200 otherwise) AND lower it is refused. No model call, no credit,
        no regeneration spent. REGISTERED ONLY while bfit.coach.recipes.placement.enabled is true;
        otherwise this path is a 404 NOT_FOUND like any unmapped one, and GET
        /coach-portal/clients/{id}/nutrition carries recipePlacementEnabled false.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachPlaceRecipeRequest"
      responses:
        "200":
          description: The week, with the recipe on that meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: >-
            VALIDATION_ERROR (no recipeId); COACH_RECIPE_BELOW_FLOOR, details {floorKcal,
            dayKcalBefore, dayKcalAfter}; COACH_RECIPE_UNKNOWN_INGREDIENT, details {key, field},
            when the recipe holds a key retired since it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            COACH_ACCESS_DENIED. See GET /coach-portal/clients/{id}/nutrition for the link; or a
            recipe that is another coach's, deleted, or never existed (one body for all three)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            NUTRITION_NOT_FOUND: no such meal for this trainee (including another trainee's meal,
            and one a regeneration replaced since the portal loaded). NOT_FOUND: placement is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_MEAL_EATEN; COACH_MEAL_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            COACH_RECIPE_EXCLUDED, details {field: ingredient, value: <label>} or exactly {field:
            name}, never a rule or category; COACH_RECIPE_ALLERGIES_UNCHECKABLE, no details;
            COACH_RECIPE_RULE_UNCHECKABLE, details {rule: KOSHER}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach:
    get:
      summary: The trainee's current coach, or null
      description: >-
        Renders EV-183 AC6's "Coached by `<name>` · since `<date>`" line in Settings. The body is a
        literal JSON `null` when there is no coach — not an absent body, because both clients call
        `res.json()` on it. Singular because `uq_coach_clients_active_trainee` makes it singular in
        the database, not because the response type happens to be one object.
        `/me/my-coach`, not `/me/coach`: `/me/coach/**` is the **AI** coach.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The coach, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MyCoachResponse"
                nullable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach/accept:
    post:
      summary: Accept a coach invite
      description: >-
        EV-183 AC3. One transaction: consume the invite (a conditional UPDATE requiring exactly one
        affected row, never a read-then-write), lock the coach's profile row, check capacity and
        self-link, append the `COACH_ACCESS` consent row through the BUG-023 mechanism — not a
        second one — and insert the link. Any refusal after the invite is consumed rolls the whole
        thing back, so a failed accept does not burn the invite.
        The request carries **no scopes**: the server owns the set (all four), exactly as it owns
        the policy version. A client-supplied scope list would be a client narrowing what it says it
        consented to while receiving the full grant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCoachInviteRequest"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCoachResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            `COACH_INVITE_INVALID` | `COACH_INVITE_USED` | `COACH_INVITE_EXPIRED` |
            `COACH_SELF_LINK` | `COACH_CAPACITY_REACHED`. The first three are one status and one
            shape on purpose, so a token holder cannot probe which invites exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `COACH_ALREADY_LINKED` — this account already has a coach; or `CONSENT_VERSION_STALE` —
            the consent screen displayed a privacy policy version that is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach/revoke:
    post:
      summary: End the coaching link from the trainee's side
      description: >-
        EV-183 AC6's closing beat. On the coach's very next request — a plain reload, no logout, no
        wait — the trainee is gone from the roster and the previously working overview URL answers
        403. There is no authorization cache anywhere on that path, which is what makes "instant"
        true rather than "usually".
        Idempotent: a trainee with no coach has nothing to revoke and gets the same 204, which is
        also the honest answer to a double tap on a flaky connection.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: There is now no ACTIVE link
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/progress-goal:
    get:
      summary: The milestone weight the trainee's coach set for them
      description: >-
        EV-202e AC12–AC15. **The trainee's own read of a number written about their body by someone
        else.** EV-202a shipped the progress goal on the coach-portal surface only; this is the only
        channel by which its subject can see it (`EV-041` is `DELETE /me/account`, i.e. erasure, not
        access), which is what makes that write defensible under the consent posture EV-197 and
        EV-202c established.
        **It addresses nothing.** No path parameter and no query parameter of any kind: the subject
        is the caller, resolved from the authentication, so there is no id to pass and none to
        tamper with.
        **A deliberate SUBSET of the coach's block, and the list is closed** — four fields, no more
        and no fewer. `startedOn`, `startedOnSource`, the four derived readings, both deltas and
        above all `weightToGoKg` are absent by design: "to go" is a SIGNED number (a trainee bulking
        toward a higher milestone and one cutting toward a lower one both have one, and neither is a
        failure), and it is what a progress bar, a percentage and an ETA are made of.
        🔴 **G-GOAL**: the milestone is a NARRATIVE number. No routine generator, no nutrition target
        calculation, no prompt and no policy reads it, and no client renders it as a number the app
        is working toward.
        **Absence is a 200 with a null milestone — never a 404 and never a 403** — and it is ONE
        answer for FOUR different facts: no coach at all, a link with no goal row, a link whose
        `WEIGH_INS` scope is missing, and a coach who cleared the milestone. A status code that
        varied with whether a coach exists, or with which scopes a link carries, would be a
        disclosure oracle on the trainee's own prefix.
        ⚠ `WEIGH_INS` deliberately does NOT gate this read. That scope governs what the COACH may
        see of the trainee's data; it is not a lock on the subject's own record, and a trainee who
        has revoked entirely still reads the row (edge case 12) with the attribution naming the
        coach who set it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The trainee's milestone, or the same body with a null milestone when there is nothing
            to show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeMilestone"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    TimeZoneHeader:
      name: X-Timezone
      in: header
      required: false
      description: >-
        IANA time zone of the caller's device (BUG-134). The endpoint resolves "today" in this
        zone. Absent or blank falls back to UTC, which is the pre-BUG-134 behaviour, so older
        clients keep working. A present-but-unresolvable value ALSO falls back to UTC and is
        logged and counted server-side (`bfit.request_timezone.rejected`) rather than rejected:
        the client's zone catalog and the server's tzdata are independently versioned, so a hard
        400 would turn catalog skew into a dead surface fixable only by an app-store release.
        See ADR-0011.
      schema:
        type: string
        example: Europe/Paris
    CompletionTimeZoneHeader:
      name: X-Timezone
      in: header
      required: false
      description: >-
        IANA time zone of the caller's device. On the completion routes it does two things.
        (1) With no `date` in the body it FILES the session (EV-250 / ADR-0025): under the day the
        session started in this zone (completion time minus `durationSeconds`), never more than one
        day before the day it ended; this is the zone `GET /me/today-workout` uses to choose the
        workout, so the two agree. Absent, blank or unresolvable: UTC. (2) It BOUNDS the day
        (EV-248 / BUG-225): the filed day, and for a client-sent `date` also the day the session is
        recorded as ending (`date` 00:00 UTC + `durationSeconds`, for a date other than the
        server's today). Present and resolvable: a day after the caller's local today is rejected
        with 400 `COMPLETION_DATE_IN_FUTURE`. Absent, blank or unresolvable: a day after the
        server's (UTC) today + 1 day is rejected — NOT the strict UTC today the other routes fall
        back to, because no zone is more than 14 hours ahead of UTC and a strict UTC bound would
        refuse genuine sessions logged after local midnight east of UTC. A dateless completion is
        never refused by this bound.
      schema:
        type: string
        example: Europe/Paris
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CoachProfileResponse:
      type: object
      description: The signed-in coach's profile and capacity (EV-183 AC1).
      properties:
        coachId:
          type: string
          format: uuid
          description: The coach's user id — the same account as their Evoli Fit login.
        displayName:
          type: string
          description: What the trainee is shown on the consent screen and in Settings.
          example: Coach User
        tier:
          type: string
          enum: [STARTER]
          description: >-
            Capacity tier. Names a capacity, renders no price and links to no checkout (⛔ D8
            untouched). Becomes a real entitlement at MVE-6.
        active:
          type: integer
          description: ACTIVE links held by this coach right now.
        capacity:
          type: integer
          description: How many ACTIVE links the tier allows. A constant in code, keyed off the column.
          example: 2
      required: [coachId, displayName, tier, active, capacity]
    CoachClientSummaryResponse:
      type: object
      description: >-
        One roster row (EV-183 AC4). No trainee user id is exposed: everything the coach can address
        is addressed by `id`, the coach_clients row id.
      properties:
        id:
          type: string
          format: uuid
          description: The coach_clients row id — the only id the coach portal addresses.
        traineeDisplayName:
          type: string
        currentPlanName:
          type: string
          nullable: true
          description: >-
            The plan the trainee's own app is currently on, resolved through `user_plan` (the source
            Today and the session paths use), so the roster and the phone agree. Null if they have
            no plan, AND null when this link does not carry the WORKOUTS scope (ADR-0015 S1 — the
            roster filters per item, not per coach). The roster is a list and does not distinguish
            the two: open the client and read `TraineeOverviewResponse.scopes`.
        lastCompletedWorkoutDate:
          type: string
          format: date
          nullable: true
          description: >-
            UTC date of the last completed workout; null if there has never been one, and null when
            this link does not carry the PROGRESS scope. PROGRESS, not WORKOUTS: on the roster this
            is a bare date used as an ACTIVITY signal, which is what a "needs attention" ordering
            reads. (The overview's `lastSession` names the workout and carries the difficulty
            feedback, and is WORKOUTS.) A client that sorts on this field must treat
            null-as-not-shared as unknown and sort it LAST, not first.
        currentStreakDays:
          type: integer
          nullable: true
          description: >-
            The trainee's current streak in days. NULL when this link does not carry the PROGRESS
            scope — 0 is a real streak of zero and must not be rendered for data the trainee did not
            share.
        redFlagCount:
          type: integer
          nullable: true
          description: >-
            EV-187a AC2 — how many red flags fired for this trainee, from the SAME evaluation the
            trainee's own page runs, so the roster badge and the flags on the page cannot disagree
            (QA compares them for every seeded trainee).
            **NULL means "not shared"**: the link carries neither WORKOUTS nor WEIGH_INS, so no rule
            could be evaluated at all. Such a row renders "Not shared" and sorts LAST under
            `needs_attention`. It is never 0 in that case. 0 is a real "no flags" and renders no
            badge at all — not "0 flags".
        status:
          type: string
          enum: [ACTIVE]
          description: Always ACTIVE on this endpoint; REVOKED rows are history and are not listed.
        since:
          type: string
          format: date-time
          description: When the trainee accepted — AC6's "since `<date>`".
        scopes:
          type: array
          description: >-
            The scopes this link carries, verbatim from `coach_clients.scopes` (ADR-0015 B1.1). Read
            the nullable fields above THROUGH this: `currentPlanName` null WITH `WORKOUTS` present is
            "no plan yet"; null WITHOUT it is "not shared". Rendering the first sentence for the
            second case is a statement about a person the coach would act on.
            Never inferred from a 403 — every coach-portal denial answers the same undifferentiated
            body.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
      required: [id, traineeDisplayName, status, since, scopes]
    CoachClientPageResponse:
      type: object
      description: >-
        A page of roster rows. The roster is small today (STARTER allows 2) but every collection
        endpoint paginates without exception — the tier ladder already contemplates 100 profiles.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoachClientSummaryResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
      required: [items, page, size, totalElements, totalPages]
    CoachInviteResponse:
      type: object
      description: >-
        A freshly created invite. `token` is shown ONCE, in this response, and is stored nowhere —
        only its SHA-256 digest reaches the database. It is a credential in a URL: do not log it.
      properties:
        inviteId:
          type: string
          format: uuid
          description: Safe to log; the token is not.
        token:
          type: string
          description: The raw single-use token (43 URL-safe characters).
        expiresAt:
          type: string
          format: date-time
          description: 7 days from creation.
      required: [inviteId, token, expiresAt]
    TraineeAdherence:
      type: object
      description: >-
        "`done` / `planned` sessions" for the current week. Week boundaries are Monday..Sunday in
        **UTC**: the coach's browser sends no X-Timezone and no trainee zone is stored, so this can
        disagree with the trainee's phone across a midnight (ADR-0012 risk (c), story edge case 11).
        `planned` is 0 for a trainee with no plan — nothing scheduled cannot have been missed.
      properties:
        done:
          type: integer
        planned:
          type: integer
      required: [done, planned]
    TraineeLastSession:
      type: object
      description: The trainee's most recent completed session (AC5 block 3).
      properties:
        date:
          type: string
          format: date
          description: UTC date of completion.
        name:
          type: string
          nullable: true
          description: The workout's title; null if the workout row has since gone.
        difficulty:
          type: string
          nullable: true
          enum: [EASY, OK, HARD]
          description: The feedback the trainee gave. Null renders "No feedback given".
      required: [date]
    TraineeWeightPoint:
      type: object
      description: One weigh-in, from the `weigh_ins` table the trainee's own app writes.
      properties:
        date:
          type: string
          format: date
        weightKg:
          type: number
      required: [date, weightKg]
    TraineeProgressResponse:
      type: object
      description: >-
        EV-187a AC3/AC4/AC5. The monitoring page, in three blocks and no fourth horizon: there is no
        date-range picker and `weeks` is a server constant, so a client cannot ask for another
        window.
      properties:
        clientId:
          type: string
          format: uuid
        weeks:
          type: integer
          example: 8
          description: How many ISO weeks the series covers. A server constant.
        adherence:
          allOf:
            - $ref: "#/components/schemas/TraineeAdherenceSeries"
          nullable: true
          description: >-
            NULL when the link does not carry WORKOUTS — the same blanking as the overview's
            `adherenceThisWeek`, so the two pages cannot disagree. Render "not shared" from
            `scopes`.
        sessions:
          allOf:
            - $ref: "#/components/schemas/TraineeSessionHistory"
          nullable: true
          description: >-
            NULL when the link does not carry WORKOUTS: session names and the trainee's difficulty
            feedback are workout CONTENT, the same disclosure as the overview's `lastSession`.
        redFlags:
          type: array
          nullable: true
          description: >-
            The fired flags WITH their evidence — identical, flag for flag, to the overview's
            `redFlags`, because it is one evaluation projected twice. NULL when the link carries
            neither WORKOUTS nor WEIGH_INS (no rule could be evaluated); EMPTY is "No red flags".
            A flag is never returned with an empty evidence block, and evidence is never returned
            for a flag that did not fire.
          items:
            $ref: "#/components/schemas/TraineeFiredRedFlag"
        scopes:
          type: array
          description: The scopes this link carries, verbatim from `coach_clients.scopes`.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
      required: [clientId, weeks, scopes]
    TraineeAdherenceSeries:
      type: object
      description: >-
        AC3's series and its headline. `done` and `planned` are the sums of `weeks[]` — the headline
        "`<done>` of `<planned>` planned sessions in the last 8 weeks" is a sum the coach can check
        by hand, and a test checks it too.
      properties:
        done:
          type: integer
        planned:
          type: integer
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/TraineeWeekAdherence"
      required: [done, planned, weeks]
    TraineeWeekAdherence:
      type: object
      description: >-
        One ISO week, oldest first.
        **`planned` vs `plannedSoFar`** is AC3's two clauses that cannot both be one number: it asks
        for the current week to count only days strictly before today AND for the current week to be
        identical to the shipped "adherence this week" block, which on a Monday are 0/0 and 0/3. Both
        facts are on the wire and neither is invented — `planned` is the shipped block byte for byte,
        `plannedSoFar` is the elapsed-days number that does not render a Monday as a 0 % week
        (ADR-0012 D6). They differ only when `partial` is true.
      properties:
        weekCommencing:
          type: string
          format: date
          description: The Monday of the week — AC3's week-commencing label.
        done:
          type: integer
          description: >-
            Sessions completed in the week, as PLANNED work: 0 whenever `hasPlan` is false, because
            a week nothing was scheduled in contains no planned work to have done. A session
            completed in such a week is still in the session history and in the streak; it is not
            adherence.
        planned:
          type: integer
        plannedSoFar:
          type: integer
        hasPlan:
          type: boolean
          description: >-
            False when no plan existed during this week; `done` and `planned` are then both 0 and
            the client MUST render "No plan", never a 0 % week — a week nothing was scheduled in is
            not a week the trainee failed. Limited by the schema: `user_plan` holds one row per user
            with no history, so this means "the plan they are on now already existed then". A
            trainee who switched plans reads as "No plan" for the weeks before the switch.
            EV-040c's `plan_assignments` is what makes it exact.
        partial:
          type: boolean
          description: True for the week containing today.
      required: [weekCommencing, done, planned, plannedSoFar, hasPlan, partial]
    TraineeSessionHistory:
      type: object
      description: >-
        AC5. The last ten completed sessions, newest first, and the summary line above them.
        `returned` is the REAL count, so the client writes "Of the last 6 sessions: …" for a trainee
        with six and never "of the last 10". `easy + ok + hard + noFeedback == returned`.
      properties:
        returned:
          type: integer
        easy:
          type: integer
        ok:
          type: integer
        hard:
          type: integer
        noFeedback:
          type: integer
        items:
          type: array
          description: >-
            At most 10, newest first. The cap is server-side and there is no parameter that raises
            it; the read is LIMITed at the database on
            `idx_workout_sessions_completed (user_id, completed_at DESC)`, not a full history scan
            filtered in memory.
          items:
            $ref: "#/components/schemas/TraineeSessionHistoryItem"
      required: [returned, easy, ok, hard, noFeedback, items]
    TraineeSessionHistoryItem:
      type: object
      description: One completed session — date, name, difficulty, and nothing else on the row.
      properties:
        date:
          type: string
          format: date
          description: UTC date of completion.
        name:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
          enum: [EASY, OK, HARD]
          description: >-
            Null renders "No feedback given". It is not a fourth value and must not be counted as
            one — `noFeedback` above is where it is counted.
      required: [date]
    TraineeFiredRedFlag:
      type: object
      description: >-
        AC4 — a red flag that fired, with the evidence it fired on. Exactly one evidence field is
        populated, decided by the flag: MISSED_TWO_OR_MORE_SESSIONS carries `missedSessions` (never
        empty — the rule needs two), NO_WEIGH_IN_14_DAYS carries `weighIn`. PAIN_REPORTED can appear
        here never; see `RedFlag`.
      properties:
        flag:
          $ref: "#/components/schemas/RedFlag"
        missedSessions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TraineeMissedSession"
        weighIn:
          allOf:
            - $ref: "#/components/schemas/TraineeWeighInEvidence"
          nullable: true
      required: [flag]
    TraineeMissedSession:
      type: object
      description: >-
        A day that was scheduled, has already passed, and has no completed session on it. Only days
        STRICTLY BEFORE today are ever listed (ADR-0012 D6), and only when a plan existed.
      properties:
        date:
          type: string
          format: date
        sessionName:
          type: string
          nullable: true
          description: >-
            The name of the session scheduled that day. Null when the plan's schedule names no
            workout for it; the client renders the date alone and does not invent a name.
      required: [date]
    TraineeWeighInEvidence:
      type: object
      description: >-
        AC4's second sentence: "Last weigh-in `<date>` — `<N>` days ago", or "Never weighed in".
        Both fields are null TOGETHER, and only for a trainee who has NEVER logged a weight in
        either weight table — they are two views of one fact, so a client never has to reconcile a
        date with no age.
      properties:
        lastWeighInDate:
          type: string
          format: date
          nullable: true
          description: >-
            The most recent weigh-in OF ANY AGE, not bounded by the 8-week chart window. A trainee
            who weighed in nine weeks ago carries that date here while `weightSeries` is empty:
            "nothing recently" and "nothing ever" are different facts and only the second one may be
            rendered as "Never weighed in".
        daysSince:
          type: integer
          nullable: true
    RedFlag:
      type: string
      description: >-
        EV-183 AC5 block 5's vocabulary — exactly three, no more and no fewer. An EMPTY list is
        "No red flags"; there is no fourth code for it.
        **PAIN_REPORTED is never returned.** There is no structured pain signal in the product:
        `Feedback` is {EASY, OK, HARD}, the only pain detection reads AI-chat free text, and
        `workout_completion.notes` exists on the API side but no mobile call site writes it. Rather
        than derive a red flag from a column nothing populates, the server deliberately does not
        compute this rule and always omits it. The constant is published so the client's vocabulary
        is complete and the gap is visible rather than silently absent. ADR-0012 D6; the real source
        is EV-082 plus a PAIN feedback value, at MVE-2.
        NO_WEIGH_IN_14_DAYS is derived from the same merged series as `weightSeries` — over both
        weight tables (BUG-143) — so the flag and the chart can never disagree about whether a
        weigh-in exists. "14 days" is today-13..today inclusive.
      enum: [MISSED_TWO_OR_MORE_SESSIONS, PAIN_REPORTED, NO_WEIGH_IN_14_DAYS]
    TraineeOverviewResponse:
      type: object
      description: >-
        EV-183 AC5's read-only overview, in exactly the five blocks the AC lists, plus ADR-0015 B1's
        `scopes`. The endpoint itself requires an ACTIVE link and NO data scope (ADR-0015 R2-2):
        requiring one would 403 the portal's whole client area through `[id]/layout.tsx`, Nutrition
        tab included, for a link that shared nutrition. Each block instead blanks on its own scope,
        and "absent" is null with this contract saying "not shared" — never a zero or a placeholder
        that reads like data.
      properties:
        clientId:
          type: string
          format: uuid
        traineeDisplayName:
          type: string
        since:
          type: string
          format: date-time
        adherenceThisWeek:
          allOf:
            - $ref: "#/components/schemas/TraineeAdherence"
          nullable: true
          description: >-
            NULL when this link does not carry the WORKOUTS scope (ADR-0015 R2-2 — the overview
            requires no data scope and blanks per block). Render "This trainee has not shared their
            workouts with you." from `scopes`, never 0/0, which reads like a trainee who did nothing.
        currentStreakDays:
          type: integer
          nullable: true
          description: >-
            NULL when this link does not carry the PROGRESS scope. 0 means a real streak of zero.
        lastSession:
          allOf:
            - $ref: "#/components/schemas/TraineeLastSession"
          nullable: true
          description: >-
            Null renders "No feedback given" / no last session, and is also what a link without
            WORKOUTS receives.
        weightSeries:
          type: array
          nullable: true
          description: >-
            Body weights over the last 8 weeks, oldest first, at most one point per date. NULL when
            this link does not carry the WEIGH_INS scope; an EMPTY array renders "No weigh-ins in the
            last 8 weeks". The two are different facts and the client must not collapse them.
            **Both weight tables feed this (BUG-143):** `POST /me/nutrition/weigh-in` (`weigh_ins`)
            and the Body-measurements screen's `POST /me/measurements` (`body_measurements`). They
            are merged by date and the later log wins the date, compared on `created_at`; on an
            exact tie the weigh-in wins, because `weigh_ins` holds at most one row per day and is
            the series the trainee's own nutrition chart draws. A measurement carrying no weight is
            not a weigh-in and plots nothing.
          items:
            $ref: "#/components/schemas/TraineeWeightPoint"
        redFlags:
          type: array
          nullable: true
          description: >-
            Zero or more codes. NULL when this link carries neither WORKOUTS nor WEIGH_INS, so no
            rule could be evaluated at all; EMPTY means "No red flags". Each rule is gated on its own
            scope: MISSED_TWO_OR_MORE_SESSIONS needs WORKOUTS, NO_WEIGH_IN_14_DAYS needs WEIGH_INS —
            a flag is never raised from data the coach was not given.
          items:
            $ref: "#/components/schemas/RedFlag"
        scopes:
          type: array
          description: >-
            The scopes this link carries, verbatim from `coach_clients.scopes` (ADR-0015 B1). This is
            what the portal renders "This trainee has not shared their X with you." from, and what it
            hides tabs from. It must NEVER infer a scope from a 403: every coach-portal denial — no
            such link, another coach's client, revoked, scope missing — answers the same
            undifferentiated 403 COACH_ACCESS_DENIED body, so a 403 carries no information about
            which scope is missing.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
        progressGoal:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressGoal"
          nullable: true
          description: >-
            EV-202a's block 6 — where the trainee started, where they are and where they are going.
            NULL when this link does not carry the WEIGH_INS scope; render "This trainee has not
            shared their weigh-ins with you." from `scopes`, never from a 403.
            It is NON-null even for a trainee who has never recorded anything: every reading inside
            is then null, which renders "X hasn't recorded a weight yet" while the milestone field
            stays editable and still saves.
            ⚠ The WEIGH_INS grant delivers BODY FAT from EV-202a onward, which is why EV-202c widens
            the consent description to name body composition and must reach devices before this is
            deployed.
      required:
        - clientId
        - scopes
    TraineeProgressGoal:
      type: object
      description: >-
        EV-202a. **Two values are written by the coach** (`startedOn`, `milestoneWeightKg`) and four
        are DERIVED from the trainee's own `weigh_ins` / `body_measurements` rows. There is no write
        path for a start weight, a current weight, a start body fat or a current body fat, and no
        request field that could carry one: the trainee owns their body data and already records it,
        and a derived baseline cannot go stale against the chart printed below it.
        🔴 **G-GOAL**: `milestoneWeightKg` is a NARRATIVE number. No routine generator, no nutrition
        target calculation, no prompt and no policy reads it — enforced by two release-blocking
        tests, a static one and a difference-of-zero one. A coach typing 60 here moves nobody's
        calorie target by one kilocalorie.
        **Null is a fact, and there are three different ones.** A null `Reading` is "no reading on
        or after the start date" or "not recorded", never 0. A null delta is "one end is missing",
        while 0.0 is a real delta. A null `milestoneWeightKg` renders NO row at all on the trainee's
        screen — no empty state, no placeholder, no call to action.
      properties:
        startedOn:
          type: string
          format: date
          description: >-
            The start of the COACHING/programme — NOT the link date, which is
            `TraineeOverviewResponse.since` and a different fact. Never null: it falls back to the
            link date, and `startedOnSource` says so. May be in the future.
        startedOnSource:
          type: string
          enum: [COACH, SELF, LINK_DEFAULT]
          description: >-
            LINK_DEFAULT means nobody set a start date and this is the date the trainee accepted.
            Print the provenance; do not pass a defaulted date off as a typed one.
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg on write; outside that, 400
            COACH_MILESTONE_OUT_OF_RANGE and NOTHING is written, never a silent clamp.
        milestoneSetByName:
          type: string
          nullable: true
          description: >-
            Who set the milestone. Null WITH a milestone present is "set by a coach who has left" —
            the `ON DELETE SET NULL` fired and the number is unchanged.
        milestoneSource:
          type: string
          nullable: true
          enum: [COACH, SELF]
        milestoneUpdatedAt:
          type: string
          format: date-time
          nullable: true
        startWeight:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
          description: >-
            The first weight reading on or after `startedOn`, merged across both weight tables by
            the SAME per-date rule `weightSeries` uses, so the block and the chart cannot disagree.
            Null renders "No reading on or after {date}" — never 0 and never the earliest reading of
            all time.
        currentWeight:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
        startBodyFat:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
          description: >-
            Body fat lives ONLY on `body_measurements`; `weigh_ins` has no such column. A trainee
            who logs through the weigh-in screen therefore has a weight and no body fat, and "Not
            recorded" is a different fact from "no weigh-in" — do not collapse them and do not
            render 0 %.
        currentBodyFat:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
        weightDeltaKg:
          type: number
          format: double
          nullable: true
          description: current − start. Null unless both ends exist; 0.0 is real.
        bodyFatDeltaPts:
          type: number
          format: double
          nullable: true
          description: current − start, in percentage POINTS.
        weightToGoKg:
          type: number
          format: double
          nullable: true
          description: >-
            milestone − current weight. Positive is a bulk and negative a cut; no direction is
            assumed and no warning fires. 0.0 is an exact hit, with no celebration and no event.
      required:
        - startedOn
        - startedOnSource
    TraineeMilestone:
      type: object
      description: >-
        EV-202e. The TRAINEE's own view of the milestone weight a coach set for them — a deliberate
        subset of `TraineeProgressGoal`, not an unfinished superset.
        **Four fields and the list is closed.** The coach reads a progress report because they are
        assessing the work; the trainee is told one fact — a number someone else set about their
        body, and who set it. `weightToGoKg` in particular is absent on purpose: it is SIGNED, a
        bulk and a cut both have one and neither is a failure, and a field that is not on the wire
        cannot be rendered by a later edit.
        🔴 **G-GOAL**: `milestoneWeightKg` is a NARRATIVE number. Nothing generates from it and
        nothing renders it as a number the app is working toward.
        **All four keys are always present, nulls included.** `milestoneSetByName` is three-way for
        the client — a name, `null` (the coach's account was erased, the number is unchanged, "set
        by a coach who has left"), or ABSENT (an older server said nothing). This endpoint never
        produces the third, which is exactly why it must not suppress the second.
      properties:
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg as written by the coach. Null renders NO row at
            all on the trainee's screen: no empty state, no "not set" placeholder, no call to
            action.
        milestoneSetByName:
          type: string
          nullable: true
          description: >-
            The coach's display name, by the same rule as the `/me/plan` byline. Null WITH a
            milestone present is "set by a coach who has left".
        milestoneSource:
          type: string
          nullable: true
          enum: [COACH, SELF]
          description: >-
            Served verbatim, never normalised. No trainee writer exists, so SELF is unreachable
            today; a client that has no honest sentence for a milestone a coach did not set must be
            able to RECOGNISE the source in order to refuse to describe it.
        milestoneUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the goal row was last written. Null when there is no milestone.
    TraineeProgressReading:
      type: object
      description: >-
        One reading and the day it was recorded. Every reading carries its own date because the
        weight and body-fat columns resolve independently and may name different days — a
        measurement row may carry a body fat and no weight.
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
      required:
        - date
        - value
    Routine:
      type: object
      description: >-
        A complete personalized weekly routine. The SAME contract `PUT /me/coach/routine` accepts and
        `coach_plan_drafts.document` stores — one shape, not two: the draft is a copy of this record,
        round-tripped by the same Jackson mapper and validated by the same constraints on read as on
        write, and a build-time hash over the reachable record graph fails the build if the shape
        changes without a bump of the draft's `schema_version`.
        Defined here in EV-184a because the coach portal is the first client that must construct one
        (the spec previously typed it as an untyped `object`).
      properties:
        name:
          type: string
        goal:
          type: string
          example: BUILD_MUSCLE
        level:
          type: string
          example: BEGINNER
        daysPerWeek:
          type: integer
          minimum: 2
          maximum: 6
          description: >-
            Derived from `trainingDays.length` on write: a routine declaring 4 days while carrying 1
            is what produced BUG-011's 409, and the server reconciles rather than trusting.
        trainingDays:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/TrainingDay"
        weeklyProgression:
          type: array
          items:
            $ref: "#/components/schemas/ProgressionRule"
        constraints:
          $ref: "#/components/schemas/RoutineConstraints"
        summary:
          type: string
          nullable: true
      required: [name, goal, level, daysPerWeek, trainingDays, weeklyProgression, constraints]
    TrainingDay:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO day of week, 1 = Monday.
        focus:
          type: string
        estimatedMinutes:
          type: integer
          nullable: true
        exercises:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutineExercise"
      required: [dayOfWeek, focus, exercises]
    RoutineExercise:
      type: object
      properties:
        name:
          type: string
          description: >-
            The coach PICKS this from GET /coach-portal/catalog/exercises and never types it
            (EV-184 AC2). It is matched to a catalog slug at write time; an unmatched name persists
            as an UNRESOLVED binding by design (ADR-0009 D6), which is exactly why the coach may not
            publish against an empty catalog.
        sets:
          type: integer
          minimum: 1
          maximum: 20
        reps:
          type: string
          nullable: true
          description: >-
            A STRING: "8-12" and "AMRAP" are both real prescriptions. Null for a DURATION exercise.
        rest:
          type: string
          example: 90s
        tempo:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        trackingType:
          type: string
          enum: [WEIGHT_REPS, DURATION]
          nullable: true
          description: Null is treated as WEIGHT_REPS for backward compatibility.
        durationSeconds:
          type: integer
          nullable: true
        weight:
          type: string
          nullable: true
      required: [name, sets, rest]
    ProgressionRule:
      type: object
      properties:
        week:
          type: integer
          minimum: 1
          maximum: 52
        adjustment:
          type: string
        rationale:
          type: string
          nullable: true
      required: [week, adjustment]
    RoutineConstraints:
      type: object
      description: >-
        The constraints the routine was built to respect, echoed back. On any WRITE path the server
        resolves injuries and equipment from `user_profiles` instead: injuries here are UNIONED with
        the stored ones (every extra injury narrows what may be prescribed) and equipment here is
        IGNORED entirely (a payload claiming ["GYM"] would hand a cable machine to someone who owns
        nothing — BUG-053). A coach MUST submit both — they are required on `Routine`, so a document
        omitting either is rejected — but neither is read as a claim about the trainee.
      properties:
        equipment:
          type: array
          items:
            type: string
        injuries:
          type: array
          items:
            type: string
        minutesPerSession:
          type: integer
        daysPerWeek:
          type: integer
          minimum: 2
          maximum: 6
      required: [equipment, injuries, minutesPerSession, daysPerWeek]
    CoachNutritionTargets:
      type: object
      description: >-
        EV-185 AC1 — the trainee's macro targets as the coach sees them. There is no `setBy` uuid
        here and that is a ruling, not an omission (ADR-0015 D6 amendment (b)/Q2).
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        source:
          type: string
          enum: [AUTO, MANUAL, COACH]
          description: >-
            AUTO = calculated by the engine · MANUAL = set by the trainee · COACH = set by a coach.
            Never render this alone: COACH with `setByYou: false` is "Set by another coach", which a
            re-link after a revoke and an erased coach account both produce.
        activity:
          type: string
          nullable: true
          description: The trainee's ActivityLevel, or null if they never completed onboarding.
        setByYou:
          type: boolean
          description: >-
            Did the SIGNED-IN coach write this target? Computed server-side from
            `nutrition_targets.set_by`, which the portal never receives.
        updatedAt:
          type: string
          format: date-time
      required: [calories, proteinG, carbsG, fatG, source, setByYou, updatedAt]
    CoachProgressGoalRequest:
      type: object
      description: >-
        EV-202a. The two values a coach types. Both are optional and both are CLEARED by omitting
        them — see the endpoint's description for why an omission is a write.
        There is deliberately no field for a start weight, a current weight, a body-fat value, a
        milestone body fat, a milestone waist or a milestone DATE: each was ruled out by name, and
        a request type with no field for a number is the only way "the coach cannot type that
        number" survives the next refactor.
      properties:
        startedOn:
          type: string
          format: date
          nullable: true
          example: "2026-06-01"
          description: >-
            The start of the coaching/programme. May be in the future — the Start column then reads
            "No reading on or after {date}" and the delta cell is EMPTY, never 0.
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg; outside that, 400 COACH_MILESTONE_OUT_OF_RANGE
            and nothing is written. Never clamped.

    CoachTargetsRequest:
      type: object
      description: EV-185 AC2 — what a coach may write about a trainee's nutrition; four numbers.
      properties:
        calories:
          type: integer
          minimum: 800
          maximum: 8000
        proteinG:
          type: integer
          minimum: 0
          maximum: 500
        carbsG:
          type: integer
          minimum: 0
          maximum: 1200
        fatG:
          type: integer
          minimum: 0
          maximum: 400
      required: [calories, proteinG, carbsG, fatG]
    CoachTargetsResult:
      type: object
      properties:
        targets:
          $ref: "#/components/schemas/CoachNutritionTargets"
        floorCalories:
          type: integer
          nullable: true
          description: >-
            Non-null exactly when the engine's safety floor RAISED the calories, and then equal to
            the stored value. A NUMBER and never a sentence — the floor is 1500/1200 by profile sex
            and this surface does not know the trainee's sex and must not guess it.
      required: [targets]
    CoachMealWeek:
      type: object
      description: EV-185 AC1/AC3 — the trainee's current meal week.
      properties:
        weekStart:
          type: string
          format: date
        mealStructure:
          nullable: true
          description: >-
            EV-190a / N1 — the meal structure this week was GENERATED against, or null when the
            trainee's own stored preference was used. This is the "asked for" half of the
            reconciliation line; the "returned" half is the meal count the portal reads off
            `days[].meals`, so both numbers come from one payload and cannot disagree about which
            week they describe.
          allOf:
            - $ref: "#/components/schemas/CoachMealStructure"
        days:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlannedDay"
        status:
          type: string
          enum: [GENERATING, ACTIVE, REFUSED, ARCHIVED]
          description: >-
            EV-071b / ruling 6 addendum 6.1 — the week's lifecycle state, the same vocabulary the
            trainee's own week carries.


            REFUSED is the reason it exists: a refused week keeps ONLY the meals the trainee had
            already eaten (ruling 5.6), so before this field a coach opening a refused trainee's
            week saw a sparse week with no explanation and nothing to tell it apart from a thin
            one. The portal renders its read-side (C) from THIS value, never from a low day count.
      required: [weekStart, days, status]
    CoachMealStructure:
      type: object
      description: EV-190a — meals per day and snacks, as a property of ONE WEEK.
      properties:
        mealsPerDay:
          type: integer
          minimum: 1
          maximum: 6
        snacksEnabled:
          type: boolean
      required: [mealsPerDay, snacksEnabled]
    CoachPlannedDay:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 6
        date:
          type: string
          format: date
        trainingDay:
          type: boolean
        meals:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlannedMeal"
        origin:
          type: string
          enum: [GENERATED, REPLACED, STANDARD, UNKNOWN]
          description: >-
            EV-071b / ruling 6 addendum 6.1 — what produced THIS DAY, with exactly the four values
            and meanings ruling 6 fixed for `WeeklyPlanDay.origin`. The coach's (A)/(B) line counts
            REPLACED days off this field.


            It cannot be derived client-side: a catalogue day and a model day are identical in this
            payload too, and matching meal names against the stub templates is forbidden. Until a
            client reads this, it renders neither banner and never a guess — absent must be
            indistinguishable from "we do not know".
      required: [index, date, trainingDay, meals, origin]
    CoachPlannedMeal:
      type: object
      properties:
        mealId:
          type: string
          format: uuid
        slot:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        locked:
          type: boolean
          description: >-
            The TRAINEE locked this meal (by swapping it). An apply reuses the plan row and carries
            locked meals forward, so without this flag the confirm dialog's promise — "meals the
            trainee has locked are kept" — is unverifiable on the screen that follows it.
        provenance:
          type: string
          enum: [ENGINE, COACH_RECIPE]
          description: >-
            EV-256c AC10 (ADR-0026 D26.9). Who wrote THIS meal's content. ENGINE = the meal engine;
            COACH_RECIPE = a coach placed one of their recipes on it.
        placedByYou:
          type: boolean
          description: >-
            EV-256c AC10 (story R4). True exactly when the VIEWING coach placed this recipe
            ("Your recipe"); a COACH_RECIPE meal with this false is "Coach recipe" (another coach, or
            an erased one). Always false on an ENGINE meal. Derived server-side; no user id is
            served.
      required: [mealId, slot, name, kcal, proteinG, carbsG, fatG, locked, provenance, placedByYou]
    CoachTraineeDietProfile:
      type: object
      description: >-
        The trainee's stored `nutrition_preferences`, READ-ONLY. Nothing here is submittable: no
        request type on this prefix carries an allergy, a rule or a dislike.
      properties:
        allergies:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            type: string
            enum: [HALAL, KOSHER]
          description: Hard exclusions, enforced exactly like allergies.
        dislikes:
          type: array
          items:
            type: string
      required: [allergies, rules, dislikes]
    CoachNutritionResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        traineeDisplayName:
          type: string
          nullable: true
        targets:
          allOf:
            - $ref: "#/components/schemas/CoachNutritionTargets"
          nullable: true
          description: Null for a trainee who has never had targets.
        week:
          allOf:
            - $ref: "#/components/schemas/CoachMealWeek"
          nullable: true
          description: Null when the trainee has no plan for the current week.
        currentWeekStart:
          type: string
          format: date
          description: The Monday the SERVER considers current. The portal never computes its own.
        dietProfile:
          $ref: "#/components/schemas/CoachTraineeDietProfile"
        recipePlacementEnabled:
          type: boolean
          description: >-
            EV-256c AC15 (story R5). Whether "Use one of my recipes" is available. False while
            bfit.coach.recipes.placement.enabled is off; the portal hides the action and the
            placement POST answers 404.
      required: [clientId, currentWeekStart, dietProfile, recipePlacementEnabled]
    CoachApplyWeekRequest:
      type: object
      properties:
        weekStart:
          type: string
          format: date
          description: >-
            The Monday to apply. Required rather than defaulted: the confirm dialog names a week,
            and a server that silently substituted its own would make that dialog a claim nobody
            checked.
        mealStructure:
          nullable: true
          description: >-
            EV-190a / N1 — meals per day + snacks for THIS WEEK ONLY. Omit it (or send null) to
            generate against the trainee's own stored preference, which is what every apply did
            before EV-190a.
            Its own request type rather than the trainee's preferences payload, and that IS the
            mechanism: `NutritionPreferencesRequest` carries fifteen fields including `allergies`,
            `foodRules` and `dietaryPattern` on a whole-row replace, so an endpoint bound to it
            would wipe a trainee's allergy list on the first partial submission with every
            closed-key-list test still green — `mealsPerDay` is a permitted key.
            Both fields are required together: they are one fact, and a week carrying a coach's
            meal count beside the trainee's own snack answer is a structure nobody chose.
            Any other key inside this object is refused with 400 COACH_FIELD_NOT_ACCEPTED, for the
            same reason the object exists at all.
          allOf:
            - $ref: "#/components/schemas/CoachMealStructure"
      required: [weekStart]
    CoachSwapOptions:
      type: object
      properties:
        mealId:
          type: string
          format: uuid
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CoachSwapCandidate"
      required: [mealId, candidates]
    CoachSwapCandidate:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
      required: [index, name, kcal, proteinG, carbsG, fatG]
    CoachPlaceRecipeRequest:
      type: object
      description: EV-256c. The only field; the trainee is the path's id and the meal its mealId.
      properties:
        recipeId:
          type: string
          format: uuid
          description: One of the calling coach's own recipes.
      required: [recipeId]
    CoachApplySwapRequest:
      type: object
      properties:
        candidateIndex:
          type: integer
          minimum: 0
          maximum: 20
      required: [candidateIndex]
    CoachRoutineResponse:
      type: object
      description: EV-184 AC1 — the trainee's live routine, as the coach sees it.
      properties:
        clientId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
          nullable: true
        planName:
          type: string
          nullable: true
          description: >-
            Null renders AC1's "No active plan" empty state with one "Build a plan" control — never
            a blank page.
        routine:
          allOf:
            - $ref: "#/components/schemas/Routine"
          nullable: true
          description: Null for a trainee who has never had a routine (edge case 9).
        guardrails:
          $ref: "#/components/schemas/CoachRoutineGuardrails"
        hasDraft:
          type: boolean
        draftUpdatedAt:
          type: string
          format: date-time
          nullable: true
      required: [clientId, guardrails, hasDraft]
    CoachRoutineGuardrails:
      type: object
      description: >-
        AC1's read-only panel, rendered under "From the trainee's profile — you cannot change these
        here." Display only, and enforced server-side rather than by the UI: the policy resolves
        injuries and equipment from user_profiles, and so does the plans.equipment column the
        trainee's own app reads on GET /me/plan (BUG-185). A submitted routine document must carry
        a constraints block (both lists are required on Routine), but submitted equipment is
        ignored, and submitted injuries are unioned with the stored ones — they can only narrow
        what may be prescribed, never widen it.
      properties:
        injuries:
          type: array
          items:
            type: string
        equipment:
          type: array
          items:
            type: string
        equipmentChecked:
          type: boolean
          description: >-
            Whether a non-empty equipment list reaches the policy for this trainee. DERIVED from the
            stored profile, never hardcoded: [] is "unanswered", which allows every rung and narrows
            nobody. The portal must render no equipment-safety sentence while this is false.
      required: [injuries, equipment, equipmentChecked]
    CoachRoutineDraftResponse:
      type: object
      description: The coach's unpublished draft for this link.
      properties:
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          nullable: true
          description: Null when no draft exists — the editor then opens on the published routine.
        schemaVersion:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        sourceTemplateId:
          type: string
          format: uuid
          nullable: true
          description: >-
            EV-188a. Which template this draft was started from, for the editor's "Started from
            {name}" line. Null for a hand-built draft, and null again once that template is deleted
            (ON DELETE SET NULL). It is never provenance on the PUBLISHED plan: publish deletes the
            draft row, so after a publish no row anywhere joins a plan to a template — which is what
            makes back-propagation underivable rather than merely disabled.
        unbindableExercises:
          type: array
          items:
            type: string
          description: >-
            EV-188 AC5. Exercise names in this draft that the catalogue would not match today,
            RE-DERIVED on every open and NEVER stored. A stored staleness flag is a cache of an
            opinion about a catalogue that moves: wrong from the moment it is written, surviving the
            sync that fixes it, and needing a sweeper. Because it is transient, a mark computed over
            a half-built index is wrong for at most one page view. The marks may legitimately differ
            between two opens of an UNEDITED draft — that is the honest rendering of a fuzzy matcher
            over a moving catalogue, and nothing here ever removes an exercise.
        catalogChecked:
          type: boolean
          description: >-
            Whether the catalogue check ran at all. FALSE with an empty list means NOT CHECKED,
            which is a different fact from "checked and clean" — the same distinction
            `GuardrailInputs.equipmentChecked` exists for. On a fresh deploy the derived index is
            built over zero rows and a naive recompute would mark every exercise in every draft.
            This read does NOT answer 503 for that: refusing to open a draft because a background
            sync is in flight is a worse failure than an unchecked one.
    CoachTemplateSaveRequest:
      type: object
      description: A routine template to create or replace.
      required: [name, document]
      properties:
        name:
          type: string
          maxLength: 80
          description: >-
            Unique per coach, folded for case and surrounding whitespace. VARCHAR(80) counts
            CHARACTERS; JavaScript's .length counts UTF-16 code units. They agree for BMP characters
            — including Arabic base letters and harakat — and disagree for anything outside the BMP,
            i.e. emoji, where JS counts 2 and Postgres counts 1.
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          description: >-
            The routine document. `constraints.equipment` and `constraints.injuries` are @NotNull on
            the shared Routine type, so a caller CANNOT omit them — and the server reads neither as
            a claim about anybody: both are stored empty and any row where they are not is refused
            when it is read back.
    CoachTemplateRenameRequest:
      type: object
      description: A new name for an existing template.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
    CoachTemplateFromRoutineRequest:
      type: object
      description: Save this trainee's routine into the coach's own library.
      required: [name, source]
      properties:
        name:
          type: string
          maxLength: 80
          description: Pre-named with the plan's name by the portal, editable before saving.
        source:
          type: string
          enum: [PLAN, DRAFT]
          description: >-
            A closed enum rather than a boolean. "From the published plan" and "from my unpublished
            draft" are two facts, and a boolean named fromDraft would make the third source somebody
            adds a second boolean.
    CoachTemplateApplyRequest:
      type: object
      description: Which trainee to put this template on, and what it may replace.
      required: [clientId]
      properties:
        clientId:
          type: string
          format: uuid
          description: >-
            The coach_clients link id for the target trainee. It is a link id in a BODY, which this
            prefix otherwise never does — and it is still not trusted: it is resolved through
            requireActiveLinkRow(principal, clientId, WORKOUTS) exactly as a path segment would be.
            The URL addresses the TEMPLATE because that is the resource the capability is minted
            from; the trainee is the second subject of a two-subject operation and both are checked.
        replacesDraftUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The updatedAt of the draft this apply is allowed to replace, echoed from a previous
            409 COACH_DRAFT_EXISTS. ABSENT means "only if there is no draft".
    CoachTemplateResponse:
      type: object
      description: A routine template in the coach's private library.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        schemaVersion:
          type: integer
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          description: >-
            The prescription. `constraints.equipment` and `constraints.injuries` are ALWAYS empty —
            a template carries no answer a trainee gave about themselves. `minutesPerSession` and
            `daysPerWeek` are the coach's own prescription and do survive.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CoachTemplateSummaryResponse:
      type: object
      description: >-
        One row of the library list: name, day count, exercise count, last-updated — and nothing
        else. The two counts are derived from the document in Java, per row, on every list call. NOT
        denormalised counter columns: two columns to keep in step with a document, for a list a
        coach opens by hand.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dayCount:
          type: integer
        exerciseCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CoachTemplateListResponse:
      type: object
      description: >-
        The coach's library, newest-updated first. Unpaged, and that is a bounded decision rather
        than an unbounded query: the cap is 50 rows per coach, enforced at the write under a
        pessimistic lock.
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/CoachTemplateSummaryResponse"
        limit:
          type: integer
          description: >-
            The product cap on templates per coach. Served so the portal can render the refusal copy
            without hard-coding the number. It is a PRODUCT bound — a flat list of 50 needs no
            folders, tags or search — and NOT a storage control: it bounds the count, not the size.
        remaining:
          type: integer
          description: >-
            How many more this coach may create, so "Delete one to make room" can be shown BEFORE
            the 409 rather than only after it.
    CoachTemplateApplyResponse:
      type: object
      description: The trainee's draft, as it now stands after a template was copied into it.
      properties:
        clientId:
          type: string
          format: uuid
        sourceTemplateId:
          type: string
          format: uuid
        sourceTemplateName:
          type: string
        document:
          $ref: "#/components/schemas/Routine"
        updatedAt:
          type: string
          format: date-time
        replacedExistingDraft:
          type: boolean
        unbindableExercises:
          type: array
          items:
            type: string
          description: >-
            Advisory and never persisted. A template holds a NAME, not a catalogue reference, so
            "stale" can only mean "the fuzzy matcher would not bind this name today" — an opinion
            about a catalogue that moves and that can be half-synced. Deleting a coach's programming
            on that opinion would make the same name behave two ways depending on which button the
            coach pressed, and would turn a transient into a permanent loss. The decision moves from
            the matcher to the coach, who can still reach the same end state by pressing Remove.
        catalogChecked:
          type: boolean
          description: >-
            Whether the catalogue check could run. FALSE with an empty list is "not checked", which
            is not the same fact as "checked and clean".
    CoachRecipeSaveRequest:
      type: object
      description: >-
        A recipe to create or replace. One serving. Unknown properties are ignored and never
        stored: the stored document is built from these fields only.
      required: [name, ingredients, kcal, proteinG, carbsG, fatG, steps]
      properties:
        name:
          type: string
          description: >-
            1..80 characters AFTER trimming (Unicode spaces fold, zero-width characters are
            removed). No control character or line break. Unique per coach, ignoring case and
            surrounding spaces.
          example: Chicken rice bowl
        ingredients:
          type: array
          minItems: 1
          maxItems: 25
          description: Each key at most once.
          items:
            $ref: "#/components/schemas/CoachRecipeIngredientRequest"
        kcal:
          type: integer
          minimum: 1
          maximum: 3000
          description: >-
            Must be within max(50, 15%) of 4·proteinG + 4·carbsG + 9·fatG. kcal and the three
            macros must be whole numbers: a fractional value (300.9, 559.99) is refused with
            VALIDATION_ERROR naming the field, never truncated; 50.0 is accepted.
        proteinG:
          type: integer
          minimum: 0
          maximum: 300
        carbsG:
          type: integer
          minimum: 0
          maximum: 300
        fatG:
          type: integer
          minimum: 0
          maximum: 300
        steps:
          type: array
          maxItems: 15
          items:
            type: string
            maxLength: 300
            description: Not blank once trimmed. No control character or line break.
    CoachRecipeIngredientRequest:
      type: object
      required: [key, quantity, unit]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
          description: >-
            A canonical ingredient key exactly as `GET /coach-portal/ingredients` returned it. A key
            that is blank, has upper case, fails the pattern or is not in the vocabulary is refused
            with COACH_RECIPE_UNKNOWN_INGREDIENT (not VALIDATION_ERROR).
          example: chicken_breast
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 5000
          description: Greater than 0, at most 5000, at most 2 decimal places.
          example: 150
        unit:
          type: string
          enum: [g, ml, piece]
    CoachRecipeResponse:
      type: object
      description: >-
        A recipe in the coach's private library. No timestamps: no client reads one, and the
        library is alphabetical.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CoachRecipeIngredientResponse"
        steps:
          type: array
          items:
            type: string
        unknownKeys:
          type: array
          items:
            type: string
          description: >-
            Keys in this recipe that are no longer in the vocabulary (a key can be retired after the
            recipe was saved). The recipe still reads. Empty in the normal case.
    CoachRecipeIngredientResponse:
      type: object
      properties:
        key:
          type: string
          example: chicken_breast
        label:
          type: string
          description: Derived from the key on every read (underscores become spaces); never stored.
          example: chicken breast
        quantity:
          type: number
          example: 150
        unit:
          type: string
          enum: [g, ml, piece]
    CoachRecipeSummaryResponse:
      type: object
      description: One row of the recipe library.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        ingredientCount:
          type: integer
    CoachRecipeListResponse:
      type: object
      description: The coach's recipe library, alphabetical by name.
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/CoachRecipeSummaryResponse"
        limit:
          type: integer
          description: The product cap on recipes per coach (100), so the portal can show "{n} of 100".
          example: 100
        remaining:
          type: integer
          description: How many more this coach may create.
    CoachIngredientOption:
      type: object
      description: An ingredient a coach may put in a recipe.
      properties:
        key:
          type: string
          example: chicken_breast
        label:
          type: string
          example: chicken breast
    CoachPublishPreviewResponse:
      type: object
      description: What publishing this draft would change, and the token that acknowledges it.
      properties:
        repairs:
          type: array
          description: >-
            One line per repair, in the engine's own words. EMPTY means the modal reads "No changes
            were needed" with a single "Publish" control.
          items:
            type: string
        repairCount:
          type: integer
          description: >-
            `repairs.length`, so AC3's heading "We changed N things to keep this safe" cannot
            disagree with the list beside it. Equal BY CONSTRUCTION to the publish result's
            `repairCount`: publish re-runs the policy and refuses on any mismatch, so the two
            numbers cannot differ.
        digest:
          type: string
          description: >-
            SHA-256 over (the link id, the canonical draft document, the canonical ordered repairs).
            Echo it to publish. It is not a timestamp — two writes in one transaction share a now(),
            and the fixed test Clock makes that collision reproducible rather than rare.
        equipmentChecked:
          type: boolean
          description: See CoachRoutineGuardrails.equipmentChecked. Derived, never hardcoded.
      required: [repairs, repairCount, digest, equipmentChecked]
    CoachPublishRequest:
      type: object
      description: >-
        Acknowledge the previewed repairs and publish. Deliberately NOT `{"confirm": true}`: a
        constant carries no information about what was acknowledged. It carries no coachId, no
        traineeId and no routine — the subject is the URL segment and the document is the stored
        draft.
      properties:
        digest:
          type: string
          maxLength: 128
      required: [digest]
    CoachPublishResultResponse:
      type: object
      properties:
        planId:
          type: string
          format: uuid
          description: >-
            The NEW plan id. Every publish creates a new plans row and deactivates the previous one.
        repairs:
          type: array
          items:
            type: string
        repairCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
      required: [planId, repairs, repairCount, publishedAt]
