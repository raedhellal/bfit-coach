  /me/workout/complete:
    post:
      summary: Complete workout
      description: >-
        Also served at `/me/workouts/complete`. A client-sent `date` may not be in the future
        (EV-248): see `X-Timezone` for the bound. Past dates are accepted. With no `date` the
        session is filed under the day it started in the `X-Timezone` zone (completion time minus
        `durationSeconds`), never more than one day before the day it ended; UTC when the header is
        absent or unresolvable (EV-250 / ADR-0025). The completion time recorded is always the
        moment of the request. A re-post of the same workout filed on the same day updates that
        session rather than adding one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompletionTimeZoneHeader"
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutCompletionLogRequest"
              example:
                planId: "8f2c1f3a-3c1a-4b7a-9e11-3c6a2d9d7b2e"
                workoutId: "db90f318-2b9f-4c36-9e8a-2d0b8791a0f2"
                date: "2026-01-11"
                durationSeconds: 1320
                exercises:
                  - slug: "push_up"
                    name: "Push Ups"
                    orderIndex: 1
                    setsCompleted: 3
                    repsCompleted: 30
                    timeSeconds: 45
                difficulty: "OK"
      responses:
        "200":
          description: Completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutCompletionLogResponse"
              example:
                sessionId: "4b4c2a5b-6e68-4d7a-9ef1-3bf5f6b0e46b"
                progressSummary:
                  totalWorkouts: 13
                  currentStreakDays: 4
                  longestStreakDays: 6
                  lastCompletedAt: "2026-01-11T19:00:00Z"
        "400":
          description: >-
            Invalid request, or `COMPLETION_DATE_IN_FUTURE`: `date`, or the day the session is
            recorded as ending (`date` 00:00 UTC + `durationSeconds`, for a date other than the
            server's today), is after the caller's local today (readable `X-Timezone`) or after the
            server's today + 1 day (no readable `X-Timezone`). Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            Not found. EV-063: a workout or session that belongs to another account answers 404
            here too — identical to one that does not exist, so the id cannot be probed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
