        One exercise as prescribed by GET /me/today-workout, GET /me/plan/day/{dayOfWeek} and
        GET /me/plan/week. Since BUG-121 it carries the same exerciseType and durationSeconds as
        WorkoutExerciseResponse (GET /workouts/{id}), and never invents a rep count.
      properties:
        slug:
          type: string
        name:
          type: string
        sets:
          type: integer
        reps:
          type: integer
          nullable: true
          description: >-
            Prescribed reps, or null when the exercise prescribes none — a DURATION hold, or a row
            whose reps column is NULL. Never defaulted (BUG-121: this used to be reported as 8).
            Rep and set progression is applied to rep-based rows only; rest progression applies to
            every row.
        restSeconds:
          type: integer
        order:
          type: integer
        equipmentRequired:
          type: string
        suggestedSecondsPerExercise:
          type: integer
          nullable: true
        exerciseType:
          type: string
          enum: [WEIGHTED, BODYWEIGHT, DURATION]
          nullable: true
          description: >-
            How the exercise is logged, resolved from exercise_catalog by session slug. Null when
            the slug resolves to no catalog row (ADR-0009).
        durationSeconds:
          type: integer
          nullable: true
          description: Target time for a DURATION hold, in seconds. Null for rep-based rows.
