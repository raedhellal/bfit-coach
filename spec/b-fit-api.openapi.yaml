  /admin/users:
    get:
      summary: List or search users (admin)
      description: >-
        Without q, or with an empty q: every user, newest first (createdAt descending), paged.
        With q (EV-261a): the users whose email OR full name contains q, case-insensitively, newest
        first with the id breaking ties so paging is stable. q is trimmed first (spaces, including
        no-break spaces, and a pasted newline; and, EV-309, the invisible format characters a copied
        address can carry, such as U+200B, U+200E, U+FEFF). Only the ends are trimmed: an invisible
        character inside q is kept and matched as stored. q may be sent once: a repeated q is
        refused, never joined. %, _ and backslash in q are matched literally, never as
        wildcards. There is no accent folding: q=zoe does not find "Zoé" (a recorded limit, not a
        defect). A search returns exactly the fields the list returns, for the same population
        (PENDING accounts included, as in the list); deleted accounts do not exist to be found.
        ADMIN is granted only to a session that proved a second factor (BUG-165).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page index (0-based). page x size must not exceed 2147483647.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          description: >-
            Search text, sent at most once (a repeated q, whatever the values, is 400
            ADMIN_SEARCH_INVALID, EV-309). Leading and trailing whitespace and invisible format
            characters (Unicode Cf: U+200B, U+200E, U+200F, U+2060, U+FEFF, ...), in any order, are
            trimmed first; one inside q is kept. The rest must be at least 2 and at most 254
            characters after trimming (counted as Unicode code points), with no control character;
            a q of spaces or format characters only is therefore ADMIN_SEARCH_TOO_SHORT. There is deliberately no maxLength on the raw
            parameter: a longer value that trims to 254 or fewer is accepted. Absent or empty means
            no search. Send it URL-encoded: a literal "+" must travel as %2B.
          schema:
            type: string
      responses:
        "200":
          description: One page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPageResponse"
        "400":
          description: >-
            INVALID_REQUEST (page < 0, size outside 1-100, or page x size past 2147483647; or a
            request parameter whose percent-escape cannot be decoded, e.g. an unencoded q=100%fit,
            message "A request parameter could not be decoded.", BUG-332);
            ADMIN_SEARCH_TOO_SHORT (q under 2 characters after trimming, e.g. "%" sent as %25);
            ADMIN_SEARCH_TOO_LONG (q over 254 characters);
            ADMIN_SEARCH_INVALID (q contains a control character; or q sent more than once, message
            "Send one search term (q) per request.", and no query runs). The message never echoes q.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — not ROLE_ADMIN (AUTH_FORBIDDEN), or ROLE_ADMIN on a session that never
            proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
