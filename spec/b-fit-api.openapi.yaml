  /exercises/sync:
    post:
      summary: Sync the exercise catalog from the configured provider (admin)
      description: >-
        Pulls the MuscleWiki catalog into the local exercise catalog and returns a summary of what
        was fetched, created, updated and skipped (EV-003 / BUG-007). Restricted to ROLE_ADMIN:
        the pull is long-running and runs against a metered paid upstream quota, so a self-serve
        caller could amplify cost at will. Enforced by a request matcher in SecurityConfig, not by
        the controller — an authenticated non-admin gets 403 AUTH_FORBIDDEN, an anonymous caller
        401. Since BUG-165 ROLE_ADMIN is granted only to a session that proved a second factor, so
        an admin who logged in on a password alone also gets 403, with code AUTH_MFA_REQUIRED —
        they must enroll under /auth/mfa and sign in again. Sync is the only catalog writer; it
        also invalidates the resolve-by-name cache.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSyncResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — the caller is authenticated but not ROLE_ADMIN (AUTH_FORBIDDEN), or holds
            ROLE_ADMIN on a session that never proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
