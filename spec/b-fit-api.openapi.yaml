            proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{id}/role:
    patch:
      summary: Replace a user's role (admin)
      description: >-
        REPLACES the role set with the one role given. USER and ADMIN only (EV-260a): COACH as the
        value, or any change to an account that holds COACH, is refused with 409
        ADMIN_ROLE_USE_COACH_GRANT and nothing changes; coach status is granted and revoked through
        /admin/coaches (EV-205a). Checked after the BUG-352 refusals below, which keep their precedence.
        Every accepted change logs one ADMIN_ROLE_CHANGED line (actor and target ids, the old and new
        role sets; no address).
        EV-204a1 / ADR-0022 D22.4d: a PENDING account is refused (409 ACCOUNT_PENDING) and nothing
        changes, because only its person can activate it; PENDING itself is never assignable
        (400 ROLE_NOT_ASSIGNABLE). When both hold, the 409 wins. The user must sign in again for a
        new role to reach their token.
        BUG-352: a change that removes ADMIN is refused with 409 and nothing changes when the account
        is the caller's own (ADMIN_SELF_DEMOTION, however many admins exist; another admin can still
        do it), or when it is the last account holding ADMIN (LAST_ADMIN). The admin count is taken
        under a lock, so two admins demoting each other at once cannot both succeed.
        The caller must also hold ADMIN in the database, not only in the access token: a caller
        demoted since the token was minted gets 403 AUTH_FORBIDDEN and nothing changes, whatever
        the change (BUG-352).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: VALIDATION_ERROR, or ROLE_NOT_ASSIGNABLE (role PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — not ROLE_ADMIN (AUTH_FORBIDDEN), or ROLE_ADMIN on a session that never
            proved a second factor (AUTH_MFA_REQUIRED, BUG-165), or a token that still says ADMIN
            for an account that no longer holds it (AUTH_FORBIDDEN, BUG-352)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_PENDING — the account has not been activated; its role cannot be changed.
            ADMIN_SELF_DEMOTION — your own account, to a role other than ADMIN.
            LAST_ADMIN — no account would hold ADMIN afterwards. Nothing is written (BUG-352).
            ADMIN_ROLE_USE_COACH_GRANT — COACH requested, or the account holds COACH; use
            /admin/coaches (EV-260a). Nothing is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/gyms:
    post:
      summary: Create a gym (admin)
      description: >-
        EV-277a / ADR-0019 D19.2. Creates a gym (the company above its coaches; memberships are
        EV-277c) with status ACTIVE. Values are trimmed before validation; a blank vatNumber is null.
        Logs one ADMIN_GYM_CREATED line carrying the actor id and the gym id, never an address.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGymRequest"
