  /admin/gyms/{id}/coaches:
    post:
      summary: Add a coach to a gym (admin)
      description: >-
        EV-277c / ADR-0019 D19.2b, A5a. The coach joins now (joinedAt = the request instant). A coach
        is in at most one gym at a time; an independent coach is one with no current membership.
        Joining grants no role and touches none of the coach's trainee links (D19.2c). Refusals, in
        this order: GYM_NOT_FOUND (404), GYM_INACTIVE, GYM_MEMBER_NOT_A_COACH (no coach profile, or
        the account does not hold the COACH role at the time of the request, e.g. a coach demoted to
        USER, who keeps the profile; also an id that is no account; BUG-317), GYM_MEMBER_NOT_ACTIVATED
        (the coach's account is still PENDING, ADR-0019 A9d; a PENDING account holds no other role, so
        it is judged by its profile alone), GYM_MEMBER_ALREADY, GYM_MEMBER_IN_ANOTHER_GYM (409s). A refusal
        writes nothing and logs nothing. Of two concurrent adds of one coach, exactly one succeeds
        and the other answers GYM_MEMBER_IN_ANOTHER_GYM with details.gymId naming the winner's gym, or,
        when both adds named the same gym, GYM_MEMBER_ALREADY (no details: the gym is the one in the path).
        Logs one ADMIN_GYM_COACH_JOINED line after the commit: actor, gym and coach ids only. Demoting
        a coach closes no membership: a demoted coach stays listed until removed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGymCoachRequest"
      responses:
        "201":
          description: The gym, with the coach among its current coaches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGymDetailResponse"
        "400":
          description: VALIDATION_ERROR (coachUserId missing, or given more than once, BUG-318) or INVALID_REQUEST (a body or path id that is not a UUID; a body coachUserId must be exactly the 36 canonical characters, so a NUL, LF or space around it is refused, BUG-319)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — not ROLE_ADMIN (AUTH_FORBIDDEN), or ROLE_ADMIN on a session that never
            proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: GYM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            GYM_INACTIVE, GYM_MEMBER_NOT_A_COACH, GYM_MEMBER_NOT_ACTIVATED, GYM_MEMBER_ALREADY, or
            GYM_MEMBER_IN_ANOTHER_GYM with details.gymId naming the gym the coach is currently in.
            Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: GYM_MEMBER_IN_ANOTHER_GYM
                message: This coach is already in another gym.
                details:
                  gymId: 3f1c2a9e-0000-4000-8000-000000000001
  /admin/gyms/{id}/coaches/{coachUserId}/leave:
    post:
      summary: Remove a coach from a gym (admin)
      description: >-
        EV-277c / ADR-0019 D19.2b. Sets leftAt = now on the coach's current membership of this gym;
        the row is kept (ADR-0019 A9a deletes it only at the coach's hard delete) and the coach moves
        to pastCoaches. Allowed on an
        INACTIVE gym. The coach's trainee links are unchanged (D19.2c). Logs one ADMIN_GYM_COACH_LEFT
        line after the commit: actor, gym and coach ids only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: coachUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The gym, with the coach among its past coaches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGymDetailResponse"
        "400":
          description: INVALID_REQUEST — a path id that is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — not ROLE_ADMIN (AUTH_FORBIDDEN), or ROLE_ADMIN on a session that never
            proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: GYM_NOT_FOUND, or GYM_MEMBERSHIP_NOT_FOUND when the coach is not currently in this gym (never was, already left, or is in another gym)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/coaches:
    get:
      summary: List coach profiles, newest first (admin)
      description: >-
        EV-205a. Every coach_profiles row with its account's email, the tier (read-only, STARTER only:
        AC6, ADR-0019 D19.3), the ACTIVE link count (a REVOKED link counts 0), who last granted it and
        when, and the status: ACTIVE (holds COACH), REVOKED (the profile without the role; a later grant
        restores the same roster), PENDING (an admin-initialised coach who has not activated, ADR-0022
        D22.8c). An account holding COACH with no profile is not listed; granting it repairs it.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: One page of coaches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoachPageResponse"
        "400":
          description: INVALID_REQUEST (page below 0, size outside 1-100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Forbidden — not ROLE_ADMIN (AUTH_FORBIDDEN), or ROLE_ADMIN on a session that never
            proved a second factor (AUTH_MFA_REQUIRED, BUG-165)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Make an existing account a coach (admin)
      description: >-
        EV-205a (ADR-0022 D22.1(b), D22.4d). Adds COACH to an existing, activated, email-verified
        account (additive: USER stays) and writes its coach profile at STARTER. Creates no account and
        sets no password (EV-205 Ruling 1). The same call re-grants a revoked coach (the typed
        displayName wins, the first grantedAt is kept, lastGrantedAt is now and lastGrantedBy this
        admin) and repairs an
        account that holds COACH without a profile (BUG-371). Refusals, in this order, nothing written:
        AUTH_FORBIDDEN (403, also when the token says ADMIN and the database no longer does),
        ADMIN_SELF_GRANT (403), USER_NOT_FOUND (404), ACCOUNT_PENDING (409), COACH_ALREADY_GRANTED
        (409: holds COACH and has a profile), COACH_EMAIL_UNVERIFIED (409). Of two concurrent grants of
        one person exactly one succeeds; the other answers COACH_ALREADY_GRANTED. Roles are a JWT claim:
        the person must sign out and sign in again before the coach portal works for them, which the
        response states as requiresReauthentication. Logs one ADMIN_COACH_GRANTED line after the commit
        (actor and target ids, outcome GRANTED, REGRANTED or REPAIRED), or one ADMIN_COACH_REFUSED line
        naming the code; never an email address or a name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCoachGrantRequest"
      responses:
        "201":
          description: The coach, ACTIVE, with requiresReauthentication true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoachResponse"
        "400":
          description: >-
            VALIDATION_ERROR (userId missing; displayName missing, blank, over 80 characters, or holding
            a control, line-break or invisible format character), INVALID_REQUEST (userId not a
            canonical UUID), or ADMIN_COACH_INPUT_FORBIDDEN (any other key, e.g. capacityTier, roles,
            password, email: refused, not ignored; the value is never echoed). Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            AUTH_FORBIDDEN (not ROLE_ADMIN, or no longer ADMIN in the database), AUTH_MFA_REQUIRED
            (BUG-165), or ADMIN_SELF_GRANT (the caller's own account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ACCOUNT_PENDING, COACH_ALREADY_GRANTED, or COACH_EMAIL_UNVERIFIED. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/coaches/{userId}:
    patch:
      summary: Rename a coach (admin)
      description: >-
        EV-205a. The display name only, on any account with a coach profile (ACTIVE, REVOKED or
        PENDING). grantedAt, lastGrantedAt and lastGrantedBy are unchanged. Logs one ADMIN_COACH_RENAMED
        line.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCoachRenameRequest"
      responses:
        "200":
          description: The coach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoachResponse"
        "400":
          description: VALIDATION_ERROR, or ADMIN_COACH_INPUT_FORBIDDEN for any key but displayName
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: AUTH_FORBIDDEN or AUTH_MFA_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: COACH_NOT_FOUND (the account has no coach profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Revoke coach status (admin)
      description: >-
        EV-205a AC3. Removes the COACH role and nothing else: the coach profile, every trainee link,
        every draft and every published plan and its byline stay, so a later grant restores the same
        roster. The roster cannot grow meanwhile: from the revoke on, the coach's outstanding invites
        answer COACH_INVITE_INVALID and a new invite is refused, whatever their token says. An account
        left with no role becomes USER. Everything else in the portal - reads and writes such as drafts
        and publishing - continues on the person's current token until their next sign-in or refresh
        (at most 15 minutes; requiresReauthentication). Logs one ADMIN_COACH_REVOKED line.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The coach, REVOKED, with requiresReauthentication true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoachResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: AUTH_FORBIDDEN or AUTH_MFA_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: COACH_NOT_FOUND (not a coach, i.e. not both the COACH role and a coach profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /subscriptions/plans:
    get:
      summary: List subscription plans (free / premium / premium_plus)
      description: >-
        The static plan catalog rendered by the mobile paywall. The mobile PlanCard prints
        `features` verbatim, so every string here is a commercial claim and must name a capability
        that exists and is actually gated at that tier (BUG-029). There is deliberately no
        `popular` field: it was a hard-coded constant asserting a usage fact about a product with
        no paying users, and it was removed in both repos (BUG-068).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The three tiers, in ladder order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/nutrition/target:
    get:
      summary: The trainee's daily calorie/macro target
      description: >-
        Computes and PERSISTS a target from the profile on first access, so this read is the one
        that creates the row. An AUTO target is also recomputed and persisted when the profile
        changed since it was computed (BUG-434), the same rule the weekly plan, `/today`,
        `/weigh-ins` and the weigh-in apply; MANUAL and COACH targets are served as stored.
        Undocumented until EV-185a, which added `setByName` to its body — a field mobile could
        not see while the route was missing from this spec.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The stored target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionTargetResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The account has no profile to compute a target from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Set the target by hand (source becomes MANUAL)
      description: >-
        The trainee's own edit. It also CLEARS any coach attribution — `source` becomes MANUAL and
        `setByName` stops being served (EV-185 AC5), because the numbers are no longer the coach's.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualTargetRequest"
      responses:
        "200":
          description: The stored target, MANUAL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionTargetResponse"
        "400":
          description: VALIDATION_ERROR — a macro outside its bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # NOTE (BUG-360 / BUG-362): two more routes whose answers changed are ABSENT from this spec entirely
  # (pre-existing; documenting the missing /me routes is EV-066's story, not a bug fix's):
  #   - GET /me/nutrition/plan/meal/{mealId}/swap-options (and ?refresh=true) now answers
  #     422 NO_SAFE_MEAL_PLAN, the body below, when no candidate is safe under the account's rules
  #     (it answered 500 INTERNAL_ERROR). Nothing is cached, and a refresh's CHAT credit is refunded.
  #   - POST /me/coach/routine (JSON and multipart) now answers 409 ROUTINE_GENERATION_IN_PROGRESS
  #     when a routine generation for the same account is already running (a double tap). It is
  #     refused below the coached-mode gate and the catalogue pre-flight and ABOVE the meter, so it
  #     costs nothing; before, the second tap was charged and answered 409 DATA_INTEGRITY_VIOLATION
  #     (no plan yet) or 200 with a second plan. Re-read the plan instead of generating again. The
  #     refusal lasts while the first request runs and at most 10 minutes from its start; after that
  #     the first is presumed hung and the next request is accepted (and charged) in its place.
  #
  # NOTE (EV-071a): POST /me/nutrition/plan/day/{dayId}/regenerate is ABSENT from this spec
  # entirely — pre-existing (absent at 8636119 too), not introduced here. It now answers 422
  # NO_SAFE_MEAL_PLAN like the two coach-portal operations below.
  #
  # Documenting the route needs its own row, and AT THE TIME OF WRITING THAT ROW IS NOT FILED —
  # senior-qa owns filing it. Said that way on purpose: a comment that claims a row exists becomes
  # the record instead of the row, which is the failure ruling 5.8 named about its own flag.
  /me/nutrition/plan/week:
    post:
      summary: Generate (or replace) the 7-day meal plan for a week (uses one AI credit)
      description: >-
        Answers **201** with a week whose `status` is `GENERATING`: the first day carries meals and
        the rest stream in on a background pool, so a client must re-read (or poll) before treating
        the week as complete. Replaces any existing week on the same plan ROW — the plan id, and the
        grocery list hanging off it, survive.


        Undocumented until EV-185a, which is why it is written out here in full: the route was
        missing from this spec entirely while mobile consumed it, so `contracts.ts` carried no type
        for it at all.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWeekRequest"
      responses:
        "403":
          description: >-
            AI_NOT_INCLUDED (EV-286a, ADR-0028): the account is coached, so its coach prepares its
            plan. Refused before any model call and before any AI credit is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: The week, GENERATING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            **WEEK_GENERATION_IN_PROGRESS** (BUG-361) — a generation of the same week for this account
            is already running (a double tap). This request is refused before any AI credit is
            consumed and before anything is generated or written; the running request is answered as
            if it were alone.


            The client should not generate again: re-read the week (`GET /me/nutrition/plan/week`)
            once the first request answers. The refusal lasts while that request is in flight, and
            **at most 10 minutes** from when it started: after that the first request is presumed
            hung and the next request for the week is accepted (and charged) in its place. The days
            that stream in after the first request's 201 are not covered, so a tap after the 201 is
            an ordinary regeneration. The `message` is developer-facing and is not copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the account's allergies and food rules rule out every
            recipe the server can check, so no week was produced. The plan row is written with
            `status: REFUSED` and zero days, replacing whatever was there, so a follow-up GET
            returns the refusal rather than a stale week.


            The client renders its refusal state from the **status** and this **code**. The
            `message` is developer-facing, is not translated and is **not copy** — displaying it, or
            the code, or any exception text is the defect BUG-173 records. `details` is absent on
            purpose: which rule blocked is never put on the wire.


            The first refusal on a given week refunds the GENERATE credit it consumed; a second
            refusal on the same week does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: AI_CREDITS_EXHAUSTED — the account's GENERATE allowance is spent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: The weekly plan (current week by default; falls back to the latest active)
      security:
        - bearerAuth: []
      parameters:
        - name: weekStartDate
          in: query
          required: false
          description: The week's Monday; defaults to the current week, then the latest ACTIVE one.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No weekly plan yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/nutrition/today:
    get:
      summary: Today's nutrition — target vs consumed vs remaining, plus entries and streak
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: The day to view; defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day's nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyNutritionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/routine/generations:
    post:
      summary: Start an async progressive routine generation from the onboarding profile (EV-124)
      description: >
        Charges one AI GENERATE credit and answers 202 immediately with a job id. Generation is
        progressive (ADR-0002): a fast skeleton call fixes the split, then each training day is
        generated in parallel and revealed as it lands. Poll GET /me/routine/generations/{jobId}.


        Two request encodings are accepted. `application/json` is the profile alone.
        `multipart/form-data` carries the same profile as a `profile` part plus an optional `photo`
        part; the photo is used for qualitative cues only and is never stored or logged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineGenerateRequest"
          multipart/form-data:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  $ref: "#/components/schemas/RoutineGenerateRequest"
                photo:
                  type: string
                  format: binary
                  description: Optional photo; transient, never persisted.
            encoding:
              profile:
                contentType: application/json
      responses:
        "403":
          description: >-
            AI_NOT_INCLUDED (EV-286a, ADR-0028): the account is coached, so its coach prepares its
            plan. Refused before any model call and before any AI credit is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "202":
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineGenerationAcceptedResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >
            Monthly AI credit allowance exhausted (code AI_QUOTA_EXCEEDED). The GENERATE credit is
            charged once, at submit, AFTER the catalog pre-flight and before the job is queued — so
            this is answered instead of the 202 and no job is created. The ordering matters to a
            client: a 503 CATALOG_UNAVAILABLE below is free and retryable, because the refusal
            happens above the meter and no credit is spent (BUG-057 / ADR-0013 D1.2).
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying — what is left of the fixed window that
                refused the request (BUG-152). Always at least 1, and capped at 86400 so a
                long reset (the monthly AI quota) is still a value a client can schedule.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >
            The exercise catalog for the active provider is empty, so no routine can be grounded in
            real exercises (code CATALOG_UNAVAILABLE). Nothing is charged and no job is created —
            the request is safe to retry once an operator has synced the catalog. The body carries
            no provider name, environment-variable name or other configuration state; the
            operator-facing version of this fact lives on /actuator/health/catalog behind ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/routine/generations/{jobId}:
    get:
      summary: Poll an async routine generation job (EV-124)
      description: >
        While GENERATING, `progress` and `planId` are non-null once the skeleton lands and `routine`
        carries the READY days' exercises as they stream in — the client may open and start the first
        READY day from `planId` before the job COMPLETED. At COMPLETED, `routine` is the finalized
        full plan. `error` is set only when FAILED. `progress`/`planId` are additive; a pre-EV-124
        client ignores them and works off `status` + `routine`.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status; progress + partial routine while GENERATING, finalized at COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineGenerationStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown job (or another user's job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/me:
    get:
      summary: The signed-in coach's profile and capacity (Evoli Pro)
      description: >-
        EV-183 / ADR-0012 D4. Requires ROLE_COACH **and** a `coach_profiles` row — the role claim
        and the profile row are two different facts and both are needed, because the portal renders
        a display name, a tier and a capacity that only the row has. AC1's meter reads
        "`active` / `capacity` profiles · `tier`"; the sentence is the client's, in its own i18n.
        The tier names a capacity, renders no price and links to no checkout.
        NOTE for operators: roles are a JWT claim, so an account granted COACH must sign out and
        sign in again before any of these endpoints will serve it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile and capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach (AUTH_FORBIDDEN), or a COACH role with no coach_profiles row
            (COACH_ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients:
    get:
      summary: The coach's ACTIVE roster, paged
      description: >-
        ACTIVE rows for the authenticated principal only. There is no parameter through which
        another coach's roster can be named — the coach id comes from the authentication, never
        from the request, so a client-supplied `coachId` is not ignored so much as unrepresentable.
        REVOKED links are history and are never listed.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: >-
            EV-187a AC2's triage order. `needs_attention` (the default) is flagged first —
            descending by the number of fired red flags, then ascending by the date of the last
            completed workout so the longest silence is highest, then by display name, then by id
            so the order is stable across reloads for unchanged data. A row whose link shares
            neither WORKOUTS nor WEIGH_INS has no flag count at all (`redFlagCount: null`) and
            sorts LAST, never among the zero-flag rows: a coach must not read a consent boundary as
            good news. `recent_activity` is most recently active first, unknown activity last.
            **The API sorts, not the portal** — the key spans the whole roster and the portal holds
            one page of it, so a client-side sort would order page 1 among itself and call it
            triage. Any other value is a 400, not a silent fall-back to the default.
          schema:
            type: string
            enum: [needs_attention, recent_activity]
            default: needs_attention
      responses:
        "200":
          description: A page of roster rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachClientPageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/trainees:
    post:
      summary: Initialise a trainee account (EV-204a2, ADR-0022 D22.3/D22.8)
      description: >-
        Creates an account holding only PENDING, records the caller as its initialiser and nominee
        coach, and emails the trainee a generated temporary password together with the Art. 14 notice
        (Reply-To is the monitored objection inbox). Writes NO consent, NO coach link and NO invite:
        the trainee activates and consents in the app (POST /me/activate), then pulls the nomination
        (POST /me/nomination). The granted role (USER), the AI mode and the nominee come from the
        caller, never the body; unknown fields such as role, aiMode or password are ignored. The
        temporary password is never returned. An expired, unactivated account at the address counts
        as absent and is replaced in the same transaction. Throttled per coach (30 an hour, every
        call counted).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialiseTraineeRequest"
      responses:
        "201":
          description: Initialised; the row the roster shows as Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialisedAccountResponse"
        "400":
          description: >-
            VALIDATION_ERROR — missing or invalid email or fullName (including a control character, line break or invisible format character in fullName), or a malformed locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach (or a PENDING account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_EXISTS — the address has an account, active or pending (one answer for both); or COACH_PROFILE_REQUIRED — the coach has no coach profile, so the email could name nobody. Nothing is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED — the 31st initialisation within an hour for this coach
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            ACCOUNT_INITIALISATION_UNAVAILABLE — no monitored objection inbox is configured (BFIT_OBJECTION_INBOX), so no lawful invitation can be sent. Nothing is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: The coach's Invited accounts (EV-204a2)
      description: >-
        Accounts nominating this coach that are not activated and not expired, newest first. An
        expired account is absent (no tombstone), even before the sweeper deletes it.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of Invited rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialisedAccountPageResponse"
        "400":
          description: >-
            VALIDATION_ERROR — page below 0, or size outside 1..100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/trainees/{id}/resend:
    post:
      summary: Resend the invitation with a new temporary password (EV-204a2, ADR-0022 D22.9b)
      description: >-
        Emails a new temporary password. The old one stops signing in and every refresh token minted
        from it stops refreshing (token_version is bumped). The expiry does NOT move; the new email
        states the same date. An access token minted in the last 15 minutes lives out its TTL and can
        reach only the PENDING allowlist.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendInvitationRequest"
      responses:
        "200":
          description: Resent; expiresAt unchanged, passwordIssuedAt moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialisedAccountResponse"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            PENDING_ACCOUNT_NOT_FOUND — not an unactivated, unexpired account this coach initialised (one answer for another coach's, activated, expired and unknown ids)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED — this coach's 6th resend within an hour for this account
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            ACCOUNT_INITIALISATION_UNAVAILABLE — no monitored objection inbox is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/trainees/{id}:
    delete:
      summary: Withdraw an unactivated account this coach initialised (EV-204a2, ADR-0022 D22.10c)
      description: >-
        Hard-deletes the account and everything it held, with the sweeper's cascade. The
        erasure-on-request path for a person who objects through their coach.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            PENDING_ACCOUNT_NOT_FOUND — activated, another initialiser's, or no such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/invites:
    post:
      summary: Mint a single-use coach invite (7-day TTL)
      description: >-
        Returns the raw token **once**, in this response and nowhere else; the database stores only
        its SHA-256 digest, so a lost token cannot be recovered and a new invite must be issued.
        The invite URL is composed by the client from its own origin (`<origin>/i/<token>`) — the
        API deliberately does not build it, because it cannot know the demo's origin and a guessed
        base URL is a QR code that does not match the link it is shown beside.
        Capacity is pre-checked here as well as at accept, so the coach gets an honest refusal
        rather than a trainee hitting the wall after opening a link.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: The token and its expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachInviteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, or `COACH_CAPACITY_REACHED` — every profile the tier allows is in use.
            403 rather than 409 follows EV-183 edge case 5, which pins the status in the story text;
            the staff review noted 409 is the better status for "your plan is full" and routed it to
            senior-po as a story change. Also AUTH_FORBIDDEN when the token still says COACH but the
            account no longer holds it (revoked through DELETE /admin/coaches, EV-205a).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}:
    get:
      summary: A read-only overview of one trainee
      description: >-
        EV-183 AC5. `{id}` is the **coach_clients row id**, not a user id — the coach portal never
        addresses a person directly. Read-only is structural: an ArchUnit rule fails the build if a
        coach-portal controller reaches any application use case outside the coach-portal package,
        so there is no write path to hide behind a disabled button.
        **403, uniformly**, for a link belonging to another coach, for a revoked link AND for an id
        that does not exist. That is a deliberate deviation from ADR-0004's house 404, and it costs
        nothing precisely because it is uniform: the responses are byte-identical, so the prefix is
        not an existence oracle. `OwnershipAuthzSuiteTest` asserts that on every coach-portal
        mapping.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeOverviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, not this coach's client, revoked, or no such id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/progress:
    get:
      summary: Eight weeks of adherence, the last ten sessions, and red-flag evidence
      description: >-
        EV-187a AC3/AC4/AC5 — the monitoring page's three blocks in one read: adherence per ISO week
        over a fixed 8-week horizon, the last ten completed sessions with the difficulty the trainee
        reported, and every red flag that fired WITH the evidence it fired on.
        **Requires the PROGRESS scope at the guard.** A link that does not carry it answers the same
        undifferentiated 403 as another coach's client, a revoked link and an id that never existed
        (ADR-0012 D4) — so the denial says nothing about which of the four it was, and the portal
        renders "This trainee has not shared their progress with you." from
        `TraineeOverviewResponse.scopes`, never from this status.
        Inside, each block still blanks on its OWN scope: `adherence` and `sessions` are null
        without WORKOUTS, matching the overview's `adherenceThisWeek` and `lastSession`, so the two
        pages cannot show different numbers for the same trainee.
        `redFlags` here is the overview's `redFlags` with the evidence attached — one evaluation,
        two projections, so the badge and the evidence cannot disagree.
        **GET only.** This story adds no non-GET mapping anywhere on this prefix; nothing on the
        monitoring page writes to a trainee's plan, sessions, nutrition, weigh-ins or targets.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The three monitoring blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProgressResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            PROGRESS — one body for all five.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/revoke:
    post:
      summary: End the coaching link from the coach's side
      description: >-
        EV-183 AC6's coach side. Not idempotent by design: a second call has no ACTIVE link to end
        and therefore answers the same 403 as a foreign id, which is what keeps "did this link
        exist?" unanswerable. The trainee's consent row is stamped `withdrawn_at` in the same
        transaction — a live consent attached to a dead link would make "does this coach hold
        consent?" answer yes for a coach with no access.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The link is REVOKED
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, not this coach's client, already revoked, or no such id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine:
    get:
      summary: The trainee's live routine, with their stored guardrails
      description: >-
        EV-184 AC1. The routine document is the one the trainee's own app renders, so the coach's
        page and the phone agree by construction rather than by two renderers agreeing — which is
        what AC1 has QA check, exercise by exercise, phone next to browser.
        `routine` is null for a trainee who has never had one: the portal renders "No active plan"
        and a single "Build a plan" control, never a blank page or `null`.
        `guardrails` is display-only, and that is the API's property rather than the UI's — at MVE-3
        the submitter is the coach, so "resolve from the profile, never from the request" is the
        difference between the trainee's injuries and a stranger's claim about them (CS-22 /
        ADR-0001). The policy resolves injuries and equipment from `user_profiles`, and since
        BUG-185 so does the `plans.equipment` column the trainee's own app reads on `GET /me/plan`.
        A draft document does carry a `constraints` block — `constraints.equipment` and
        `constraints.injuries` are both required on `Routine`, so a coach CANNOT omit them — but
        since BUG-195b (ADR-0018 D9) the coach sends both as `[]`: a non-empty value on
        `PUT …/routine/draft` is refused with 400 COACH_DRAFT_SUBJECT_FIELD, and the stored draft
        always carries `[]`. The trainee's own lists reach the policy and the plan from
        `user_profiles` at publish time, never from the document.
        Requires the **WORKOUTS** scope on the link (ADR-0015 D5): a link that did not share
        workouts answers 403, not an empty editor.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            WORKOUTS — one undifferentiated body for all five, so a 403 tells the caller nothing
            about which applied and "which scope am I missing" is not a probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/draft:
    get:
      summary: The coach's unpublished draft for this link
      description: >-
        EV-184 AC2. `document` is null when there is no draft — a 200, never a 404: the absence IS
        the information, and the draft lives in its own table (`coach_plan_drafts`) that no
        trainee-facing path reads. AC2 calls a draft leaking to the trainee the single worst failure
        this story can produce, and the prevention is structural rather than careful.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The draft, or nulls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineDraftResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Save the draft (the whole document, with a staleness token)
      description: >-
        EV-184 AC2, re-contracted by BUG-195b (ADR-0018 D1 option 1-D). The body is
        `CoachRoutineDraftRequest`: the WHOLE `Routine` in `document`, validated by exactly the
        constraints `PUT /me/coach/routine` validates, plus `replacesDraftUpdatedAt`. A partial
        document is refused (ADR-0016 V1b, strict now, relax later): the pre-BUG-195b portal body
        `{name, trainingDays}` has no `document` and is a 400 VALIDATION_ERROR.


        **Four fields are the TRAINEE's, not the coach's (ADR-0018 D3).** `goal` and `level` are
        overwritten with the trainee's own onboarding answers from `user_profiles` (send what you
        were served; a value that differs is replaced and logged, never refused). With no profile
        row the save still succeeds with `GET_STRONGER` / `BEGINNER` and a WARN is logged.
        `constraints.equipment` and `constraints.injuries` must be sent `[]` and are stored `[]`: a
        non-empty value is 400 COACH_DRAFT_SUBJECT_FIELD, naming the field in `details.field` and
        never echoing the value. `daysPerWeek` and `constraints.daysPerWeek` are DERIVED: both are
        stored as `trainingDays.length`. Every other field — `name`, `summary`,
        `weeklyProgression`, `constraints.minutesPerSession` and everything inside `trainingDays`
        (`tempo`, `notes`, `trackingType`, `durationSeconds`, `weight`, `estimatedMinutes`, …) — is
        the coach's and is stored exactly as sent, including a null that clears a field. The 200
        response carries the STORED document, so re-render from it rather than from what was sent.


        **A `DURATION` exercise carries no reps.** `reps` non-null on an exercise whose
        `trackingType` is `DURATION` is 400 COACH_DRAFT_REPS_ON_DURATION, with `details.dayOfWeek`
        and `details.exerciseIndex` (0-based within that day), because the plan writer drops it and
        the coach would watch a prescription vanish without a message.


        **Staleness (ADR-0018 D6).** `replacesDraftUpdatedAt` is the one token on this row, shared
        with template apply. Absent or null: saved only if this link has NO draft. Present: must
        equal the stored draft's `updatedAt`, echoed verbatim from the last GET, PUT or apply
        response. Anything else is 409 COACH_DRAFT_EXISTS with `details.existingUpdatedAt`, and
        NOTHING is written; retry with that instant only after the coach has confirmed they mean to
        replace it. A token whose draft no longer exists (published or discarded in another tab)
        saves a new draft. Every write moves `updatedAt` strictly forward, so an old token is never
        accepted again. The trainee's plan is untouched by any save.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRoutineDraftRequest"
            example:
              replacesDraftUpdatedAt: "2026-10-01T09:14:07.123456Z"
              document:
                name: 3-Day Strength Base
                goal: BUILD_MUSCLE
                level: BEGINNER
                daysPerWeek: 3
                trainingDays:
                  - dayOfWeek: 1
                    focus: Lower
                    estimatedMinutes: 45
                    exercises:
                      - {name: Goblet Squat, sets: 3, reps: "8-12", rest: 90s, tempo: 3-1-1,
                         notes: Chest tall, trackingType: WEIGHT_REPS, durationSeconds: null,
                         weight: 16 kg}
                      - {name: Plank, sets: 3, reps: null, rest: 30s, tempo: null, notes: null,
                         trackingType: DURATION, durationSeconds: 45, weight: null}
                  - dayOfWeek: 3
                    focus: Upper
                    estimatedMinutes: 40
                    exercises:
                      - {name: Push-Up, sets: 3, reps: "10", rest: 60s, tempo: null, notes: null,
                         trackingType: WEIGHT_REPS, durationSeconds: null, weight: bodyweight}
                  - dayOfWeek: 5
                    focus: Full
                    estimatedMinutes: 45
                    exercises:
                      - {name: Inverted Row, sets: 3, reps: "8", rest: 90s, tempo: null,
                         notes: null, trackingType: WEIGHT_REPS, durationSeconds: null,
                         weight: null}
                weeklyProgression:
                  - {week: 2, adjustment: Add one set to the main lifts, rationale: null}
                constraints: {equipment: [], injuries: [], minutesPerSession: 45, daysPerWeek: 3}
                summary: Three full-body sessions a week.
      responses:
        "200":
          description: >-
            The saved draft. `document` is the STORED document — the trainee's goal and level, empty
            equipment and injuries, derived day counts — and `updatedAt` is the token the NEXT save
            must echo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRoutineDraftResponse"
        "400":
          description: >-
            VALIDATION_ERROR — no `document`, or a `Routine` that fails validation (a partial
            document included); COACH_DRAFT_SUBJECT_FIELD — `constraints.equipment` or
            `constraints.injuries` is non-empty, `details.field` names which, the value is never
            echoed; COACH_DRAFT_REPS_ON_DURATION — a `DURATION` exercise carries `reps`,
            `details.dayOfWeek` and `details.exerciseIndex` locate it. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            COACH_DRAFT_EXISTS — a draft exists and `replacesDraftUpdatedAt` is absent or is not
            its `updatedAt`, or another first save for this link committed while this one was in
            flight. `details.existingUpdatedAt` is the current instant. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Discard the draft
      description: >-
        EV-184 AC2. The page returns to the published plan exactly, because the published plan was
        never touched. Idempotent: a second discard has nothing to delete and answers the same 204,
        which is the honest answer to a double tap and the only one that does not make "is there a
        draft?" a question with a side effect.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: There is no draft for this link
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/publish/preview:
    post:
      summary: What publishing this draft would change
      description: >-
        EV-184 AC3, phase one of the two-phase publish (ADR-0015 D4). Runs the safety guardrail
        against the trainee's STORED injuries and equipment and **writes nothing**.
        `RoutinePolicy` repairs; it does not refuse — so `repairs` is what the coach is asked to
        acknowledge, and an empty list means the modal reads "No changes were needed" with one
        "Publish" control. `repairCount` is `repairs.length`, so AC3's heading "We changed N things
        to keep this safe" cannot disagree with the list beside it.
        Refusal order, all before any write: guard + scope, then 400 COACH_PLAN_EMPTY, then
        503 CATALOG_UNAVAILABLE, then the policy.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The repairs and the digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPublishPreviewResponse"
        "400":
          description: COACH_PLAN_EMPTY — no draft, or a draft with no training day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            CATALOG_UNAVAILABLE — the active exercise provider has no catalog rows. The asymmetry is
            deliberate: the trainee may generate against an empty catalog, the coach may not PUBLISH
            against one, because a coach's plan is published under a named professional's byline to
            a third party and neither party can see that half its exercises resolve to nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/publish:
    post:
      summary: Publish the draft as the trainee's active plan
      description: >-
        EV-184 AC3, phase two. Requires the digest from the immediately preceding preview. Publish
        re-runs the policy and compares the resulting repair set to the acknowledged one — that
        comparison, not the digest alone, is what closes the time-of-check/time-of-use window
        (edge case 2's second tab). A constant `confirm: true` was rejected: it carries no
        information about WHAT was acknowledged.
        The published `goal` and `level` are the trainee's profile answers AT PUBLISH (BUG-195b),
        not the ones copied into the draft when it was saved; preview resolves them the same way,
        so the digest covers what is written.
        Writes `plans.source = COACH`, `plans.authored_by` = the coach and `plans.owner_id` = the
        trainee, as a **new** plan row with the previous one deactivated — never an in-place update,
        because the trainee's "Your coach updated your plan" line is keyed on the plan id in slice 1.
        Writes **no** `plan_assignments` row: deferred to EV-184d behind EV-040c, and enforced by an
        ArchUnit rule rather than by an omission test.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachPublishRequest"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPublishResultResponse"
        "400":
          description: COACH_PLAN_EMPTY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            COACH_PUBLISH_REPAIRS_UNACKNOWLEDGED — the digest is absent or no longer matches the
            repairs this draft produces. Nothing is written. The portal's answer is to preview again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/routine/save-as-template:
    post:
      summary: Save this trainee's routine into the coach's own library
      description: >-
        EV-188 AC1. `source=PLAN` copies the trainee's currently published routine document;
        `source=DRAFT` copies the coach's unpublished draft for this link. Guarded by
        `requireActiveLinkRow(WORKOUTS)` like every other mapping that reads a trainee's data — the
        subject here is still a trainee, which is why this one lives under `/clients/{id}` and the
        rest of the library does not.
        The stored template carries the prescription and **no answer the trainee gave about
        themselves**: `constraints.equipment` and `constraints.injuries` are normalised empty at the
        write boundary and refused at the read boundary. A trainee with an active plan and no
        routine document is refused with 400 COACH_TEMPLATE_SOURCE_EMPTY, never an empty template.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateFromRoutineRequest"
      responses:
        "201":
          description: The new template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: >-
            COACH_TEMPLATE_SOURCE_EMPTY, or COACH_TEMPLATE_TOO_LARGE naming the day and its count.
            Nothing is truncated, dropped or saved partially.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN, or COACH_TEMPLATE_LIMIT_REACHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates:
    get:
      summary: The coach's own routine library
      description: >-
        EV-188 AC2. Newest-updated first; each row carries name, day count, exercise count and the
        last-updated date, and nothing else. Unpaged because the cap is 50 rows per coach, enforced
        at the write under a pessimistic lock — a bounded collection, not an unbounded query. A
        second coach sees an EMPTY library, never a filtered view of this one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a template
      description: >-
        EV-188 AC1's "New template". The submitted `constraints.equipment` and
        `constraints.injuries` are stored EMPTY whatever they contain — a template carries the
        prescription and nothing a trainee told us about themselves — and the read boundary refuses
        any row where they are not.
        The document is validated against the FULL publish contract — a template is held to exactly
        the contract a draft is held to, so `trainingDays` must carry 2..6 days and `daysPerWeek`
        must agree. There is no "template validation group": an earlier design had one and it was
        withdrawn, because *strict now, relax later* is reversible while *permissive now, strict
        later* strands rows in a store whose rows live for months.
        The cost is deliberate and the portal must plan for it: **the server is not a scratchpad.**
        An editor may not autosave a document with fewer than two training days; transient invalid
        state belongs to the client, which is where every form editor already keeps it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateSaveRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: >-
            The document is invalid, or COACH_TEMPLATE_TOO_LARGE — a day over 12 exercises, named
            with its count. Nothing is truncated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN, or COACH_TEMPLATE_LIMIT_REACHED at 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}:
    get:
      summary: One template, with its document
      description: >-
        EV-188 AC1. Every denial on this mapping is ONE body — a template belonging to another
        coach, an id that never existed and a template deleted in another tab are the same branch of
        `requireOwnedTemplate`, not three branches that happen to agree. A template has no status
        column and is not soft-deleted, so there is no third state to diverge.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Replace a template
      description: >-
        EV-188 AC2's Edit. Editing REPLACES; there is no versioning and no history, and two variants
        are a Duplicate plus a Rename. **Editing a template after it has been used changes nothing
        for any trainee it was used on** — the copy was one-way and the link was severed at the
        moment of copying. Deleting one changes nothing either.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateSaveRequest"
      responses:
        "200":
          description: The saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: Invalid, or COACH_TEMPLATE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a template
      description: >-
        EV-188 AC2. After it, every draft and every published plan previously produced from this
        template is COMPLETELY unchanged — `coach_plan_drafts.source_template_id` is ON DELETE SET
        NULL, so the editor's "Started from {name}" line disappears and nothing else does. That is a
        delete RULE, not a test.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/rename:
    post:
      summary: Rename a template
      description: >-
        EV-188 AC2. Its own mapping rather than a nullable document on the save body: a rename from
        the library list must not have to fetch the whole document first, and "null means leave it
        alone" is the suppression-parameter shape this API rejects by rule. A name the coach already
        uses is refused and leaves BOTH templates unchanged. The uniqueness key folds case and
        surrounding whitespace, because a coach who has "Push Day" does mean they already have
        "push day ".
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateRenameRequest"
      responses:
        "200":
          description: The renamed template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "400":
          description: Empty, whitespace-only, or over 80 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/duplicate:
    post:
      summary: Duplicate a template
      description: >-
        EV-188 AC2. The copy is named "{name} (copy)", then "(copy 2)" and so on — the name key is
        folded and unique, so the suffix must probe, and the probe is BOUNDED rather than a loop.
        The copy is **semantically** identical (same days, same exercises, same prescriptions), not
        byte-identical: it re-serialises through the same write boundary, and copying the raw JSONB
        in SQL would bypass the boundary the stripping guarantee depends on. No template write path
        may bypass it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_TEMPLATE_LIMIT_REACHED at 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/templates/{id}/apply:
    post:
      summary: Use this template on a trainee
      description: >-
        EV-188 AC3. Fills THAT trainee's draft and touches nothing else: no `plans` row, no
        `user_plan` row, no assignment row. The trainee's app, refreshed at that moment, still shows
        their old plan. Publishing is EV-184's unchanged preview → digest → publish, with the same
        repair acknowledgement and the same provenance — `plans.authored_by` is the coach,
        `plans.source` is COACH and `plans.source_plan_id` stays NULL. A template-derived plan is
        indistinguishable, to the trainee, from a hand-built one, and that is intended.
        **Apply is DEFAULT-REFUSING.** Without `replacesDraftUpdatedAt`, an existing draft answers
        409 COACH_DRAFT_EXISTS carrying that draft's `updatedAt`, and the retry echoes it. The
        comparison happens inside the write transaction, so a second tab that saved in between
        causes the retry to be refused AGAIN rather than to overwrite — which is the only thing that
        makes the portal's "this replaces your unpublished draft" sentence true.
        Apply runs NO policy: the trainee's injuries and equipment are applied when the plan is
        PUBLISHED. Since BUG-195b (ADR-0018 D8) apply runs the SAME resolution as
        `PUT …/routine/draft`: the stored draft's `goal` and `level` are the TRAINEE's own answers,
        not the template's, and its day counts are derived from `trainingDays`. The template's
        `weeklyProgression` is NOT carried: the draft's is `[]` (ADR-0018 D10 — it was written about
        whoever the template was saved from, and no coach control shows it). On a `DURATION`
        exercise, `reps` is cleared rather than refused: templates saved by the earlier portal
        carry its "8-12" default on timed exercises, and the plan writer never used it. The
        template row itself is never changed. `unbindableExercises` is advisory — every exercise is copied
        verbatim and nothing is ever removed except by the coach pressing Remove.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTemplateApplyRequest"
      responses:
        "200":
          description: The trainee's draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTemplateApplyResponse"
        "400":
          description: >-
            COACH_PLAN_EMPTY for a template with no training day,
            COACH_TEMPLATE_NOT_PUBLISHABLE for a day count a plan cannot carry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Foreign, unknown or deleted template; a clientId this coach is not linked to; or a link
            without WORKOUTS. Answered EVEN WHILE the catalogue is unavailable, so a stranger never
            learns the catalogue's state from a 503 where they should have had a 403.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_DRAFT_EXISTS — `details.existingUpdatedAt` is what the retry echoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/recipes:
    get:
      summary: The coach's own recipe library
      description: >-
        EV-256a / ADR-0026 D26.1. Alphabetical by name; each row carries the name, the macros and
        the ingredient count. Unpaged because the cap is 100 recipes per coach, enforced at the
        write under the coach-profile row lock and repeated as the query's LIMIT, so it is a bounded
        collection rather than an unbounded query. A second coach sees an EMPTY library, never this
        one's. Not behind the placement flag (EV-256 ruling R5).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a recipe
      description: >-
        EV-256a AC1. One serving. Every ingredient key must be exactly one returned by
        `GET /coach-portal/ingredients`: the key is checked AS SENT against
        `^[a-z][a-z0-9_]{1,63}$` and then against the vocabulary, so `Chicken_Breast` and
        `" chicken_breast "` are refused even though they would normalise to a known key. Nothing is
        checked against any trainee here: a recipe belongs to no trainee, and a trainee's food rules
        are checked when a recipe is placed on their plan (EV-256c).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeSaveRequest"
      responses:
        "201":
          description: Created. The same body `GET /coach-portal/recipes/{id}` returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "400":
          description: >-
            `COACH_RECIPE_UNKNOWN_INGREDIENT` with `details.key` (as sent) and `details.field`, for
            a key that is blank, has upper case, does not match the pattern, or is not in the
            vocabulary. `COACH_RECIPE_MACROS_INCONSISTENT` with `details.computedKcal` when
            `|kcal − (4·P + 4·C + 9·F)| > max(50, 0.15 × kcal)`. `VALIDATION_ERROR` for every
            other bound, naming the field in `details.field` or at the start of `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `COACH_RECIPE_NAME_TAKEN` (this coach already has the name, ignoring case and
            surrounding spaces), or `COACH_RECIPE_LIMIT_REACHED` at 100 recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/recipes/{id}:
    get:
      summary: One recipe
      description: >-
        EV-256a AC6. Every denial on this mapping is ONE body: a recipe belonging to another coach,
        an id that never existed and a recipe deleted in another tab are the same branch of
        `requireOwnedRecipe`. A recipe has no status column and is not soft-deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
