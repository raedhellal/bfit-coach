  # BUG-023 — consent recording (SPRINT-4-GDPR-DESIGN-2026-08-30 §6).
  /auth/register:
    post:
      summary: Register a new user
      description: >-
        Records the user's acceptance of the privacy policy and the terms of service as two
        append-only rows in user_consents (GDPR Art. 7(1)). Consent is required: a request without
        consentAccepted=true is refused with 400 CONSENT_REQUIRED and creates no account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: >-
            Invalid request (VALIDATION_ERROR, naming the field; e.g. a control character in
            fullName, BUG-313, or a password over 72 bytes in UTF-8, BUG-415), or consent absent or
            refused (CONSENT_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Email already registered (DUPLICATE_EMAIL), or the client displayed a policy version
            that is no longer current (CONSENT_VERSION_STALE — details carry privacyPolicyVersion
            and termsVersion; the client should prompt for an app update)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (RATE_LIMITED)
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying — what is left of the fixed window that
                refused the request (BUG-152). Always at least 1, and capped at 86400 so a
                long reset (the monthly AI quota) is still a value a client can schedule.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/mfa/recovery-codes/regenerate:
    post:
      summary: Replace every recovery code with 10 new ones (requires the password)
      description: >-
        Needs a full access token (not the scope=mfa token a login challenge returns), a verified
        email address and the account password, and an enabled MFA factor. Answers the 10 new
        codes, shown exactly once; every earlier code stops working.
        A wrong password counts toward the per-account limit shared by the four routes that check
        the account password (POST /me/account/password, POST /me/account/email, POST
        /auth/mfa/recovery-codes/regenerate, DELETE /auth/mfa/totp; BUG-416): 5 per clock minute,
        the same number and window as the per-account limit of /auth/login but a separate counter.
        Once 5 wrong passwords are counted in the minute, every request to any of the four is
        refused 429, the right password included, until the minute ends. Only a wrong password
        counts: "MFA is not enabled" (401 AUTH_MFA_INVALID, which only the right password
        reaches) does not, nor does a success.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The new recovery codes, shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          description: >-
            VALIDATION_ERROR naming the field (a blank password), or INVALID_REQUEST (a malformed
            body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            AUTH_UNAUTHORIZED (no token, an invalid or expired one, or a scope=mfa token),
            AUTH_INVALID_CREDENTIALS (the password is wrong; counts toward the limit), or
            AUTH_MFA_INVALID (the password is right but no MFA factor is enabled; nothing changes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            EMAIL_NOT_VERIFIED (verify the address first), or AUTH_FORBIDDEN (a PENDING account:
            activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            USER_NOT_FOUND: the token is still valid but its account has been erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >-
            RATE_LIMITED: this account already has 5 wrong passwords in this clock minute, counted
            across the four password-checking routes (BUG-416). The password is not checked and
            nothing changes, even when it is right.
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying (what is left of the window that refused
                the request). Always at least 1, and capped at 86400.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/mfa/totp:
    delete:
      summary: Disable TOTP (requires the password and a current TOTP or recovery code)
      description: >-
        Needs a full access token (not the scope=mfa token a login challenge returns), a verified
        email address, the account password and a live TOTP code or an unused recovery code. The
        password is checked before the code.
        A wrong password counts toward the per-account limit shared by the four routes that check
        the account password (POST /me/account/password, POST /me/account/email, POST
        /auth/mfa/recovery-codes/regenerate, DELETE /auth/mfa/totp; BUG-416): 5 per clock minute,
        the same number and window as the per-account limit of /auth/login but a separate counter.
        Once 5 wrong passwords are counted in the minute, every request to any of the four is
        refused 429, the right password included, until the minute ends. Only a wrong password
        counts: a wrong TOTP or recovery code (401 AUTH_MFA_INVALID) does not, nor does "TOTP is
        not enabled", nor a success.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTotpRequest"
      responses:
        "204":
          description: TOTP disabled. No body.
        "400":
          description: >-
            VALIDATION_ERROR naming the field (a blank password, a blank code, or a code over 32
            characters), or INVALID_REQUEST (a malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            AUTH_UNAUTHORIZED (no token, an invalid or expired one, or a scope=mfa token),
            AUTH_INVALID_CREDENTIALS (the password is wrong; counts toward the limit), or
            AUTH_MFA_INVALID (the password is right but TOTP is not enabled, or the code is wrong;
            does not count, and nothing changes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            EMAIL_NOT_VERIFIED (verify the address first), or AUTH_FORBIDDEN (a PENDING account:
            activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            USER_NOT_FOUND: the token is still valid but its account has been erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >-
            RATE_LIMITED: this account already has 5 wrong passwords in this clock minute, counted
            across the four password-checking routes (BUG-416). The password is not checked and
            nothing changes, even when it is right.
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying (what is left of the window that refused
                the request). Always at least 1, and capped at 86400.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /legal/versions:
    get:
      summary: Current legal document versions
      description: >-
        Unauthenticated: the client needs these strings before it can render the consent control on
        the registration screen. Echo the matching value back as consentPolicyVersion.
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalVersionsResponse"
  /me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/activation:
    get:
      summary: Whether this account still has to be activated (EV-204a1, ADR-0022 D22.9e)
      description: >-
        One of the three routes a PENDING account may call (the others are POST /me/activate and
        /auth/email/verification/**). An account initialised by a coach, a gym or Evoli holds the
        role PENDING until its person activates it, and every route not on that allowlist and not
        public answers it 403 AUTH_FORBIDDEN. A full account gets {"pending": false} and nulls.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_NOT_INITIALISED — a PENDING account with no initialisation record (a data defect
            no writer produces; never guessed around)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/activate:
    post:
      summary: Activate an initialised account (EV-204a1, ADR-0022 D22.9)
      description: >-
        In one transaction: checks the temporary password, validates the new one, records privacy
        and terms consent with source ACTIVATION, grants the role recorded when the account was
        initialised (the body has NO role field; one sent is ignored), stamps the activation and
        returns fresh tokens. The role is a JWT claim, so the client must switch to these tokens
        before its next authenticated read: the old ones still carry PENDING and are refused
        everywhere else. Any refusal persists nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountRequest"
      responses:
        "200":
          description: Activated; fresh tokens for the full account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: >-
            VALIDATION_ERROR (a missing field, a new password under 8 characters or over 72 bytes in
            UTF-8 (BUG-415), or a control, line-break or invisible format character in fullName,
            BUG-313),
            TEMPORARY_PASSWORD_INVALID (the temporary password is not the latest one issued; a 400,
            not a 401, so clients do not refresh-and-retry and spend two attempts per typo),
            TEMPORARY_PASSWORD_REUSED (the new password equals the temporary one), or
            CONSENT_REQUIRED (consentAccepted absent or false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized (no or invalid token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_ALREADY_ACTIVE (the account is not pending), CONSENT_VERSION_STALE (a displayed
            version is not current), or ACCOUNT_NOT_INITIALISED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: >-
            ACTIVATION_EXPIRED — at or after expiresAt (created + 30 days; a resend never moves it).
            The remedy is a new initialisation by whoever set the account up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: >-
            ACTIVATION_GRANT_INVALID — the recorded role is not a full account (a data defect the
            schema makes unreachable; never reported as ACCOUNT_ALREADY_ACTIVE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED — the 11th activation attempt within 15 minutes for this account
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/account/password:
    post:
      summary: Change the current user's password
      description: >-
        Needs the current password and a verified email address. Answers fresh tokens: the token
        version is bumped, so every other session's refresh token stops working, and every trusted
        device is revoked. The calling session's MFA state is carried into the new tokens, never
        granted by this call (BUG-165). A wrong currentPassword counts toward a per-account limit
        (BUG-416) whose number and window match the per-account limit of /auth/login (5 per clock
        minute), but which is a separate counter: /auth/login's attempts never count here, and these
        never count there. This counter is shared by the four routes that check the account password
        (this one, POST /me/account/email, POST /auth/mfa/recovery-codes/regenerate and DELETE
        /auth/mfa/totp). Unlike /auth/login, which still lets the right password through once its
        limit is reached, here every request is refused 429 once 5 wrong passwords have been counted
        in the clock minute, the right password included, until the minute ends. Only a wrong
        password counts. A currentPassword of any length is accepted and compared by its first 72
        UTF-8 bytes, bcrypt's limit (BUG-415): only a newPassword is held to 72 bytes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; use these tokens from now on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: >-
            VALIDATION_ERROR naming the field (a blank field, newPassword shorter than 8
            characters, or newPassword over 72 bytes in UTF-8, bcrypt's limit, BUG-415), or
            INVALID_REQUEST (a malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            AUTH_UNAUTHORIZED (no token, or an invalid or expired one), or AUTH_INVALID_CREDENTIALS
            (currentPassword is wrong; nothing changes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            EMAIL_NOT_VERIFIED (verify the address first), or AUTH_FORBIDDEN (a PENDING account:
            activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            USER_NOT_FOUND: the token is still valid but its account has been erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >-
            RATE_LIMITED: this account already has 5 wrong current passwords in this clock minute,
            counted across the four password-checking routes (this one, POST /me/account/email, POST
            /auth/mfa/recovery-codes/regenerate, DELETE /auth/mfa/totp; BUG-416), on a counter apart
            from /auth/login's. The password is not checked and nothing changes, even when it is
            right.
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying (what is left of the window that refused
                the request). Always at least 1, and capped at 86400.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/account/email:
    post:
      summary: Request an email change
      description: >-
        Step 1 of 2. Needs the current password and a verified email address. A six-digit code is
        mailed to newEmail (not to the current address); nothing about the account changes until
        POST /me/account/email/confirm. Two limits, both per account. (1) A wrong password counts
        toward a per-account limit (BUG-416) whose number and window match the per-account limit of
        /auth/login (5 per clock minute), but which is a separate counter: /auth/login's attempts
        never count here, and these never count there. This counter is shared by the four routes
        that check the account password (POST /me/account/password, this one, POST
        /auth/mfa/recovery-codes/regenerate and DELETE /auth/mfa/totp). Unlike /auth/login, which
        still lets the right password through once its limit is reached, here every request is
        refused 429 once 5 wrong passwords have been counted in the clock minute, the right password
        included, until the minute ends. Only a wrong password counts. (2) Codes: one per clock
        minute and three per clock hour (fixed windows: two codes a second apart either side of a
        minute boundary are both sent). A request refused with 400, 401, 403 or 409 stores and mails
        nothing and does not count against the code limit; a 401 AUTH_INVALID_CREDENTIALS does count
        against the wrong-password limit. A password of any length is accepted and compared by its
        first 72 UTF-8 bytes, bcrypt's limit (BUG-415).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "200":
          description: A confirmation code was mailed to newEmail. No body.
        "400":
          description: >-
            VALIDATION_ERROR naming the field: a blank field, newEmail not an address, or newEmail
            holding a control, line-separator or invisible format character (Unicode Cc, Cf, Zl,
            Zp; BUG-390). INVALID_REQUEST: an address the bean check admits and the account rule
            refuses (for example no dot in the domain, "name@localhost"), or a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            AUTH_UNAUTHORIZED (no token, or an invalid or expired one), or AUTH_INVALID_CREDENTIALS
            (password is wrong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            EMAIL_NOT_VERIFIED (verify the current address first), or AUTH_FORBIDDEN (a PENDING
            account: activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            USER_NOT_FOUND: the token is still valid but its account has been erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            DUPLICATE_EMAIL: newEmail is already another account's address, or is already this
            account's own
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >-
            RATE_LIMITED: a second code in the same clock minute, or a fourth in the same clock hour,
            for this account; or this account already has 5 wrong current passwords in this clock minute
            (this route and POST /me/account/password count together; BUG-416), in which case the
            password is not checked. Nothing is mailed
          headers:
            Retry-After:
              description: >-
                Whole seconds to wait before retrying (what is left of the window that refused
                the request). Always at least 1, and capped at 86400.
              schema:
                type: integer
                minimum: 1
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/account/email/confirm:
    post:
      summary: Confirm an email change with the mailed code
      description: >-
        Step 2 of 2. The code proves ownership of the new address, so the address is swapped in and
        stored as verified, a notice goes to the old address, and fresh tokens are answered (the
        token version is bumped, so other sessions' refresh tokens stop working). The code is
        single use. Five wrong codes retire it: request a new one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Address changed; use these tokens from now on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: >-
            VALIDATION_ERROR (code blank or not six digits), INVALID_REQUEST (a malformed body),
            OTP_INVALID (a wrong code, or no pending email change), OTP_EXPIRED (the code is past
            its lifetime), or OTP_TOO_MANY_ATTEMPTS (five wrong codes; the code is retired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED (no token, or an invalid or expired one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: AUTH_FORBIDDEN (a PENDING account; activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            USER_NOT_FOUND: the token is still valid but its account has been erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            DUPLICATE_EMAIL: the new address became another account's between the request and the
            confirm; nothing changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/nomination:
    post:
      summary: Pull a fresh invite to the coach this account was set up for (EV-204a2, ADR-0019 A2g)
      description: >-
        Only for an activated account whose initialisation row names a nominee coach, and only while
        its derived status is ACTIVATED (the current nomination not accepted by this person). Mints
        one single-use invite for the nominee with the ordinary 7-day TTL, expires the previous
        unused nomination, and records the new one. Writes NO consent and NO link: accept the token
        with POST /me/my-coach/accept, unchanged. No request body; the coach comes from the account's
        own initialisation row, so a body naming another coach is ignored. Covered by the /me/**
        ACCOUNT floor, not the PENDING allowlist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A fresh token and the coach's display name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NominationResponse"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            A PENDING account (activate first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            NOMINATION_NOT_FOUND — no initialisation row, no nominee coach, or the nominee is no longer a coach (no coach profile, or coach status revoked: the COACH role is gone while the profile is kept); nothing is written, and an earlier nomination invite is left as it was
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            NOMINATION_CLOSED — the nomination's link is ACTIVE (LINKED) or has ended (LINK_ENDED); after LINK_ENDED only the coach's own invite can link again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED — the 11th pull within an hour for this account; nothing is written
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
