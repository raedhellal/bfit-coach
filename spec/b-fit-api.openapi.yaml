    WorkoutExerciseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        restSeconds:
          type: integer
        mediaKey:
          type: string
        gifUrl:
          type: string
          nullable: true
          description: >-
            Demonstration poster for this exercise, as a path relative to this API's base URL —
            e.g. `/media/musclewiki/thumb/musclewiki_barbell_deadlift_39`. It is NEVER the
            provider's own URL: MuscleWiki's stream URLs require an `X-API-Key` header the client
            does not have and answer 401 without it, so the server proxies them (BUG-087). Clients
            must prefix the API base URL before handing the value to an image loader. Null when the
            catalog has no artwork for the slug. Despite the name the target is a still image.
        exerciseType:
          type: string
          enum: [WEIGHTED, BODYWEIGHT, DURATION]
          nullable: true
          description: How the exercise is logged in a session.
        durationSeconds:
          type: integer
          nullable: true
          description: Target time per set for DURATION exercises (seconds).
        catalogState:
          type: string
          enum: [RESOLVED, STRUCTURAL, UNRESOLVED]
          nullable: true
          description: >-
            What this row's slug means to the exercise catalog (ADR-0009 D5d). `RESOLVED` — bound to
            a catalog row, so `GET /exercises/{slug}` will answer. `STRUCTURAL` — session scaffolding
            (a warm-up or cool-down block, slug `structural__<kind>`): it has no catalog row **by
            design**, `GET /exercises/{slug}` answers 404 deliberately, and the client must NOT show
            the "no details yet" error state for it — that copy promises something that will never
            arrive. `UNRESOLVED` — a real movement the catalog does not hold; the error state IS
            right here. The client cannot derive this: a missing `gifUrl` plus a 404 look identical
            in the two cases and want opposite presentation. Null only from an older server.
      required:
        - id
        - slug
        - name
        - sets
        - reps
        - restSeconds
