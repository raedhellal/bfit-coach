        - source
    PlannedMealBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slot:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
        ordinal:
          type: integer
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
