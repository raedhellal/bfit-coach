          enum: [STRENGTH_A, STRENGTH_B, FULL_BODY, CARDIO, MOBILITY, REST]
          nullable: true
        title:
          type: string
          nullable: true
        type:
          type: string
          enum: [STRENGTH_A, STRENGTH_B, FULL_BODY, CARDIO, MOBILITY, REST]
        restDay:
