    ChallengeMetric:
      type: string
      description: >-
        STEPS reads the trainee's submitted daily step totals. WORKOUTS counts the trainee's
        completed workout sessions filed inside the window (api only in EV-321a; no portal or app
        UI yet).
      enum: [STEPS, WORKOUTS]
    ActivitySource:
      type: string
      description: >-
        Where a step total came from, as the app reports it. Precedence when a day holds several:
        the device health store first (HEALTHKIT on iOS, HEALTH_CONNECT on Android; one tier, since
        a user only ever has one of the two), then PEDOMETER, then MANUAL. Should a day ever hold
        both health-store sources, the more recently synced one counts. The portal says "via Apple
        Santé" or "via Health Connect", never "vérifié".
      enum: [HEALTHKIT, HEALTH_CONNECT, PEDOMETER, MANUAL]
    ChallengeParticipantStatus:
      type: string
      description: INVITED until the trainee accepts; a decline or a leave deletes the participation.
      enum: [INVITED, ACCEPTED]
    ChallengePhase:
      type: string
      description: >-
        UPCOMING before `startsOn`, ACTIVE from `startsOn` to `endsOn` inclusive, ENDED after.
        Coach reads use the server's UTC date; the trainee's reads use their `X-Timezone` day.
      enum: [UPCOMING, ACTIVE, ENDED]
    ChallengeDayStatus:
      type: string
      description: >-
        MET: the day's value reached the daily target (exactly the target counts). MISSED: a past
        day with a value below the target. IN_PROGRESS: today, with a value below the target (not
        yet missed). NO_DATA: a day up to today with no value from any source; it is NOT a zero,
        and it never counts as met or as steps. FUTURE: after the trainee's today.
      enum: [MET, MISSED, IN_PROGRESS, NO_DATA, FUTURE]
    CoachChallengeCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: 1-80 characters after trimming; no control character or line break.
          example: 10 000 pas par jour
        metric:
          $ref: "#/components/schemas/ChallengeMetric"
        dailyTarget:
          type: integer
          nullable: true
          minimum: 1000
          maximum: 50000
          description: STEPS only (required), steps per day. Must be absent or null for WORKOUTS.
          example: 10000
        totalTarget:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: >-
            WORKOUTS only (required), completed sessions over the window. Must be absent or null
            for STEPS.
        startsOn:
          type: string
          format: date
          example: "2026-10-05"
        endsOn:
          type: string
          format: date
          example: "2026-10-11"
        clientIds:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            `coach_clients` row ids, as the roster returns them (`CoachClientSummaryResponse.id`).
            Each must be an ACTIVE link of this coach.
          items:
            type: string
            format: uuid
      required: [title, metric, startsOn, endsOn, clientIds]
    CoachChallengeSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        metric:
          $ref: "#/components/schemas/ChallengeMetric"
        dailyTarget:
          type: integer
          nullable: true
          description: Set for STEPS, null for WORKOUTS.
        totalTarget:
          type: integer
          nullable: true
          description: Set for WORKOUTS, null for STEPS.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        days:
          type: integer
          description: Days in the window, both ends included (1-93).
        phase:
          $ref: "#/components/schemas/ChallengePhase"
        participantCount:
          type: integer
          description: Visible participants (INVITED and ACCEPTED) whose link is still ACTIVE.
        acceptedCount:
          type: integer
          description: Of those, how many have accepted.
        createdAt:
          type: string
          format: date-time
      required: [id, title, metric, dailyTarget, totalTarget, startsOn, endsOn, days, phase,
                 participantCount, acceptedCount, createdAt]
    CoachChallengePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoachChallengeSummary"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
      required: [items, page, size, totalElements, totalPages]
    ChallengeDay:
      type: object
      properties:
        day:
          type: string
          format: date
          description: The trainee's local calendar day.
        value:
          type: integer
          nullable: true
          description: The winning source's steps; null when there is no data (never 0 for absent).
        source:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivitySource"
        status:
          $ref: "#/components/schemas/ChallengeDayStatus"
      required: [day, value, source, status]
    ChallengeProgress:
      type: object
      description: >-
        Computed at read time from stored rows, never stored. For STEPS every figure is taken over
        the window's days up to the trainee's today, using each day's highest-precedence source.
        For WORKOUTS the figures count completed sessions filed in that range, and `daysMet`,
        `todaySource` and `days` are null.
      properties:
        today:
          type: string
          format: date
          description: The trainee's local today, as this read determined it.
        todayValue:
          type: integer
          nullable: true
          description: >-
            Today's value when today is inside the window. STEPS: null when there is no data for
            today (or today is outside the window). WORKOUTS: sessions completed today (0 is real).
        todaySource:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivitySource"
        daysElapsed:
          type: integer
          description: Window days up to and including the trainee's today (0 before the start).
        daysMet:
          type: integer
          nullable: true
          description: STEPS days whose value reached the target. Null for WORKOUTS.
        total:
          type: integer
          format: int64
          description: >-
            STEPS: the sum of each counted day's winning value (days with no data add nothing).
            WORKOUTS: completed sessions.
        target:
          type: integer
          description: The challenge's `dailyTarget` (STEPS) or `totalTarget` (WORKOUTS).
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest write among the STEPS rows counted; null with none. Null for WORKOUTS.
        days:
          type: array
          nullable: true
          description: One entry per window day, in order. Null for WORKOUTS.
          items:
            $ref: "#/components/schemas/ChallengeDay"
      required: [today, todayValue, todaySource, daysElapsed, daysMet, total, target, syncedAt, days]
    CoachChallengeParticipant:
