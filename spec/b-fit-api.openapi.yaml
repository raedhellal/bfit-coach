        without a HEALTH_DATA_ART9 consent row". Idempotent for an already-completed account,
        including one that completed before consent recording shipped.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatusResponse"
        "400":
          description: >-
            No Art. 9 health-data consent on record for an account that has not completed
            onboarding (CONSENT_REQUIRED) — save the profile with consentAccepted first. Nothing
            is written, including the default profile row this endpoint would otherwise create.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
