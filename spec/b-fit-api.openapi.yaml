      required:
        - recoveryCodes
    ChangeEmailRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: The current password (confirms the change)
        newEmail:
          type: string
          format: email
          # BUG-390: InitialiseTraineeRequest.EMAIL_TEXT, the account-email writers' rule, the same
          # spelling on the server (one class, looped; REQUIRES the JavaScript u flag - without it the
          # class inverts).
          pattern: "^[^\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}]*$"
          description: >-
            The new address; the code is mailed here. No control character, no U+2028/U+2029 and no
            invisible format character (Unicode categories Cc, Cf, Zl, Zp: NEL, ZWSP, BOM, LRM, RLO,
            ZWNJ, ZWJ, ...), anywhere in the address; 400 VALIDATION_ERROR on newEmail. IDN domains
            and non-ASCII local parts are accepted.
      required:
        - password
        - newEmail
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: "^\\d{6}$"
          description: The six-digit code from the email
          example: "123456"
      required:
        - code
    Role:
      type: string
      description: >-
        An account role. PENDING (EV-204a1, ADR-0022) is an account somebody else initialised that
        its person has not yet activated; it holds no other role and reaches only the activation
        allowlist and the public routes.
      enum: [USER, COACH, ADMIN, PENDING]
    ActivateAccountRequest:
      type: object
      description: There is deliberately no role field; the granted role is the one recorded at initialisation.
      properties:
        temporaryPassword:
          type: string
          format: password
          maxLength: 128
          description: The temporary password from the invitation email (proof of the latest one issued)
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: >-
            8 to 128 characters and at most 72 bytes in UTF-8 (bcrypt's limit; an accented letter
            counts as 2 bytes, most emoji as 4). Longer: 400 VALIDATION_ERROR on newPassword
            (BUG-415)
        consentAccepted:
          type: boolean
          description: Acceptance of the privacy policy and the terms; must be true
        privacyPolicyVersion:
          type: string
          maxLength: 32
          example: "v1.0"
        termsVersion:
          type: string
          maxLength: 32
          example: "v1.0"
        fullName:
          type: string
          maxLength: 120
          nullable: true
          # The server evaluates the same set as ONE Java character class, [[^...][\u200C\u200D]]*
          # (InitialiseTraineeRequest.NAME_TEXT, BUG-313 B1): the starred alternation below made
          # java.util.regex recurse per character and overflow the stack on long input. This
          # spelling is documentation only (JavaScript has no nested class union); the two accept
          # exactly the same code points (NameTextPatternTest).
          pattern: "^(?:[^\\p{Cc}\\p{Cf}\\u2028\\u2029]|[\\u200C\\u200D])*$"
          description: >-
            Optional correction of the name the initialiser typed. No control character, no
            U+2028/U+2029 and no invisible format character; ZWNJ and ZWJ are allowed. Otherwise
            400 VALIDATION_ERROR on fullName and nothing is activated (BUG-313, the rule every
            other writer of the account name uses)
      required:
        - temporaryPassword
        - newPassword
    ActivationStatusResponse:
      type: object
      properties:
        pending:
          type: boolean
        grantedRole:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: The role activation grants (USER or COACH); null when not pending
        expiresAt:
          type: string
          format: date-time
          nullable: true
