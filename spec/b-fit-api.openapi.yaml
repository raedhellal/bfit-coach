    ExerciseCatalogDto:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        type:
          type: string
        primaryMuscles:
          type: string
        equipment:
          type: string
        difficulty:
          type: string
        unilateral:
          type: boolean
        tags:
          type: string
        externalId:
          type: string
          nullable: true
        bodyPart:
          type: string
          nullable: true
        targetMuscle:
          type: string
          nullable: true
        secondaryMuscles:
          type: array
          items:
            type: string
        instructions:
          type: array
          items:
            type: string
        gifUrl:
          type: string
          nullable: true
          description: >-
            Absolute URL of a directly-fetchable animated GIF. Only ever set for non-MuscleWiki
            rows. Null for a MuscleWiki exercise, which has no GIF — use `videoUrl` plus
            `thumbnailUrl` instead.
        videoUrl:
          type: string
          nullable: true
          description: >-
            Male/primary demonstration clip, as a path relative to this API's base URL — e.g.
            `/media/musclewiki/video/{slug}?gender=male`. Proxied server-side because the stored
            provider URL requires an `X-API-Key` header (BUG-087); the key is never sent to a
            client and never appears in this URL. Supports `Range`, so a player can seek.
        femaleVideoUrl:
          type: string
          nullable: true
          description: >-
            Female-model variant of `videoUrl`, same form. Falls back to the male clip when the
            catalog row has no female variant, so this is null only when there is no clip at all.
        thumbnailUrl:
          type: string
          nullable: true
          description: >-
            Still poster, as a path relative to this API's base URL — e.g.
            `/media/musclewiki/thumb/{slug}`. Same proxy rule as `videoUrl`. Never a
            `api.musclewiki.com` URL.
        imageStart:
          type: string
          nullable: true
          description: Start-position demonstration photo, when the catalog has one.
        imageEnd:
          type: string
          nullable: true
          description: End-position demonstration photo, when the catalog has one.
        category:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
          description: >-
            Which catalog the row came from. Do NOT use this to decide how to fetch the media — a
            backfilled row can carry another provider's URLs. The server has already resolved every
            URL above; fetch them as given.
        exerciseType:
          type: string
          enum: [WEIGHTED, BODYWEIGHT, DURATION]
          description: How the exercise is logged in a session.
      required:
        - slug
        - name
        - type
    ExerciseSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseCatalogDto"
        total:
          type: integer
      required:
