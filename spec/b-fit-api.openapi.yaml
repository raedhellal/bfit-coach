        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendInvitationRequest"
      responses:
        "200":
          description: Resent; expiresAt unchanged, passwordIssuedAt moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialisedAccountResponse"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not an admin, or AUTH_MFA_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            PENDING_ACCOUNT_NOT_FOUND — no unexpired, admin-initialised pending account with this id (a coach's trainee is the coach's to resend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_ALREADY_ACTIVE — the account is activated; nothing is sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED — the sixth resend within an hour for this admin and account
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            ACCOUNT_INITIALISATION_UNAVAILABLE — no monitored objection inbox is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{id}:
    get:
      summary: Get one user (admin)
      description: >-
        The list item's five fields, then initialisation (EV-278a2, EV-278 AC12). initialisation is
        present while the account is PENDING with an initialisation that has not been activated,
        including an expired account the sweeper has not deleted yet (its expiresAt is then in the
        past). Otherwise the key is present with the value null, including when an activation
        commits while the read is in progress. initialiserName is the same name the 409 ACCOUNT_PENDING
        body and GET /me/activation carry. No password, hash, token or initialiser email is returned.
        The list and search items (GET /admin/users) do not carry initialisation.
        ADMIN is granted only to a session that proved a second factor (BUG-165).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
