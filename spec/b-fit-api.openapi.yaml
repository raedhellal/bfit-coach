          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Replace a recipe
      description: >-
        EV-256a AC7. Replaces the whole recipe and applies every save rule again, including the
        name rule against this coach's OTHER recipes (keeping or re-casing its own name is not a
        collision). No versioning and no history. A meal the recipe was already placed on keeps the
        version that was placed (EV-256 default D-f).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeSaveRequest"
      responses:
        "200":
          description: The saved recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeResponse"
        "400":
          description: As for POST /coach-portal/recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_RECIPE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a recipe
      description: >-
        EV-256a AC7. After it, the id answers the same 403 body as a foreign or random id. A meal
        the recipe was already placed on is a copy and is unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
