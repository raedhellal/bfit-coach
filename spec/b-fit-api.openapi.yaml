          type: string
          format: password
          minLength: 8
          description: >-
            At least 8 characters and at most 72 bytes in UTF-8 (bcrypt's limit; an accented
            letter counts as 2 bytes, most emoji as 4). Longer: 400 VALIDATION_ERROR on newPassword
            (BUG-415)
      required:
        - currentPassword
        - newPassword
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: >-
            The account password. Any length is accepted; bcrypt compares the first 72 UTF-8
            bytes (BUG-415).
      required:
        - password
    DisableTotpRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: >-
            The account password. Any length is accepted; bcrypt compares the first 72 UTF-8
            bytes (BUG-415).
        code:
          type: string
          maxLength: 32
          description: A current TOTP code or an unused recovery code
