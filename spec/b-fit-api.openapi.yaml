          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a nutrition template
      description: >-
        EV-273a AC1. Absolute targets with `PUT /coach-portal/clients/{id}/nutrition/targets`'s
        bounds exactly, and an optional meal structure (omitted = the trainee's own). The calorie
        floor is NOT applied here: a template has no sex; it applies when the template is used,
        through the existing targets write. Every key the request does not declare, at any depth,
        is refused with `COACH_FIELD_NOT_ACCEPTED` (EV-273a AC2); `recipePins` is such a key until
        EV-273c. Applying a template is the portal sending the existing coach writes: no endpoint
        takes a template id and writes anyone's data (ADR-0016b D16b.7).
      security:
        - bearerAuth: []
      requestBody:
        required: true
