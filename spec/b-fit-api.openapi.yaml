  /media/musclewiki/thumb/{slug}:
    get:
      summary: Exercise poster (MuscleWiki pass-through)
      description: >-
        Streams the still poster for a catalog exercise. **Unauthenticated on purpose**: the mobile
        image and video loaders fetch a bare URI and cannot attach a bearer token, and these are
        public catalog assets with no user data. The server attaches the MuscleWiki `X-API-Key`
        header — the key is never in the URL, the response body or any response header. Only URLs
        already stored on a catalog row, on the MuscleWiki host, are proxied; bytes are streamed
        through and never persisted (MuscleWiki Terms §2/§3).
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Image bytes. `Cache-Control: private, max-age=86400`, `Accept-Ranges: bytes`."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content, when the request carried a `Range` header.
        "404":
          description: >-
            No such catalog slug, the row has no artwork, the stored URL is off-host, or upstream
            says the asset is gone. The asset is absent — this is not a service fault.
        "503":
          description: >-
            We cannot reach the provider: `MEDIA_PROVIDER_UNCONFIGURED` when `MUSCLE_WIKI_KEY` is
            not set, `MEDIA_PROVIDER_UNAVAILABLE` when the provider rejects our key. Deliberately
            not a 404 — BUG-087 was a whole product of broken images hidden behind one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Any other upstream failure.
  /media/musclewiki/video/{slug}:
    get:
      summary: Exercise demonstration clip (MuscleWiki pass-through)
      description: >-
        As `/media/musclewiki/thumb/{slug}`, for the MP4 clip. Forwards the client's `Range` header
        upstream and propagates `Content-Range`/`206`, which `expo-video` needs in order to seek
        rather than re-download.
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: gender
          required: false
          description: >-
            `female` selects the female-model variant when the row has one; anything else (or
            absent) serves the male/primary clip.
          schema:
            type: string
            enum: [male, female]
      responses:
        "200":
          description: Video bytes.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content for a `Range` request.
        "404":
          description: Unknown slug, no clip on the row, or upstream 404.
        "416":
          description: The requested range is not satisfiable upstream.
        "503":
          description: >-
            `MEDIA_PROVIDER_UNCONFIGURED` or `MEDIA_PROVIDER_UNAVAILABLE`; see the thumb endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Any other upstream failure.
