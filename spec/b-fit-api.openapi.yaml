        displayName:
          type: string
        tier:
          type: string
          enum: [STARTER]
          description: Read-only; STARTER is the only tier (AC6, ADR-0019 D19.3)
        capacity:
          type: integer
          description: ACTIVE links the tier allows
          example: 10
        activeClients:
          type: integer
          format: int64
          description: ACTIVE coach_clients links now; a REVOKED link counts 0
        status:
          type: string
          enum: [ACTIVE, REVOKED, PENDING]
          description: >-
            ACTIVE holds COACH; REVOKED keeps the profile without the role; PENDING is an
            admin-initialised coach who has not activated
        grantedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When coach status was FIRST granted through the console (a re-grant keeps it); null when no
            grant wrote the profile. Who made the first grant is not recorded (EV-205 edge case 7): pair
            this date with no admin
        lastGrantedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the LATEST grant was made (a first grant, a re-grant after a revoke, or a repair); equal
            to grantedAt until a re-grant. Null when no grant wrote the profile, or when the latest grant
            was made before this field existed (not recorded). A revoke or a rename does not change it
            (BUG-401)
        lastGrantedBy:
          type: string
          format: uuid
          nullable: true
          description: >-
            The admin who made the LATEST grant, the one lastGrantedAt dates; null when none did, or once
            that admin is erased. Never the first granter (BUG-401). Replaces grantedBy, which carried
            the same value under a name that paired it with grantedAt
        requiresReauthentication:
          type: boolean
          description: >-
            Present, and true, only on the answer to a grant or a revoke: the person must sign out and
            sign in again before the coach portal reflects the change (EV-205 AC2)
