        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileRequest"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: >-
            Invalid request (VALIDATION_ERROR), or the Art. 9 health-data consent is missing or
            refused while onboarding is not yet complete (CONSENT_REQUIRED) — the profile is
            not saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The client displayed a policy version that is no longer current
            (CONSENT_VERSION_STALE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
