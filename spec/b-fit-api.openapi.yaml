    UserProfileRequest:
      type: object
      properties:
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        heightCm:
          type: integer
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        fitnessLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        primaryGoal:
          type: string
          enum: [LOSE_WEIGHT, BUILD_MUSCLE, GET_STRONGER, ENDURANCE, MOBILITY]
        weeklyDays:
          type: integer
        sessionMinutes:
          type: integer
        equipment:
          type: array
          items:
            type: string
          description: >-
            ADR-0005 — the published equipment vocabulary. Deliberately documented and NOT validated:
            no enum, no server-side rejection. Unknown tokens already fail closed (the server maps
            tokens to catalog equipment categories with an explicit table, so a token it does not
            recognise unlocks nothing and the user keeps the always-available bodyweight floor), and
            the token that causes harm is GYM — which any enum would have to contain, so validation
            would not have prevented BUG-049. Rejecting unknown tokens would also invert the deploy
            order for a mobile client: adding a chip would become backend-deploy-first, and an old
            binary emitting a since-renamed token would get a 400 on the last screen of onboarding.

            The list below is the single document the two repos assert against: b-fit-mobile checks
            its EQUIPMENT_TOKENS union against it, and b-fit-api checks EquipmentCatalogMap's key set
            against it. If they drift, the failure mode is narrowing, not rejection.

            An empty array means NOT ANSWERED and is a distinct state from ["NONE"] (answered: owns
            nothing). The server never substitutes a value for an unanswered equipment question.

            Tokens: BARBELL, BANDS, BENCH, BODYWEIGHT, CABLE_MACHINE, DUMBBELLS, GYM, KETTLEBELL,
            NONE, PULL_UP_BAR, SQUAT_RACK
        injuries:
          type: array
          items:
            type: string
          nullable: true
        consentAccepted:
          type: boolean
          description: >-
            BUG-023 §6.5 — explicit consent to processing health data (GDPR Art. 9(2)(a)). Required
            while the account has NOT yet completed onboarding: without it the request is
            400 CONSENT_REQUIRED and no health data is stored. Optional and idempotent once
            onboarding is complete, because accounts that completed it before consent recording
            shipped have no consent row and are deliberately not backfilled.
        privacyPolicyVersion:
          type: string
          maxLength: 32
          example: "v1.0"
          description: >-
            Privacy policy version the client displayed, from GET /legal/versions. Only the privacy
            policy: the Art. 9(2)(a) basis is the policy the user was shown, not the terms.
    UserProfileResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        gender:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        heightCm:
          type: integer
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        fitnessLevel:
          type: string
        primaryGoal:
          type: string
        weeklyDays:
          type: integer
        sessionMinutes:
          type: integer
        equipment:
          type: array
          items:
            type: string
        injuries:
          type: array
          items:
            type: string
          nullable: true
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - fitnessLevel
        - primaryGoal
        - weeklyDays
        - sessionMinutes
        - equipment
        - onboardingCompleted
