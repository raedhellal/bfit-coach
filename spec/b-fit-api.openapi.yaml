          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionTemplateResponse"
        "400":
          description: >-
            `COACH_FIELD_NOT_ACCEPTED` naming an undeclared key at any depth. `VALIDATION_ERROR`
            naming the field (at the start of `message`) for a missing, fractional or out-of-bound
            target, a `mealStructure` without both of its fields, or a name that is empty or over
            80 characters after trimming. `COACH_MEAL_STRUCTURE_OUT_OF_RANGE` for `mealsPerDay`
            outside 1-6.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `COACH_NUTRITION_TEMPLATE_NAME_TAKEN` (this coach already has a nutrition template with
            the name, ignoring case and surrounding spaces; a routine template with it is fine), or
            `COACH_NUTRITION_TEMPLATE_LIMIT_REACHED` at 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/nutrition-templates/{id}:
    get:
      summary: One nutrition template
      description: >-
        EV-273a AC4. Every denial on this mapping is ONE body, `code` included: a template belonging
