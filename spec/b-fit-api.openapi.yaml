                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_NUTRITION_TEMPLATE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a nutrition template
      description: >-
        EV-273a. After it, the id answers the same 403 body as a foreign or random id. Trainees it
