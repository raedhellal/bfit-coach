  /admin/accounts:
    post:
      summary: Initialise a coach account (admin; EV-278a, ADR-0022 D22.8c)
      description: >-
        Creates an account holding only PENDING, its coach profile (display name = fullName, the default
        tier; inert until activation), and a provisioning row naming this admin as initialiser (kind
        ADMIN, granted role COACH, ai_mode FULL). Emails the person a generated temporary password with
        the Art. 14 notice (Reply-To is the monitored objection inbox; the source named is Evoli; line 8
        points at the coach portal). Writes NO consent and NO coach link: the coach consents when
        finishing the account (POST /me/activate). The password is never returned. An expired,
        unactivated account at the address counts as absent and is replaced in the same transaction.
        Not throttled (D22.8c). ADMIN is granted only to a session that proved a second factor
        (BUG-165). GYM_OWNER arrives with EV-281a.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInitialiseAccountRequest"
      responses:
        "201":
          description: Initialised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialisedAccountResponse"
        "400":
          description: >-
            VALIDATION_ERROR — missing or invalid email, fullName (over 80, or a control character, line break or invisible format character) or kind, or a malformed locale; INVALID_REQUEST — a kind other than COACH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not an admin, or AUTH_MFA_REQUIRED (no second factor proved this session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_EXISTS — the address has an activated account; details.userId is that account (open
            its user page and use Make coach). ACCOUNT_PENDING — the address has an unexpired account
            waiting to be finished; details carry userId, initialiserKind (COACH, GYM or ADMIN),
            initialiserName (the coach's display name or "Evoli"; null once the initialiser was erased),
            createdAt and expiresAt. Nothing is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            ACCOUNT_INITIALISATION_UNAVAILABLE — no monitored objection inbox is configured (BFIT_OBJECTION_INBOX), so no lawful invitation can be sent. Nothing is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/accounts/{id}:
    delete:
      summary: Withdraw any unactivated initialised account (admin; EV-204a2, ADR-0022 D22.10c)
      description: >-
        Hard-deletes an account that still holds PENDING, whoever initialised it, with everything it
        held (its role, provisioning row and, for a coach, its coach profile). Refuses an activated
        account with 409 ACCOUNT_ALREADY_ACTIVE (EV-278 AC8b). ADMIN is granted only to a session that
        proved a second factor (BUG-165).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: >-
            Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not an admin, or no second factor proved this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            PENDING_ACCOUNT_NOT_FOUND — no such pending account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            ACCOUNT_ALREADY_ACTIVE — the account is activated (or was never pending); nothing is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/accounts/{id}/resend:
    post:
      summary: Resend an admin-initialised invitation with a new temporary password (admin; EV-278a)
      description: >-
        Emails a new temporary password for a pending account the admin initialised. The old one stops
        signing in and every refresh token minted from it stops refreshing (token_version is bumped).
        The expiry does NOT move; the new email states the same date. Throttled per admin and account
        (5 an hour).
      security:
        - bearerAuth: []
      parameters:
