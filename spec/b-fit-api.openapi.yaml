  /coach-portal/nutrition-templates/{id}/duplicate:
    post:
      summary: Duplicate a nutrition template
      description: >-
        EV-273a. The copy is named "{name} (copy)", then "(copy 2)" and so on up to "(copy 20)",
        with the same targets and meal structure. The original is shortened when needed so the
        suffix always fits in 80 characters.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
