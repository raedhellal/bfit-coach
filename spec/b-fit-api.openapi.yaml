    UserPlanResponse:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        name:
          type: string
        goal:
          type: string
        level:
          type: string
        weeklyDays:
          type: integer
        sessionMinutes:
          type: integer
        equipment:
          type: array
          items:
            type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/PlanScheduleEntryResponse"
        source:
          type: string
          enum: [SELF, AI, COACH, CATALOGUE]
          description: >-
            EV-184c / ADR-0015 D8 — who produced this plan. Always present (`plans.source` is NOT
            NULL). **Never render this alone as attribution**: COACH with a null `authoredByName`
            means "programmed by a coach who has since left Evoli", and showing that as an Evoli plan
            silently reassigns a human professional's programming to us.
            AI on a hand-edited plan is a known wrong label, kept because fixing it would change this
            response for every existing user.
        authoredByName:
          type: string
          nullable: true
          description: >-
            The author's DISPLAY NAME — not a user id, because the client has no endpoint that
            resolves one. For a coach it is their PROFESSIONAL name (`coach_profiles.display_name`,
            the same name `GET /me/my-coach` returns), falling back to the account name only when
            there is no coach profile row: a coach's professional name is not necessarily their
            account name, and one coach must not appear under two names on one device. Three render branches, all required (EV-184 AC5): a name → "Programmed by
            {name}"; `source = COACH` with null → "Programmed by a coach who has left"; anything
            else → no byline. Never "Programmed by null", never a blank line.
            Null collapses two facts on purpose — no author at all, or an author whose account was
            erased (`plans.authored_by` is ON DELETE SET NULL) — and the pair with `source` is what
            separates them.
      required:
        - planId
        - name
        - goal
        - level
        - weeklyDays
        - sessionMinutes
        - equipment
        - schedule
        - source
