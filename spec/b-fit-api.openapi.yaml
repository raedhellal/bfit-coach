          type: string
          format: date-time
        aiIncluded:
          type: boolean
          description: >-
            EV-286a / ADR-0028 §3c. False for a coached account: its AI features are not included,
            and its AI entry points answer 403 AI_NOT_INCLUDED. A positive flag, so a client that
            ignores it behaves as before; the api refuses regardless.
      required:
