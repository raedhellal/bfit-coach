  /exercises/sync:
    post:
      summary: Sync the exercise catalog from the configured provider (admin)
      description: >-
        Pulls the MuscleWiki catalog into the local exercise catalog and returns a summary of what
        was fetched, created, updated and skipped (EV-003 / BUG-007). Restricted to ROLE_ADMIN:
        the pull is long-running and runs against a metered paid upstream quota, so a self-serve
        caller could amplify cost at will. Enforced by a request matcher in SecurityConfig, not by
        the controller — an authenticated non-admin gets 403 AUTH_FORBIDDEN, an anonymous caller
        401. Since BUG-165 ROLE_ADMIN is granted only to a session that proved a second factor, so
