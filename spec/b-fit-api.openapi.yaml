  # NOTE (EV-071a): POST /me/nutrition/plan/day/{dayId}/regenerate is ABSENT from this spec
  # entirely — pre-existing (absent at 8636119 too), not introduced here. It now answers 422
  # NO_SAFE_MEAL_PLAN like the two coach-portal operations below.
  #
  # Documenting the route needs its own row, and AT THE TIME OF WRITING THAT ROW IS NOT FILED —
  # senior-qa owns filing it. Said that way on purpose: a comment that claims a row exists becomes
  # the record instead of the row, which is the failure ruling 5.8 named about its own flag.
  /me/nutrition/plan/week:
    post:
      summary: Generate (or replace) the 7-day meal plan for a week (uses one AI credit)
      description: >-
        Answers **201** with a week whose `status` is `GENERATING`: the first day carries meals and
        the rest stream in on a background pool, so a client must re-read (or poll) before treating
        the week as complete. Replaces any existing week on the same plan ROW — the plan id, and the
        grocery list hanging off it, survive.


        Undocumented until EV-185a, which is why it is written out here in full: the route was
        missing from this spec entirely while mobile consumed it, so `contracts.ts` carried no type
        for it at all.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWeekRequest"
      responses:
        "201":
          description: The week, GENERATING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the account's allergies and food rules rule out every
            recipe the server can check, so no week was produced. The plan row is written with
            `status: REFUSED` and zero days, replacing whatever was there, so a follow-up GET
            returns the refusal rather than a stale week.


            The client renders its refusal state from the **status** and this **code**. The
            `message` is developer-facing, is not translated and is **not copy** — displaying it, or
            the code, or any exception text is the defect BUG-173 records. `details` is absent on
            purpose: which rule blocked is never put on the wire.


            The first refusal on a given week refunds the GENERATE credit it consumed; a second
            refusal on the same week does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: AI_CREDITS_EXHAUSTED — the account's GENERATE allowance is spent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: The weekly plan (current week by default; falls back to the latest active)
      security:
        - bearerAuth: []
      parameters:
        - name: weekStartDate
          in: query
          required: false
          description: The week's Monday; defaults to the current week, then the latest ACTIVE one.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No weekly plan yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/nutrition/today:
    get:
      summary: Today's nutrition — target vs consumed vs remaining, plus entries and streak
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: The day to view; defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day's nutrition
          content:
