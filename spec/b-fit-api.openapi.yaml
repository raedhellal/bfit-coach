            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Foreign, unknown or deleted — one undifferentiated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/nutrition-templates:
    get:
      summary: The coach's own nutrition template library
      description: >-
        EV-273a / ADR-0016b. Newest-updated first. Unpaged because the cap is 50 templates per
        coach, enforced at the write under the coach-profile row lock and repeated as the query's
        LIMIT, so it is a bounded collection rather than an unbounded query. A second coach sees an
        EMPTY library, never this one's. Nothing here is visible to a trainee.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionTemplateListResponse"
        "401":
          description: Unauthorized
