    GrantEntitlementRequest:
      type: object
      description: >-
        Both fields optional so an admin can grant just a tier, just credits, or both. plan is
        validated server-side (unknown -> 400); credits must be non-negative. creditsMode defaults
        to SET.
      properties:
        plan:
          type: string
          nullable: true
          description: "Subscription tier id: free / premium / premium_plus (or the 'plus' alias). Omit to leave the tier unchanged."
          example: premium_plus
        credits:
          type: integer
          nullable: true
          minimum: 0
          description: AI credits to grant. Omit to leave the balance unchanged.
          example: 500
        creditsMode:
          type: string
          nullable: true
          enum: [SET, ADD]
          default: SET
          description: How credits are applied. SET replaces the balance, ADD increments it.
    AdminEntitlementResponse:
      type: object
      description: The target user's resulting entitlement state after the grant.
      properties:
        userId:
          type: string
          format: uuid
        subscription:
          $ref: "#/components/schemas/SubscriptionResponse"
        credits:
          $ref: "#/components/schemas/AiCreditStatus"
      required:
        - userId
        - subscription
        - credits
    SubscriptionPlanResponse:
      type: object
      description: >-
        One tier of the paywall catalog. Note the absence of a `popular` flag — see
        GET /subscriptions/plans.
      properties:
        id:
          type: string
          example: premium_plus
        name:
          type: string
          example: Premium Plus
        price:
          type: number
          format: double
          description: Amount in EUR. There is no currency field yet (BUG-028).
          example: 19.99
        period:
          type: string
          description: Billing period suffix, empty for the free tier.
          example: /mo
        features:
          type: array
          description: >-
            Display lines, rendered verbatim by the client. Each one names a capability that is
            gated at this tier: AI coach chat is PREMIUM_PLUS-only (SubscriptionBillingGateway),
            as is the larger monthly AI credit allowance (AiCreditService). PREMIUM currently has
            no entitlement of its own, and its single line says exactly that rather than inventing
            a benefit.
          items:
            type: string
          example:
            - Everything in Premium
            - Chat with the AI coach about your plan
            - A larger monthly AI credit allowance for AI generation
      required:
        - id
        - name
        - price
        - period
        - features
    SubscriptionResponse:
      type: object
      properties:
        plan:
          type: string
          example: premium_plus
        planName:
          type: string
          example: Premium Plus
        status:
          type: string
          example: ACTIVE
        since:
