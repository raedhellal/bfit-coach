          description: >-
            `COACH_NUTRITION_TEMPLATE_LIMIT_REACHED` at 50, or `COACH_NUTRITION_TEMPLATE_NAME_TAKEN`
            when "(copy)" to "(copy 20)" are all taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/ingredients:
    get:
      summary: Search the ingredients a recipe may use
      description: >-
        EV-256a AC8 / ADR-0026 D26.2. An in-memory filter over the canonical ingredient vocabulary;
        only vocabulary keys can be returned. At most 20 entries whose label contains the trimmed
        `q` (an underscore counts as a space, so a pasted key finds itself), ignoring case: labels
        that START with `q` first, then the rest, each group
        alphabetical. A blank or absent `q` gives the first 20 by label, alphabetically. A search
        with no result answers `[]` and is logged as `coach_recipe_ingredient_search_empty` (the
        demand list for new vocabulary keys). Labels are English, derived from the key.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            default: ""
      responses:
        "200":
          description: Matching ingredients, possibly none
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/CoachIngredientOption"
        "400":
          description: VALIDATION_ERROR, q longer than 100 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/catalog/exercises:
    get:
      summary: The exercise catalog the coach picks from
      description: >-
        EV-184 AC2 — the coach picks, never types; creating, renaming or deleting a catalog entry is
        out of scope entirely.
        **No client id**, deliberately: the catalog is Evoli's, identical for every coach and every
        trainee, and carries no trainee data — so there is no scope to name and nothing a link could
        grant. The check is the same `requireCoachProfile` every coach endpoint makes first.
        `q`, `muscle` and `equipment` treat an EMPTY STRING as absent, not as a filter matching
        nothing: the portal sends all three unconditionally.
        `muscles` and `equipment` are the facet vocabularies, derived from the catalog and returned
        with the page — a hard-coded list in the web tier drifts from the catalog on the next sync,
        and the drift is invisible because the filter simply returns nothing and looks like an empty
        catalog.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Free-text name match. An empty string is absent.
        - name: muscle
          in: query
          required: false
          schema:
            type: string
          description: One value from `muscles`. An empty string is absent.
        - name: equipment
          in: query
          required: false
          schema:
            type: string
          description: One value from `equipment`. An empty string is absent.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of exercises plus the facet vocabularies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCatalogPageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CATALOG_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition:
    get:
      summary: The trainee's live targets, meal week and dietary restrictions
      description: >-
        EV-185 AC1. One read for the whole tab. `targets` and `week` are null for a trainee who has
        neither, and that pair is AC1's "No nutrition set up yet" — never a zeroed card and never a
        `NaN`.
        Reading this page never writes the trainee's target: `targets` is the target the trainee's
        own next read serves (the fresh compute when a profile edit is owed a refresh, BUG-434),
        never written by this read, and a coach looking never creates the trainee's first target.
        For such a computed-but-not-stored AUTO target, `targets.updatedAt` is the time of this
        request.
        `dietProfile` is READ-ONLY. No request on this prefix carries an allergy, a food rule or a
        dislike — the absence of the field IS the mechanism, and the exclusion policy reads
        `nutrition_preferences` inside the engine, which is the only place it has ever read them from.
        `currentWeekStart` is the Monday the SERVER considers current, on the server clock: the
        portal sends no `X-Timezone` (ADR-0011 is mobile-only) and a browser-derived Monday would
        disagree across a zone boundary, making "Apply" fail with COACH_WEEK_OUT_OF_RANGE for
        reasons invisible to the coach.
        `targets.setByYou` is a server-computed BOOLEAN and never a user id (ADR-0015 D6 ruling
        (b)/Q2): a raw `set_by` would be the first user id of another person this surface has ever
        received, and a previous coach's uuid on two trainees would tell this coach those two
        trainees shared a coach.
        Requires the **NUTRITION** scope on the link (ADR-0015 D5).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The trainee's nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNutritionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            NUTRITION — one undifferentiated body for all five, so a 403 tells the caller nothing
            about which of them it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/log:
    get:
      summary: The trainee's food log, per day, against their targets
      description: >-
        EV-284a. One element per day from `from` to `to`, both inclusive, ascending; at most 14 days.
        Both parameters are optional: `to` defaults to the SERVER's UTC today (the portal sends no
        `X-Timezone` and no trainee zone is stored — ADR-0025 D25.6 is pending), and `from` to six
        days before `to`.
        Days are the trainee's stored `food_log.logged_on`, the key their own day read uses, so an
        entry is filed under the same day on both surfaces. Note that the app sends no date when it
        logs food, so `logged_on` is the server's UTC day of the write.
        `totals` is computed by the SAME code as the trainee's `GET /me/nutrition/today` `consumed`
        — food log entries plus planned meals marked eaten — and is NULL on a day where nothing was
        recorded. Render "Nothing logged", never 0 kcal.
        `targets` is the target the trainee's own next read serves (the fresh compute when a profile
        edit is owed a refresh, BUG-434), never written by this read, adjusted for a training or rest
        day exactly as the trainee's own day read adjusts it; null when the trainee has no target
        yet. Reading never creates or writes a target.
        Read-only: a record is erased only by the person who entered it.
        Requires the **NUTRITION** scope on the link. Its consent text already covers "the meals you
        log", so this needs no new scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The trainee's days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachFoodLogResponse"
        "400":
          description: >-
            COACH_FOOD_LOG_RANGE_INVALID — `from` after `to`, or more than 14 days. Refused, never
            clamped. VALIDATION_ERROR — a date that is not YYYY-MM-DD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Same undifferentiated body as `GET /coach-portal/clients/{id}/nutrition`: not a coach, not
            this coach's client, a revoked link, an unknown id, or a link without NUTRITION. The guard
            runs before the range check, so a refused link never learns anything from a 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/targets:
    put:
      summary: Set the trainee's macro targets
      description: >-
        EV-185 AC2. Four numbers and nothing else — no dietary field, no trainee id, no coach id.
        Calories are clamped SERVER-side by the engine's floor (1500 kcal for a male profile, 1200
        otherwise), the same floor the trainee's own app applies, because it lives in one function
        both callers go through. `floorCalories` is the NUMBER it was raised to, non-null exactly
        when the floor moved the value; the sentence lives in the portal's copy file.
        The saved row carries `source = COACH` and the coach's id in `nutrition_targets.set_by`. The
        trainee's own next edit replaces both — a MANUAL or AUTO write is a full-row replace with no
        setter, so the byline stops rendering by construction (AC5).
        **Evoli checks calories against a safe minimum and does NOT check protein or fat.** No such
        bound exists in the engine and this endpoint does not invent one; the portal renders that
        sentence so a coach cannot infer a protection that is not there.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachTargetsRequest"
      responses:
        "200":
          description: The saved targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachTargetsResult"
        "400":
          description: VALIDATION_ERROR — a missing or out-of-range number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/progress-goal:
    put:
      summary: Set the trainee's programme start date, milestone weight and milestone body fat
      description: >-
        EV-202a AC1, extended by EV-274a. **Three values: a start date, a milestone weight and a
        milestone body fat.** Start weight, current weight, start body fat and current body fat are
        DERIVED from the trainee's own `weigh_ins` and `body_measurements` rows — the trainee owns
        their body data and already records it, a coach-typed baseline would be a second writer on
        it, and a derived one cannot go stale against the chart printed below it. No field on this
        request could carry one; the coach never enters a body-fat MEASUREMENT (EV-274 B1).
        For `startedOn` and `milestoneWeightKg`, a **PUT of the whole representation**: an omitted
        value CLEARS that value, which is an explicit write and not a no-op — the row survives with
        a null milestone, `set_by` updated.
        **For `milestoneBodyFatPct` only (EV-274 B4): key ABSENT → UNCHANGED; key present with
        `null` → cleared; a number → set.** A client that predates the field — a portal tab loaded
        before EV-274b — sends only the two old keys and cannot erase a body-fat milestone it never
        displayed. Every accepted PUT still moves `set_by` and `updated_at` to its writer: both
        milestones share one attribution.
        Last write wins. One actor, no trainee writer.
        The response is the SAME block `GET /coach-portal/clients/{id}` embeds, recomputed from the
        trainee's readings, so the portal needs no refetch.
        🔴 **G-GOAL**: both milestones are NARRATIVE numbers. No routine generator, no nutrition
        target calculation, no prompt and no policy reads them. A coach typing 60 kg or 8 % here
        does not move a calorie target by one kilocalorie.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachProgressGoalRequest"
      responses:
        "200":
          description: The saved goal and the derived block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProgressGoal"
        "400":
          description: >-
            COACH_MILESTONE_OUT_OF_RANGE — the milestone weight is outside 25..300 kg, or the
            milestone body fat is outside 3.0-60.0 % or has more than one decimal (the message names
            `milestoneBodyFatPct` and `3.0-60.0`). NOTHING is written, including the other values
            that arrived in the same body, and the value is never clamped or rounded.
            Or VALIDATION_ERROR for a weight that does not fit NUMERIC(5,2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            Not a coach, not this coach's client, revoked, no such id, or the link does not carry
            WEIGH_INS — one undifferentiated body for all five. A revoke takes effect on the very
            next request; the guard caches nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/apply:
    post:
      summary: Apply a meal week to the trainee, immediately
      description: >-
        EV-185 AC3. There is NO draft in slice 1 — a nutrition draft is a fork of a five-table
        aggregate (EV-092) — so the trainee sees this straight away and the portal's confirm dialog
        says so in those words.
        Idempotent in row count and not in content: a second apply REPLACES the week rather than
        duplicating it, and meals the trainee LOCKED are carried forward, which is what the `locked`
        flag on each meal exists to show.
        Current week only. Any other `weekStart` is 400 COACH_WEEK_OUT_OF_RANGE, decided on the
        SERVER clock — read `currentWeekStart` from GET …/nutrition rather than computing a Monday
        in the browser.
        Capped at **one apply per link per day** (429 COACH_WEEK_APPLY_RATE_LIMIT): a week is one
        model call per day plus an image call per meal, and slice 1 charges NOBODY — not the coach
        (EV-091 and ⛔ D9 are unbuilt) and not the trainee, whose GENERATE credit the /me path
        spends and this one does not.
        The trainee's stored allergies, HALAL/KOSHER rules and dislikes decide the meals. This
        request carries none of them and there is no field that could.
        EV-320a — **the coach's recipes first, the engine as the base, AI as the last resort.**
        With BOTH `bfit.coach.recipes.placement.enabled` and `bfit.nutrition.recipe-fill.enabled`
        on (both default off), the deterministic engine builds the week, and each engine meal is
        replaced by one of the calling coach's recipes when the recipe's `mealSlots` hold the
        meal's slot (untagged = LUNCH and DINNER), its kcal is within 20% of the engine meal's,
        the day stays within 10% of its kcal target, above 80% of its protein target and above
        the calorie floor, and the recipe passes the same checks as placing it by hand (a typed
        allergy or KOSHER refuses every recipe). Recipes are checked by their declared ingredient keys; the recipe name is matched only against English terms. A recipe is used at most once a day and three
        times a week. Filled meals read `provenance: COACH_RECIPE` with `placedByYou: true`; the
        portal counts them for "N of M meals from your recipes". No model is called and nothing
        is charged, unless the trainee's rules leave the engine no floor, in which case the week
        is generated by the model exactly as before. With either flag off, nothing changes.
        EV-190a / N1: the OPTIONAL `mealStructure` (meals per day 1-6 + snacks) applies to THIS
        WEEK ONLY. It is recorded on `weekly_meal_plan`, read again by the day regeneration below
        so a regenerated day matches the week it belongs to, and CLEARED when the trainee
        regenerates their own week. It is never written to the trainee's `nutrition_preferences` or
        profile — for any field — which is asserted by a test over this write path and by a
        full-row before/after comparison of the trainee's stored preferences, not by review.
        Out of range is 400 COACH_MEAL_STRUCTURE_OUT_OF_RANGE naming the bound, with NOTHING
        generated and nothing written: a silently clamped value would leave the coach believing
        they had set something they did not.
        EV-190 AC7 — **a key this request body does not declare is REFUSED, not ignored**:
        400 COACH_FIELD_NOT_ACCEPTED naming the key, with nothing generated and nothing written.
        The keys this catches are the ones that matter — `allergies`, `foodRules`,
        `dietaryPattern`, `injuries`, `gender`, `weightKg`, `traineeId` — and the honest answer to
        all of them is "this endpoint does not accept that", not a 200 that looks like it worked.
        ⚠️ **This changed on 2026-09-17.** Before EV-190a the extra keys were silently dropped and
        this endpoint answered 200, because Spring Boot disables FAIL_ON_UNKNOWN_PROPERTIES
        globally. The refusal is implemented on THIS request type (and its nested `mealStructure`)
        rather than as a global setting, so no /me route and no mobile client changes with it —
        which also means the other coach nutrition writes (`PUT …/nutrition/targets`,
        `POST …/swap`) still IGNORE unknown keys. That asymmetry is known, is EV-185a's shipped
        behaviour, and was deliberately not widened by this story.
        Returns a FINISHED week: unlike the trainee's own generation, which streams days in on a
        pool, the coach's apply completes before it answers — a skeleton week makes AC1's
        phone-next-to-browser comparison unreadable. With AI enabled that makes this a slow request.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachApplyWeekRequest"
      responses:
        "200":
          description: The applied week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: >-
            COACH_WEEK_OUT_OF_RANGE — slice 1 serves the current week only; or
            COACH_MEAL_STRUCTURE_OUT_OF_RANGE — `mealStructure.mealsPerDay` outside 1-6, refused
            at the control with nothing generated and never clamped; or COACH_FIELD_NOT_ACCEPTED —
            the body carried a key this request does not declare, named in the message, with
            nothing generated and nothing written; or VALIDATION_ERROR when `mealStructure`
            carries only one of its two fields (they are one fact)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the CLIENT's allergies and food rules rule out every
            recipe the server can check. Nothing was written: a coach's refusal is a non-event for
            that week (AC5), so the trainee's existing week is untouched and no REFUSED row is
            created — that persistence is the trainee's own path only.


            This operation answered **500** before EV-071a. The portal decides what to show from
            this **code**; the `message` is developer-facing and is not copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: COACH_WEEK_APPLY_RATE_LIMIT — this link has already had a week applied today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/days/{index}/regenerate:
    post:
      summary: Regenerate one day of the trainee's current week
      description: >-
        EV-185 AC3. `index` is 0-6 from the week start; `planned_day` ids are not served on this
        prefix, so there is none for the portal to hold or for anyone to guess.
        Free, but the daily cap lives on the TRAINEE's plan row, so this spends the trainee's
        allowance and can be refused by regenerations the coach never made — 429
        COACH_DAY_REGEN_LIMIT, a code distinct from the trainee's own DAY_REGEN_LIMIT precisely so
        the coach is never shown a sentence about regenerations they did not perform. The portal
        discloses the sharing ("Day regenerations share {trainee}'s daily limit"); EV-091 is the fix.
        The week's attribution is carried forward UNCHANGED: a day regeneration is not a whole-week
        write, so a coach regenerating one day of the trainee's own week does not make that week the
        coach's, and a trainee regenerating one day of the coach's week does not unmake it.
        EV-190a: the week's MEAL STRUCTURE is carried forward by the same rule and for the same
        reason. The rebuilt day is generated against the structure THE WEEK was applied with — read
        from the week, never from the trainee's profile — so the day a coach regenerates matches
        the week they applied.
        BUG-287: only what the regenerate writes is checked against the trainee's food rules. Meals
        on the other days that the trainee's CURRENT rules exclude (they changed their preferences
        after the week was made) no longer block it; a meal the trainee locked on this day that
        their rules now exclude loses its lock and is replaced. A refusal of the rebuilt day itself
        is the 422 below, and the day stays as it was.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
      responses:
        "200":
          description: The week, with that day regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND — no current week, or no such day index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (EV-071) — the CLIENT's allergies and food rules rule out every
            recipe the server can check. Nothing was written: a coach's refusal is a non-event for
            that week (AC5), so the trainee's existing week is untouched and no REFUSED row is
            created — that persistence is the trainee's own path only.


            BUG-287: the same code also answers when the rebuilt day is refused at the WRITE — the
            trainee changed their food rules while this day was being generated, so a meal it
            produced is excluded by the rules in force when it is saved. Nothing was written either:
            the day stays as it was, and only this day is checked, never the other six.


            This operation answered **500** before EV-071a. The portal decides what to show from
            this **code**; the `message` is developer-facing and is not copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: COACH_DAY_REGEN_LIMIT — the trainee's daily allowance is spent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/meals/{mealId}/swap:
    get:
      summary: Cached swap candidates for one meal
      description: >-
        EV-185 AC3. The CACHED reader, never the refreshing one: `refreshSwapOptions` charges the
        TRAINEE a CHAT credit and is the one path a caller could otherwise spam into unbounded model
        calls, so it has no mapping on this prefix at all.
        The candidates respect the trainee's stored exclusions for the same reason the week does —
        the engine reads `nutrition_preferences`, and nothing in this request could override them.
        A meal id belonging to somebody else answers 404: ownership is resolved through the
        trainee's id, so a guessed id buys nothing.
        A change to the trainee's food preferences clears every list cached for them (BUG-286), so
        the next read generates under the rules in force; the list served is always the list cached.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachSwapOptions"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND — no such meal for this trainee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            **NO_SAFE_MEAL_PLAN** (BUG-360) — nothing is cached for this meal and no candidate is safe
            under the trainee's allergies and food rules, so there is no list to show. The same
            code, and the same fixed `message`, as the week and the day regeneration; the portal
            decides from the code. This read answered 500 before BUG-360.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Swap one meal for a cached candidate
      description: >-
        EV-185 AC3. Day-level, so the week's attribution is carried forward unchanged. The new meal
        is the engine's (provenance ENGINE). A coach's swap does NOT lock the meal, because a lock
        means the trainee chose the meal (BUG-245 ruling Q2). So the coach's next apply or
        regenerate replaces a meal the coach swapped, like any other unlocked meal. What the trainee
        owns is refused and nothing is written (BUG-245): a meal they marked eaten answers 409
        COACH_MEAL_EATEN (only the trainee may erase their own "I ate this"), and a meal they
        locked answers 409 COACH_MEAL_LOCKED, the same rule as placement, apply and regenerate.
        Eaten is checked first. Both checks run under the plan lock against the meal as it is now,
        so a mark or a lock made after the portal loaded the week is seen too.
        A cached candidate that the trainee's food rules now exclude (the rules changed after the
        list was cached) is never written: it answers 409 SWAP_OPTIONS_STALE and clears the list,
        so read GET …/swap again and pick from the new one (BUG-286).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachApplySwapRequest"
      responses:
        "200":
          description: The week, with that meal swapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: >-
            VALIDATION_ERROR — candidateIndex outside 0..20; INVALID_REQUEST — no candidate at
            that index in the cached list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: See GET /coach-portal/clients/{id}/nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NUTRITION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            COACH_MEAL_EATEN — the trainee has marked this meal eaten; COACH_MEAL_LOCKED — the
            trainee locked this meal; SWAP_OPTIONS_STALE — no candidates are cached for this meal
            (BUG-271: every apply clears them, and an apply never generates), so read GET …/swap
            again and pick from that list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/clients/{id}/nutrition/week/meals/{mealId}/recipe:
    post:
      summary: Put one of the coach's recipes on one meal of the trainee's week
      description: >-
        EV-256c (ADR-0026 D26.4, D26.5). The meal keeps its id, slot, position and day; its content
        becomes a COPY of the recipe (editing or deleting the recipe later changes nothing already
        placed), with provenance COACH_RECIPE, no image, unlocked and uneaten. Every other meal in
        the week is untouched. Checked under the plan lock against the meal as it is now, in this
        order: an eaten or trainee-locked meal is refused; a trainee with any typed allergy, or the
        KOSHER rule, is refused (the system cannot check either against a recipe yet); a key
        retired from the vocabulary since the recipe was saved is refused; every ingredient and the
        recipe's NAME go through the trainee's exclusions exactly as a generated meal's do (the
        steps are not checked); a placement that would take the day under the calorie floor (1500
        kcal for a male profile, 1200 otherwise) AND lower it is refused. No model call, no credit,
        no regeneration spent. REGISTERED ONLY while bfit.coach.recipes.placement.enabled is true;
        otherwise this path is a 404 NOT_FOUND like any unmapped one, and GET
        /coach-portal/clients/{id}/nutrition carries recipePlacementEnabled false.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachPlaceRecipeRequest"
      responses:
        "200":
          description: The week, with the recipe on that meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMealWeek"
        "400":
          description: >-
            VALIDATION_ERROR (no recipeId); COACH_RECIPE_BELOW_FLOOR, details {floorKcal,
            dayKcalBefore, dayKcalAfter}; COACH_RECIPE_UNKNOWN_INGREDIENT, details {key, field},
            when the recipe holds a key retired since it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            COACH_ACCESS_DENIED. See GET /coach-portal/clients/{id}/nutrition for the link; or a
            recipe that is another coach's, deleted, or never existed (one body for all three)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            NUTRITION_NOT_FOUND: no such meal for this trainee (including another trainee's meal,
            and one a regeneration replaced since the portal loaded). NOT_FOUND: placement is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: COACH_MEAL_EATEN; COACH_MEAL_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            COACH_RECIPE_EXCLUDED, details {field: ingredient, value: <label>} or exactly {field:
            name}, never a rule or category; COACH_RECIPE_ALLERGIES_UNCHECKABLE, no details;
            COACH_RECIPE_RULE_UNCHECKABLE, details {rule: KOSHER}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach:
    get:
      summary: The trainee's current coach, or null
      description: >-
        Renders EV-183 AC6's "Coached by `<name>` · since `<date>`" line in Settings. The body is a
        literal JSON `null` when there is no coach — not an absent body, because both clients call
        `res.json()` on it. Singular because `uq_coach_clients_active_trainee` makes it singular in
        the database, not because the response type happens to be one object.
        `/me/my-coach`, not `/me/coach`: `/me/coach/**` is the **AI** coach.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The coach, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MyCoachResponse"
                nullable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach/accept:
    post:
      summary: Accept a coach invite
      description: >-
        EV-183 AC3. One transaction: consume the invite (a conditional UPDATE requiring exactly one
        affected row, never a read-then-write), lock the coach's profile row, check capacity and
        self-link, append the `COACH_ACCESS` consent row through the BUG-023 mechanism — not a
        second one — and insert the link. Any refusal after the invite is consumed rolls the whole
        thing back, so a failed accept does not burn the invite.
        The request carries **no scopes**: the server owns the set (all four), exactly as it owns
        the policy version. A client-supplied scope list would be a client narrowing what it says it
        consented to while receiving the full grant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCoachInviteRequest"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCoachResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            `COACH_INVITE_INVALID` | `COACH_INVITE_USED` | `COACH_INVITE_EXPIRED` |
            `COACH_SELF_LINK` | `COACH_CAPACITY_REACHED`. The first three are one status and one
            shape on purpose, so a token holder cannot probe which invites exist. An invite whose coach
            no longer holds COACH (revoked, EV-205a) is COACH_INVITE_INVALID, and is not used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `COACH_ALREADY_LINKED` — this account already has a coach; or `CONSENT_VERSION_STALE` —
            the consent screen displayed a privacy policy version that is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/my-coach/revoke:
    post:
      summary: End the coaching link from the trainee's side
      description: >-
        EV-183 AC6's closing beat. On the coach's very next request — a plain reload, no logout, no
        wait — the trainee is gone from the roster and the previously working overview URL answers
        403. There is no authorization cache anywhere on that path, which is what makes "instant"
        true rather than "usually".
        Idempotent: a trainee with no coach has nothing to revoke and gets the same 204, which is
        also the honest answer to a double tap on a flaky connection.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: There is now no ACTIVE link
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/progress-goal:
    get:
      summary: The milestones (weight and body fat) the trainee's coach set for them
      description: >-
        EV-202e AC12–AC15. **The trainee's own read of a number written about their body by someone
        else.** EV-202a shipped the progress goal on the coach-portal surface only; this is the only
        channel by which its subject can see it (`EV-041` is `DELETE /me/account`, i.e. erasure, not
        access), which is what makes that write defensible under the consent posture EV-197 and
        EV-202c established.
        **It addresses nothing.** No path parameter and no query parameter of any kind: the subject
        is the caller, resolved from the authentication, so there is no id to pass and none to
        tamper with.
        **A deliberate SUBSET of the coach's block, and the list is closed** — five fields, no more
        and no fewer (EV-274a AC6 added `milestoneBodyFatPct` to EV-202e's four). `startedOn`,
        `startedOnSource`, the four derived readings, both deltas and above all `weightToGoKg` and
        `bodyFatToGoPts` are absent by design: "to go" is a SIGNED number (a trainee bulking
        toward a higher milestone and one cutting toward a lower one both have one, and neither is a
        failure), and it is what a progress bar, a percentage and an ETA are made of.
        🔴 **G-GOAL**: the milestone is a NARRATIVE number. No routine generator, no nutrition target
        calculation, no prompt and no policy reads it, and no client renders it as a number the app
        is working toward.
        **Absence is a 200 with null milestones — never a 404 and never a 403** — and it is ONE
        answer for FOUR different facts: no coach at all, a link with no goal row, a link whose
        `WEIGH_INS` scope is missing, and a coach who cleared both milestones. A row with only a
        body-fat milestone is NOT absence: it answers `milestoneWeightKg: null` with the body fat.
        A status code that varied with whether a coach exists, or with which scopes a link
        carries, would be a disclosure oracle on the trainee's own prefix.
        ⚠ `WEIGH_INS` deliberately does NOT gate this read. That scope governs what the COACH may
        see of the trainee's data; it is not a lock on the subject's own record, and a trainee who
        has revoked entirely still reads the row (edge case 12) with the attribution naming the
        coach who set it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The trainee's milestone, or the same body with a null milestone when there is nothing
            to show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeMilestone"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /coach-portal/challenges:
    get:
      summary: The coach's challenges, paged (EV-321a)
      description: >-
        The authenticated coach's own challenges, newest window first (`endsOn` descending, then
        `createdAt` descending, then id). A second coach sees an empty list, never this one's.
        `phase` and the counts are computed at read time on the server's UTC date. The counts
        include only participants whose coach link is still ACTIVE: a trainee whose link was
        revoked disappears from every coach read of every challenge.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of the coach's challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachChallengePageResponse"
        "400":
          description: "`VALIDATION_ERROR` for a page below 0 or a size outside 1-50"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a coach, or no coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a challenge and invite trainees to it (EV-321a AC1-AC3, AC11)
      description: >-
        Creates the challenge and one INVITED participation per `clientIds` entry, in one
        transaction. Before a trainee accepts, the coach sees `INVITED` and nothing else: no
        number. Accepting is the trainee's consent to share this challenge's progress with this
        coach (`POST /me/challenges/{id}/accept`).
        `STEPS` takes a `dailyTarget` (1000-50000) and no `totalTarget`. `WORKOUTS` takes a
        `totalTarget` (1-100 completed sessions in the window) and no `dailyTarget`, and every
        participant's link must carry the `WORKOUTS` scope, because the count reads the trainee's
        session history. `startsOn` may be at most 14 days before and at most 60 days after the
        server's UTC date; `endsOn - startsOn` is 0 to 92 days. A duplicate client id counts once.
        At most 20 of this coach's challenges may have `endsOn` on or after the server's UTC date.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChallengeCreateRequest"
      responses:
        "201":
          description: >-
            Created. The same body `GET /coach-portal/challenges/{id}` returns, with every
            participant `INVITED` and `progress: null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachChallengeDetailResponse"
        "400":
          description: >-
            `VALIDATION_ERROR` naming the field at the start of `message` (and in
            `details.field` for the rules the request type cannot state): a title that is empty,
            over 80 characters after trimming, or holds a control character or line break; a
            missing or unknown `metric`; a STEPS `dailyTarget` outside 1000-50000 or missing; a
            WORKOUTS `totalTarget` outside 1-100 or missing; the other metric's target present;
            `endsOn` before `startsOn`; a window longer than 92 days; `startsOn` more than 14 days
            before or more than 60 days after the server's UTC date; 0 or more than 50 client ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            `COACH_ACCESS_DENIED`: not a coach, no coach profile, or ANY client id that is not an
            ACTIVE link of this coach (another coach's client, a revoked link, an id that does not
            exist) or, for WORKOUTS, a link without the `WORKOUTS` scope. One undifferentiated body
            for all of them, and nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "`COACH_CHALLENGE_LIMIT_REACHED`: 20 challenges of this coach have not ended"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /coach-portal/challenges/{id}:
    get:
      summary: One challenge with its participants' progress, ranked (EV-321a AC7, AC8)
      description: >-
        Progress is computed at read time, never stored. Only participants whose link to this
        coach is ACTIVE are listed (for WORKOUTS, whose link still carries `WORKOUTS`); a revoked
        link hides the trainee here at once, with no cache. A participant who declined or left is
        gone: the participation is deleted.
        ACCEPTED participants come first, in `rank` order (STEPS: `daysMet` descending then
        `total` descending; WORKOUTS: `total` descending; equal keys share a rank, then by name).
        INVITED participants follow by name, with `rank: null` and `progress: null`.
        Each participant's "today" is THEIR local day: the zone their app last declared on an
        accept or a steps sync. With no declared zone it is the day that has not yet ended
        anywhere (UTC-12), so a day is never shown as missed early.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The challenge and its visible participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachChallengeDetailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            `COACH_ACCESS_DENIED`. One undifferentiated body for another coach's challenge, an id
            that never existed and a challenge deleted in another tab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Delete a challenge, and the steps shared only for it (EV-321a AC9, BUG-458)
      description: >-
        Deletes the challenge and every participation, in one transaction. It disappears from
        each trainee's `GET /me/challenges`. For a STEPS challenge it also deletes, for every
        participant who had ACCEPTED it, their stored step rows (every source) for the days of
        this challenge's window that are NOT inside the window of another STEPS challenge that
        participant has still accepted: the same rule as `POST /me/challenges/{id}/leave`. A day
        that still serves another accepted challenge is kept; steps outside this window, steps of
        a participant who was only INVITED, and every row of a WORKOUTS challenge's participants
        are untouched. After it, the id answers the same 403 as a foreign or random id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            `COACH_ACCESS_DENIED`. One undifferentiated body for another coach's challenge, an id
            that never existed and a challenge already deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/challenges:
    get:
      summary: The trainee's current challenges, invitations included (EV-321a AC4)
      description: >-
        Every challenge the caller is a participant of whose `endsOn` is no more than 3 days
        before the caller's local today (so an ended challenge stays visible for 3 days), soonest
        `endsOn` first, then title, then id. INVITED rows carry the coach's professional name, the
        target and the window, and `progress: null`. A declined or left challenge is not listed
        (the participation is deleted), and neither is one the coach deleted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimeZoneHeader"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of the caller's challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallengePageResponse"
        "400":
          description: "`VALIDATION_ERROR` for a page below 0 or a size outside 1-50"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/challenges/{id}:
    get:
      summary: One of the trainee's challenges, with their own progress
      description: >-
        The caller's own view. `progress` is null while INVITED. "Today" is the caller's local
        day from `X-Timezone`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimeZoneHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallengeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            `CHALLENGE_NOT_FOUND`: the caller is not a participant, or the id does not exist. One
            answer for both.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/challenges/{id}/accept:
    post:
      summary: Accept a challenge, which is the consent to share its progress with the coach
      description: >-
        **Accepting is the per-challenge consent.** For a STEPS challenge the caller shares their
        daily step count with the coach, for the challenge's window only; for WORKOUTS, their
        completed-session count in the window. The server records `acceptedAt` and the
        `consentVersion` the app rendered, and from then on accepts steps for days inside this
        window. The app's button names the share ("Accepter et partager mes pas").
        Idempotent: accepting an ACCEPTED participation answers 200 and keeps the first
        `acceptedAt` and version. The request's `X-Timezone` is remembered on the participation
        (an exact IANA id only) so the coach's "today" is the trainee's.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimeZoneHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeAcceptRequest"
      responses:
        "200":
          description: The challenge, now ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallengeResponse"
        "400":
          description: "`VALIDATION_ERROR` naming `consentVersion` when it is missing or not a known version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "`CHALLENGE_NOT_FOUND`: not a participant, or no such challenge"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `CHALLENGE_ENDED`: the window ended before the caller's local today, so there is
            nothing left to share. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/challenges/{id}/decline:
    post:
      summary: Decline an invitation
      description: >-
        Deletes the INVITED participation; the coach no longer lists the trainee. Only an
        invitation can be declined: an ACCEPTED participation is left with `/leave`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Declined; the participation is gone
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "`CHALLENGE_NOT_FOUND`: not a participant, or no such challenge"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "`CHALLENGE_ALREADY_ACCEPTED`: use `/leave`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/challenges/{id}/leave:
    post:
      summary: Leave a challenge (invited or accepted), deleting what was shared for it
      description: >-
        Deletes the participation, in any state, and the coach sees nothing of the trainee in
        this challenge from then on. It also deletes the caller's stored step rows (every source)
        for the days of this challenge's window that are NOT inside the window of another STEPS
        challenge the caller has still accepted: a day that still serves another accepted
        challenge is kept, because that challenge's consent still covers it; every other day in
        this window is deleted. Steps outside this window are untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Left; the participation and the steps stored only for it are gone
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "`CHALLENGE_NOT_FOUND`: not a participant, or no such challenge"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/activity/steps:
    put:
      summary: Submit daily step totals (EV-321a AC5, AC6)
      description: >-
        An idempotent upsert per (caller, day, source): sending the same entry twice stores one
        row, and a new value for the same day and source replaces the old one. One row is kept per
        source; a day's value is the highest-precedence source present: the device health store
        (HEALTHKIT or HEALTH_CONNECT, one tier), then PEDOMETER, then MANUAL. It is never a sum and
        never a max.
        **The batch is all or nothing.** Every entry's day must be inside the window of a STEPS
        challenge the caller has ACCEPTED (otherwise `409 STEPS_OUTSIDE_JOINED_CHALLENGE`), no
        more than 30 days before the caller's local today, and not after it. MANUAL is refused for
        a day that already holds a HEALTHKIT, HEALTH_CONNECT or PEDOMETER row
        (`409 STEPS_SOURCE_PRECEDENCE`);
        a device source is always stored, and a MANUAL row it outranks is kept but not counted.
        Past days inside an accepted window are accepted from any source, which is how a window
        that started before the trainee joined is back-filled. A day with no data must be OMITTED,
        never sent as 0: `steps: 0` is stored as a real zero.
        The request's `X-Timezone` decides the caller's local today (absent or unresolvable: the
        server's UTC today + 1 day, as on the completion routes) and, when it is an exact IANA id,
        is remembered on the caller's accepted participations for the coach's "today".
        Rate-limited per account: 60 requests an hour.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimeZoneHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepsSyncRequest"
      responses:
        "200":
          description: Stored. The effective value of every day the batch touched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepsSyncResponse"
        "400":
          description: >-
            `VALIDATION_ERROR` naming the field (and `details.field` for the rules the request type
            cannot state): 0 or more than 31 entries; a missing day, steps or source; an unknown
            source; steps below 0 or above 100000; the same day and source twice in one batch; a
            day after the caller's local today or more than 30 days before it. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            `STEPS_OUTSIDE_JOINED_CHALLENGE` (with `details.day`): a day inside no accepted STEPS
            challenge's window, including any day while the caller is only INVITED.
            `STEPS_SOURCE_PRECEDENCE` (with `details.day` and `details.source`, the device source
            already stored): a MANUAL entry for a day that already holds a device value.
            Nothing in the batch is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "`STEPS_RATE_LIMITED`, with a `Retry-After` header in seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    TimeZoneHeader:
      name: X-Timezone
      in: header
      required: false
      description: >-
        IANA time zone of the caller's device (BUG-134). The endpoint resolves "today" in this
        zone. Absent or blank falls back to UTC, which is the pre-BUG-134 behaviour, so older
        clients keep working. A present-but-unresolvable value ALSO falls back to UTC and is
        logged and counted server-side (`bfit.request_timezone.rejected`) rather than rejected:
        the client's zone catalog and the server's tzdata are independently versioned, so a hard
        400 would turn catalog skew into a dead surface fixable only by an app-store release.
        See ADR-0011.
      schema:
        type: string
        example: Europe/Paris
    CompletionTimeZoneHeader:
      name: X-Timezone
      in: header
      required: false
      description: >-
        IANA time zone of the caller's device. On the completion routes it does two things.
        (1) With no `date` in the body it FILES the session (EV-250 / ADR-0025): under the day the
        session started in this zone (completion time minus `durationSeconds`), never more than one
        day before the day it ended; this is the zone `GET /me/today-workout` uses to choose the
        workout, so the two agree. Absent, blank or unresolvable: UTC. (2) It BOUNDS the day
        (EV-248 / BUG-225): the filed day, and for a client-sent `date` also the day the session is
        recorded as ending (`date` 00:00 UTC + `durationSeconds`, for a date other than the
        server's today). Present and resolvable: a day after the caller's local today is rejected
        with 400 `COMPLETION_DATE_IN_FUTURE`. Absent, blank or unresolvable: a day after the
        server's (UTC) today + 1 day is rejected — NOT the strict UTC today the other routes fall
        back to, because no zone is more than 14 hours ahead of UTC and a strict UTC bound would
        refuse genuine sessions logged after local midnight east of UTC. A dateless completion is
        never refused by this bound.
      schema:
        type: string
        example: Europe/Paris
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CoachProfileResponse:
      type: object
      description: The signed-in coach's profile and capacity (EV-183 AC1).
      properties:
        coachId:
          type: string
          format: uuid
          description: The coach's user id — the same account as their Evoli Fit login.
        displayName:
          type: string
          description: What the trainee is shown on the consent screen and in Settings.
          example: Coach User
        tier:
          type: string
          enum: [STARTER]
          description: >-
            Capacity tier. Names a capacity, renders no price and links to no checkout (⛔ D8
            untouched). Becomes a real entitlement at MVE-6.
        active:
          type: integer
          description: ACTIVE links held by this coach right now.
        capacity:
          type: integer
          description: How many ACTIVE links the tier allows. A constant in code, keyed off the column.
          example: 10
      required: [coachId, displayName, tier, active, capacity]
    CoachClientSummaryResponse:
      type: object
      description: >-
        One roster row (EV-183 AC4). No trainee user id is exposed: everything the coach can address
        is addressed by `id`, the coach_clients row id.
      properties:
        id:
          type: string
          format: uuid
          description: The coach_clients row id — the only id the coach portal addresses.
        traineeDisplayName:
          type: string
        currentPlanName:
          type: string
          nullable: true
          description: >-
            The plan the trainee's own app is currently on, resolved through `user_plan` (the source
            Today and the session paths use), so the roster and the phone agree. Null if they have
            no plan, AND null when this link does not carry the WORKOUTS scope (ADR-0015 S1 — the
            roster filters per item, not per coach). The roster is a list and does not distinguish
            the two: open the client and read `TraineeOverviewResponse.scopes`.
        lastCompletedWorkoutDate:
          type: string
          format: date
          nullable: true
          description: >-
            UTC date of the last completed workout; null if there has never been one, and null when
            this link does not carry the PROGRESS scope. PROGRESS, not WORKOUTS: on the roster this
            is a bare date used as an ACTIVITY signal, which is what a "needs attention" ordering
            reads. (The overview's `lastSession` names the workout and carries the difficulty
            feedback, and is WORKOUTS.) A client that sorts on this field must treat
            null-as-not-shared as unknown and sort it LAST, not first.
        currentStreakDays:
          type: integer
          nullable: true
          description: >-
            The trainee's current streak in days. NULL when this link does not carry the PROGRESS
            scope — 0 is a real streak of zero and must not be rendered for data the trainee did not
            share.
        redFlagCount:
          type: integer
          nullable: true
          description: >-
            EV-187a AC2 — how many red flags fired for this trainee, from the SAME evaluation the
            trainee's own page runs, so the roster badge and the flags on the page cannot disagree
            (QA compares them for every seeded trainee).
            **NULL means "not shared"**: the link carries neither WORKOUTS nor WEIGH_INS, so no rule
            could be evaluated at all. Such a row renders "Not shared" and sorts LAST under
            `needs_attention`. It is never 0 in that case. 0 is a real "no flags" and renders no
            badge at all — not "0 flags".
        status:
          type: string
          enum: [ACTIVE]
          description: Always ACTIVE on this endpoint; REVOKED rows are history and are not listed.
        since:
          type: string
          format: date-time
          description: When the trainee accepted — AC6's "since `<date>`".
        scopes:
          type: array
          description: >-
            The scopes this link carries, verbatim from `coach_clients.scopes` (ADR-0015 B1.1). Read
            the nullable fields above THROUGH this: `currentPlanName` null WITH `WORKOUTS` present is
            "no plan yet"; null WITHOUT it is "not shared". Rendering the first sentence for the
            second case is a statement about a person the coach would act on.
            Never inferred from a 403 — every coach-portal denial answers the same undifferentiated
            body.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
        routineChangedSinceYourPublish:
          type: boolean
          nullable: true
          description: >-
            EV-283a — the roster's "Plan changed" marker: true when the trainee's own plan became
            their live plan at or after THIS coach's latest publish to them. Computed by the same
            rule as `CoachRoutineResponse.changedSinceYourPublish`, so the marker and the routine
            page cannot disagree. False when the coach's plan is live, when this coach never
            published to them, and when the author was never recorded (nothing is inferred). Edits
            made from a workout session (add, remove or reorder an exercise) are not recorded. NULL
            when this link does not carry WORKOUTS — "not shared", like `currentPlanName`.
      required: [id, traineeDisplayName, status, since, scopes]
    CoachClientPageResponse:
      type: object
      description: >-
        A page of roster rows. The roster is small today (STARTER allows 10) but every collection
        endpoint paginates without exception — the tier ladder already contemplates 100 profiles.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoachClientSummaryResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
      required: [items, page, size, totalElements, totalPages]
    CoachInviteResponse:
      type: object
      description: >-
        A freshly created invite. `token` is shown ONCE, in this response, and is stored nowhere —
        only its SHA-256 digest reaches the database. It is a credential in a URL: do not log it.
      properties:
        inviteId:
          type: string
          format: uuid
          description: Safe to log; the token is not.
        token:
          type: string
          description: The raw single-use token (43 URL-safe characters).
        expiresAt:
          type: string
          format: date-time
          description: 7 days from creation.
      required: [inviteId, token, expiresAt]
    TraineeAdherence:
      type: object
      description: >-
        "`done` / `planned` sessions" for the current week. Week boundaries are Monday..Sunday in
        **UTC**: the coach's browser sends no X-Timezone and no trainee zone is stored, so this can
        disagree with the trainee's phone across a midnight (ADR-0012 risk (c), story edge case 11).
        `planned` is 0 for a trainee with no plan — nothing scheduled cannot have been missed.
      properties:
        done:
          type: integer
        planned:
          type: integer
      required: [done, planned]
    TraineeLastSession:
      type: object
      description: The trainee's most recent completed session (AC5 block 3).
      properties:
        date:
          type: string
          format: date
          description: UTC date of completion.
        name:
          type: string
          nullable: true
          description: The workout's title; null if the workout row has since gone.
        difficulty:
          type: string
          nullable: true
          enum: [EASY, OK, HARD]
          description: The feedback the trainee gave. Null renders "No feedback given".
      required: [date]
    TraineeWeightPoint:
      type: object
      description: One weigh-in, from the `weigh_ins` table the trainee's own app writes.
      properties:
        date:
          type: string
          format: date
        weightKg:
          type: number
      required: [date, weightKg]
    TraineeProgressResponse:
      type: object
      description: >-
        EV-187a AC3/AC4/AC5. The monitoring page, in three blocks and no fourth horizon: there is no
        date-range picker and `weeks` is a server constant, so a client cannot ask for another
        window.
      properties:
        clientId:
          type: string
          format: uuid
        weeks:
          type: integer
          example: 8
          description: How many ISO weeks the series covers. A server constant.
        adherence:
          allOf:
            - $ref: "#/components/schemas/TraineeAdherenceSeries"
          nullable: true
          description: >-
            NULL when the link does not carry WORKOUTS — the same blanking as the overview's
            `adherenceThisWeek`, so the two pages cannot disagree. Render "not shared" from
            `scopes`.
        sessions:
          allOf:
            - $ref: "#/components/schemas/TraineeSessionHistory"
          nullable: true
          description: >-
            NULL when the link does not carry WORKOUTS: session names and the trainee's difficulty
            feedback are workout CONTENT, the same disclosure as the overview's `lastSession`.
        redFlags:
          type: array
          nullable: true
          description: >-
            The fired flags WITH their evidence — identical, flag for flag, to the overview's
            `redFlags`, because it is one evaluation projected twice. NULL when the link carries
            neither WORKOUTS nor WEIGH_INS (no rule could be evaluated); EMPTY is "No red flags".
            A flag is never returned with an empty evidence block, and evidence is never returned
            for a flag that did not fire.
          items:
            $ref: "#/components/schemas/TraineeFiredRedFlag"
        scopes:
          type: array
          description: The scopes this link carries, verbatim from `coach_clients.scopes`.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
      required: [clientId, weeks, scopes]
    TraineeAdherenceSeries:
      type: object
      description: >-
        AC3's series and its headline. `done` and `planned` are the sums of `weeks[]` — the headline
        "`<done>` of `<planned>` planned sessions in the last 8 weeks" is a sum the coach can check
        by hand, and a test checks it too.
      properties:
        done:
          type: integer
        planned:
          type: integer
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/TraineeWeekAdherence"
      required: [done, planned, weeks]
    TraineeWeekAdherence:
      type: object
      description: >-
        One ISO week, oldest first.
        **`planned` vs `plannedSoFar`** is AC3's two clauses that cannot both be one number: it asks
        for the current week to count only days strictly before today AND for the current week to be
        identical to the shipped "adherence this week" block, which on a Monday are 0/0 and 0/3. Both
        facts are on the wire and neither is invented — `planned` is the shipped block byte for byte,
        `plannedSoFar` is the elapsed-days number that does not render a Monday as a 0 % week
        (ADR-0012 D6). They differ only when `partial` is true.
      properties:
        weekCommencing:
          type: string
          format: date
          description: The Monday of the week — AC3's week-commencing label.
        done:
          type: integer
          description: >-
            Sessions completed in the week, as PLANNED work: 0 whenever `hasPlan` is false, because
            a week nothing was scheduled in contains no planned work to have done. A session
            completed in such a week is still in the session history and in the streak; it is not
            adherence.
        planned:
          type: integer
        plannedSoFar:
          type: integer
        hasPlan:
          type: boolean
          description: >-
            False when no plan existed during this week; `done` and `planned` are then both 0 and
            the client MUST render "No plan", never a 0 % week — a week nothing was scheduled in is
            not a week the trainee failed. Limited by the schema: `user_plan` holds one row per user
            with no history, so this means "the plan they are on now already existed then". A
            trainee who switched plans reads as "No plan" for the weeks before the switch.
            EV-040c's `plan_assignments` is what makes it exact.
        partial:
          type: boolean
          description: True for the week containing today.
      required: [weekCommencing, done, planned, plannedSoFar, hasPlan, partial]
    TraineeSessionHistory:
      type: object
      description: >-
        AC5. The last ten completed sessions, newest first, and the summary line above them.
        `returned` is the REAL count, so the client writes "Of the last 6 sessions: …" for a trainee
        with six and never "of the last 10". `easy + ok + hard + noFeedback == returned`.
      properties:
        returned:
          type: integer
        easy:
          type: integer
        ok:
          type: integer
        hard:
          type: integer
        noFeedback:
          type: integer
        items:
          type: array
          description: >-
            At most 10, newest first. The cap is server-side and there is no parameter that raises
            it; the read is LIMITed at the database on
            `idx_workout_sessions_completed (user_id, completed_at DESC)`, not a full history scan
            filtered in memory.
          items:
            $ref: "#/components/schemas/TraineeSessionHistoryItem"
      required: [returned, easy, ok, hard, noFeedback, items]
    TraineeSessionHistoryItem:
      type: object
      description: One completed session — date, name, difficulty, and nothing else on the row.
      properties:
        date:
          type: string
          format: date
          description: UTC date of completion.
        name:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
          enum: [EASY, OK, HARD]
          description: >-
            Null renders "No feedback given". It is not a fourth value and must not be counted as
            one — `noFeedback` above is where it is counted.
      required: [date]
    TraineeFiredRedFlag:
      type: object
      description: >-
        AC4 — a red flag that fired, with the evidence it fired on. Exactly one evidence field is
        populated, decided by the flag: MISSED_TWO_OR_MORE_SESSIONS carries `missedSessions` (never
        empty — the rule needs two), NO_WEIGH_IN_14_DAYS carries `weighIn`. PAIN_REPORTED can appear
        here never; see `RedFlag`.
      properties:
        flag:
          $ref: "#/components/schemas/RedFlag"
        missedSessions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TraineeMissedSession"
        weighIn:
          allOf:
            - $ref: "#/components/schemas/TraineeWeighInEvidence"
          nullable: true
      required: [flag]
    TraineeMissedSession:
      type: object
      description: >-
        A day that was scheduled, has already passed, and has no completed session on it. Only days
        STRICTLY BEFORE today are ever listed (ADR-0012 D6), and only when a plan existed.
      properties:
        date:
          type: string
          format: date
        sessionName:
          type: string
          nullable: true
          description: >-
            The name of the session scheduled that day. Null when the plan's schedule names no
            workout for it; the client renders the date alone and does not invent a name.
      required: [date]
    TraineeWeighInEvidence:
      type: object
      description: >-
        AC4's second sentence: "Last weigh-in `<date>` — `<N>` days ago", or "Never weighed in".
        Both fields are null TOGETHER, and only for a trainee who has NEVER logged a weight in
        either weight table — they are two views of one fact, so a client never has to reconcile a
        date with no age.
      properties:
        lastWeighInDate:
          type: string
          format: date
          nullable: true
          description: >-
            The most recent weigh-in OF ANY AGE, not bounded by the 8-week chart window. A trainee
            who weighed in nine weeks ago carries that date here while `weightSeries` is empty:
            "nothing recently" and "nothing ever" are different facts and only the second one may be
            rendered as "Never weighed in".
        daysSince:
          type: integer
          nullable: true
    RedFlag:
      type: string
      description: >-
        EV-183 AC5 block 5's vocabulary — exactly three, no more and no fewer. An EMPTY list is
        "No red flags"; there is no fourth code for it.
        **PAIN_REPORTED is never returned.** There is no structured pain signal in the product:
        `Feedback` is {EASY, OK, HARD}, the only pain detection reads AI-chat free text, and
        `workout_completion.notes` exists on the API side but no mobile call site writes it. Rather
        than derive a red flag from a column nothing populates, the server deliberately does not
        compute this rule and always omits it. The constant is published so the client's vocabulary
        is complete and the gap is visible rather than silently absent. ADR-0012 D6; the real source
        is EV-082 plus a PAIN feedback value, at MVE-2.
        NO_WEIGH_IN_14_DAYS is derived from the same merged series as `weightSeries` — over both
        weight tables (BUG-143) — so the flag and the chart can never disagree about whether a
        weigh-in exists. "14 days" is today-13..today inclusive.
      enum: [MISSED_TWO_OR_MORE_SESSIONS, PAIN_REPORTED, NO_WEIGH_IN_14_DAYS]
    TraineeOverviewResponse:
      type: object
      description: >-
        EV-183 AC5's read-only overview, in exactly the five blocks the AC lists, plus ADR-0015 B1's
        `scopes`. The endpoint itself requires an ACTIVE link and NO data scope (ADR-0015 R2-2):
        requiring one would 403 the portal's whole client area through `[id]/layout.tsx`, Nutrition
        tab included, for a link that shared nutrition. Each block instead blanks on its own scope,
        and "absent" is null with this contract saying "not shared" — never a zero or a placeholder
        that reads like data.
      properties:
        clientId:
          type: string
          format: uuid
        traineeDisplayName:
          type: string
        since:
          type: string
          format: date-time
        adherenceThisWeek:
          allOf:
            - $ref: "#/components/schemas/TraineeAdherence"
          nullable: true
          description: >-
            NULL when this link does not carry the WORKOUTS scope (ADR-0015 R2-2 — the overview
            requires no data scope and blanks per block). Render "This trainee has not shared their
            workouts with you." from `scopes`, never 0/0, which reads like a trainee who did nothing.
        currentStreakDays:
          type: integer
          nullable: true
          description: >-
            NULL when this link does not carry the PROGRESS scope. 0 means a real streak of zero.
        lastSession:
          allOf:
            - $ref: "#/components/schemas/TraineeLastSession"
          nullable: true
          description: >-
            Null renders "No feedback given" / no last session, and is also what a link without
            WORKOUTS receives.
        weightSeries:
          type: array
          nullable: true
          description: >-
            Body weights over the last 8 weeks, oldest first, at most one point per date. NULL when
            this link does not carry the WEIGH_INS scope; an EMPTY array renders "No weigh-ins in the
            last 8 weeks". The two are different facts and the client must not collapse them.
            **Both weight tables feed this (BUG-143):** `POST /me/nutrition/weigh-in` (`weigh_ins`)
            and the Body-measurements screen's `POST /me/measurements` (`body_measurements`). They
            are merged by date and the later log wins the date, compared on `created_at`; on an
            exact tie the weigh-in wins, because `weigh_ins` holds at most one row per day and is
            the series the trainee's own nutrition chart draws. A measurement carrying no weight is
            not a weigh-in and plots nothing.
          items:
            $ref: "#/components/schemas/TraineeWeightPoint"
        redFlags:
          type: array
          nullable: true
          description: >-
            Zero or more codes. NULL when this link carries neither WORKOUTS nor WEIGH_INS, so no
            rule could be evaluated at all; EMPTY means "No red flags". Each rule is gated on its own
            scope: MISSED_TWO_OR_MORE_SESSIONS needs WORKOUTS, NO_WEIGH_IN_14_DAYS needs WEIGH_INS —
            a flag is never raised from data the coach was not given.
          items:
            $ref: "#/components/schemas/RedFlag"
        scopes:
          type: array
          description: >-
            The scopes this link carries, verbatim from `coach_clients.scopes` (ADR-0015 B1). This is
            what the portal renders "This trainee has not shared their X with you." from, and what it
            hides tabs from. It must NEVER infer a scope from a 403: every coach-portal denial — no
            such link, another coach's client, revoked, scope missing — answers the same
            undifferentiated 403 COACH_ACCESS_DENIED body, so a 403 carries no information about
            which scope is missing.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
        progressGoal:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressGoal"
          nullable: true
          description: >-
            EV-202a's block 6 — where the trainee started, where they are and where they are going.
            NULL when this link does not carry the WEIGH_INS scope; render "This trainee has not
            shared their weigh-ins with you." from `scopes`, never from a 403.
            It is NON-null even for a trainee who has never recorded anything: every reading inside
            is then null, which renders "X hasn't recorded a weight yet" while the milestone field
            stays editable and still saves.
            ⚠ The WEIGH_INS grant delivers BODY FAT from EV-202a onward, which is why EV-202c widens
            the consent description to name body composition and must reach devices before this is
            deployed.
      required:
        - clientId
        - scopes
    TraineeProgressGoal:
      type: object
      description: >-
        EV-202a + EV-274a. **Three values are written by the coach** (`startedOn`,
        `milestoneWeightKg`, `milestoneBodyFatPct`) and the readings are DERIVED from the
        trainee's own `weigh_ins` / `body_measurements` rows. There is no write
        path for a start weight, a current weight, a start body fat or a current body fat, and no
        request field that could carry one: the trainee owns their body data and already records it,
        and a derived baseline cannot go stale against the chart printed below it.
        🔴 **G-GOAL**: `milestoneWeightKg` and `milestoneBodyFatPct` are NARRATIVE numbers. No
        routine generator, no nutrition target calculation, no prompt and no policy reads them —
        enforced by two release-blocking tests, a static one and a difference-of-zero one. A coach typing 60 here moves nobody's
        calorie target by one kilocalorie.
        **Null is a fact, and there are three different ones.** A null `Reading` is "no reading on
        or after the start date" or "not recorded", never 0. A null delta is "one end is missing",
        while 0.0 is a real delta. A null `milestoneWeightKg` renders NO row at all on the trainee's
        screen — no empty state, no placeholder, no call to action.
      properties:
        startedOn:
          type: string
          format: date
          description: >-
            The start of the COACHING/programme — NOT the link date, which is
            `TraineeOverviewResponse.since` and a different fact. Never null: it falls back to the
            link date, and `startedOnSource` says so. May be in the future.
        startedOnSource:
          type: string
          enum: [COACH, SELF, LINK_DEFAULT]
          description: >-
            LINK_DEFAULT means nobody set a start date and this is the date the trainee accepted.
            Print the provenance; do not pass a defaulted date off as a typed one.
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg on write; outside that, 400
            COACH_MILESTONE_OUT_OF_RANGE and NOTHING is written, never a silent clamp.
        milestoneBodyFatPct:
          type: number
          format: double
          nullable: true
          example: 20.0
          description: >-
            EV-274a. 🔴 G-GOAL — narrative. The body-fat milestone in percentage points, 3.0..60.0
            with one decimal on write; outside that, 400 COACH_MILESTONE_OUT_OF_RANGE and NOTHING is
            written, never a silent clamp. Null = none set. Shares `milestoneSetByName` and
            `milestoneUpdatedAt` with the weight: one PUT writes both.
        milestoneSetByName:
          type: string
          nullable: true
          description: >-
            Who set the milestones. Null WITH either milestone present is "set by a coach who has
            left" — the `ON DELETE SET NULL` fired and the numbers are unchanged. Null with both
            milestones null is simply nothing set.
        milestoneSource:
          type: string
          nullable: true
          enum: [COACH, SELF]
        milestoneUpdatedAt:
          type: string
          format: date-time
          nullable: true
        startWeight:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
          description: >-
            The first weight reading on or after `startedOn`, merged across both weight tables by
            the SAME per-date rule `weightSeries` uses, so the block and the chart cannot disagree.
            Null renders "No reading on or after {date}" — never 0 and never the earliest reading of
            all time.
        currentWeight:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
        startBodyFat:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
          description: >-
            Body fat lives ONLY on `body_measurements`; `weigh_ins` has no such column. A trainee
            who logs through the weigh-in screen therefore has a weight and no body fat, and "Not
            recorded" is a different fact from "no weigh-in" — do not collapse them and do not
            render 0 %.
        currentBodyFat:
          allOf:
            - $ref: "#/components/schemas/TraineeProgressReading"
          nullable: true
        weightDeltaKg:
          type: number
          format: double
          nullable: true
          description: current − start. Null unless both ends exist; 0.0 is real.
        bodyFatDeltaPts:
          type: number
          format: double
          nullable: true
          description: current − start, in percentage POINTS.
        weightToGoKg:
          type: number
          format: double
          nullable: true
          description: >-
            milestone − current weight. Positive is a bulk and negative a cut; no direction is
            assumed and no warning fires. 0.0 is an exact hit, with no celebration and no event.
        bodyFatToGoPts:
          type: number
          format: double
          example: -4.0
          description: >-
            EV-274a. `milestoneBodyFatPct` − `currentBodyFat.value`, in percentage POINTS — the same
            sign convention as `weightToGoKg` (20.0 milestone, 24.0 current → -4.0). No direction is
            assumed and no warning fires; 0.0 is an exact hit. **ABSENT from the body — not null
            and not 0 — unless there is both a body-fat milestone and a body-fat reading** (EV-274a
            AC4). The only key on this schema that is omitted rather than null.
      required:
        - startedOn
        - startedOnSource
    TraineeMilestone:
      type: object
      description: >-
        EV-202e + EV-274a. The TRAINEE's own view of the milestones a coach set for them — a
        deliberate subset of `TraineeProgressGoal`, not an unfinished superset.
        **Five fields and the list is closed** (EV-274a AC6 amended EV-202 AC12 from four to
        five). The coach reads a progress report because they are assessing the work; the trainee is told one fact — a number someone else set about their
        body, and who set it. `weightToGoKg` and `bodyFatToGoPts` in particular are absent on
        purpose: each is SIGNED, a bulk and a cut both have one and neither is a failure, and a field that is not on the wire
        cannot be rendered by a later edit.
        🔴 **G-GOAL**: `milestoneWeightKg` and `milestoneBodyFatPct` are NARRATIVE numbers. Nothing
        generates from them and nothing renders them as numbers the app is working toward.
        **All five keys are always present, nulls included.** `milestoneSetByName` is three-way for
        the client — a name, `null` (the coach's account was erased, the number is unchanged, "set
        by a coach who has left"), or ABSENT (an older server said nothing). This endpoint never
        produces the third, which is exactly why it must not suppress the second.
      properties:
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg as written by the coach. Null renders NO row at
            all on the trainee's screen: no empty state, no "not set" placeholder, no call to
            action.
        milestoneBodyFatPct:
          type: number
          format: double
          nullable: true
          example: 20.0
          description: >-
            EV-274a. 🔴 G-GOAL — narrative. The body-fat milestone, 3.0..60.0 percentage points as
            written by the coach. Null renders no body-fat row. A row with only this milestone has
            `milestoneWeightKg: null` and is NOT the absence answer.
        milestoneSetByName:
          type: string
          nullable: true
          description: >-
            The coach's display name, by the same rule as the `/me/plan` byline. Null WITH a
            milestone present is "set by a coach who has left".
        milestoneSource:
          type: string
          nullable: true
          enum: [COACH, SELF]
          description: >-
            Served verbatim, never normalised. No trainee writer exists, so SELF is unreachable
            today; a client that has no honest sentence for a milestone a coach did not set must be
            able to RECOGNISE the source in order to refuse to describe it.
        milestoneUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the goal row was last written. Null when there is no milestone of either kind.
    TraineeProgressReading:
      type: object
      description: >-
        One reading and the day it was recorded. Every reading carries its own date because the
        weight and body-fat columns resolve independently and may name different days — a
        measurement row may carry a body fat and no weight.
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
      required:
        - date
        - value
    Routine:
      type: object
      description: >-
        A complete personalized weekly routine. The SAME contract `PUT /me/coach/routine` accepts and
        `coach_plan_drafts.document` stores — one shape, not two: the draft is a copy of this record,
        round-tripped by the same Jackson mapper and validated by the same constraints on read as on
        write, and a build-time hash over the reachable record graph fails the build if the shape
        changes without a bump of the draft's `schema_version`.
        Defined here in EV-184a because the coach portal is the first client that must construct one
        (the spec previously typed it as an untyped `object`).
      properties:
        name:
          type: string
        goal:
          type: string
          example: BUILD_MUSCLE
        level:
          type: string
          example: BEGINNER
        daysPerWeek:
          type: integer
          minimum: 2
          maximum: 6
          description: >-
            Derived from `trainingDays.length` on write: a routine declaring 4 days while carrying 1
            is what produced BUG-011's 409, and the server reconciles rather than trusting.
        trainingDays:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/TrainingDay"
        weeklyProgression:
          type: array
          items:
            $ref: "#/components/schemas/ProgressionRule"
        constraints:
          $ref: "#/components/schemas/RoutineConstraints"
        summary:
          type: string
          nullable: true
      required: [name, goal, level, daysPerWeek, trainingDays, weeklyProgression, constraints]
    TrainingDay:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO day of week, 1 = Monday.
        focus:
          type: string
        estimatedMinutes:
          type: integer
          nullable: true
        exercises:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutineExercise"
      required: [dayOfWeek, focus, exercises]
    RoutineExercise:
      type: object
      properties:
        name:
          type: string
          description: >-
            The coach PICKS this from GET /coach-portal/catalog/exercises and never types it
            (EV-184 AC2). It is matched to a catalog slug at write time; an unmatched name persists
            as an UNRESOLVED binding by design (ADR-0009 D6), which is exactly why the coach may not
            publish against an empty catalog.
        sets:
          type: integer
          minimum: 1
          maximum: 20
        reps:
          type: string
          nullable: true
          description: >-
            A STRING: "8-12" and "AMRAP" are both real prescriptions. Null for a DURATION exercise.
        rest:
          type: string
          example: 90s
        tempo:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        trackingType:
          type: string
          enum: [WEIGHT_REPS, DURATION]
          nullable: true
          description: Null is treated as WEIGHT_REPS for backward compatibility.
        durationSeconds:
          type: integer
          nullable: true
        weight:
          type: string
          nullable: true
      required: [name, sets, rest]
    ProgressionRule:
      type: object
      properties:
        week:
          type: integer
          minimum: 1
          maximum: 52
        adjustment:
          type: string
        rationale:
          type: string
          nullable: true
      required: [week, adjustment]
    RoutineConstraints:
      type: object
      description: >-
        The constraints the routine was built to respect, echoed back. On any WRITE path the server
        resolves injuries and equipment from `user_profiles` instead: injuries here are UNIONED with
        the stored ones (every extra injury narrows what may be prescribed) and equipment here is
        IGNORED entirely (a payload claiming ["GYM"] would hand a cable machine to someone who owns
        nothing — BUG-053). A coach MUST submit both — they are required on `Routine`, so a document
        omitting either is rejected — but neither is read as a claim about the trainee.
      properties:
        equipment:
          type: array
          items:
            type: string
        injuries:
          type: array
          items:
            type: string
        minutesPerSession:
          type: integer
        daysPerWeek:
          type: integer
          minimum: 2
          maximum: 6
      required: [equipment, injuries, minutesPerSession, daysPerWeek]
    CoachNutritionTargets:
      type: object
      description: >-
        EV-185 AC1 — the trainee's macro targets as the coach sees them. There is no `setBy` uuid
        here and that is a ruling, not an omission (ADR-0015 D6 amendment (b)/Q2).
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        source:
          type: string
          enum: [AUTO, MANUAL, COACH]
          description: >-
            AUTO = calculated by the engine · MANUAL = set by the trainee · COACH = set by a coach.
            Never render this alone: COACH with `setByYou: false` is "Set by another coach", which a
            re-link after a revoke and an erased coach account both produce.
        activity:
          type: string
          nullable: true
          description: The trainee's ActivityLevel, or null if they never completed onboarding.
        setByYou:
          type: boolean
          description: >-
            Did the SIGNED-IN coach write this target? Computed server-side from
            `nutrition_targets.set_by`, which the portal never receives.
        updatedAt:
          type: string
          format: date-time
      required: [calories, proteinG, carbsG, fatG, source, setByYou, updatedAt]
    CoachProgressGoalRequest:
      type: object
      description: >-
        EV-202a + EV-274a. The values a coach types. All are optional. `startedOn` and
        `milestoneWeightKg` are CLEARED by omitting them; `milestoneBodyFatPct` is left UNCHANGED by
        omitting it and cleared only by an explicit null (EV-274 B4) — see the endpoint's
        description.
        There is deliberately no field for a start weight, a current weight, a body-fat READING, a
        milestone waist or a milestone DATE: each was ruled out by name, and a request type with no
        field for a number is the only way "the coach cannot type that number" survives the next
        refactor.
      properties:
        startedOn:
          type: string
          format: date
          nullable: true
          example: "2026-06-01"
          description: >-
            The start of the coaching/programme. May be in the future — the Start column then reads
            "No reading on or after {date}" and the delta cell is EMPTY, never 0.
        milestoneWeightKg:
          type: number
          format: double
          nullable: true
          example: 80.0
          description: >-
            🔴 G-GOAL — narrative. 25.00..300.00 kg; outside that, 400 COACH_MILESTONE_OUT_OF_RANGE
            and nothing is written. Never clamped.
        milestoneBodyFatPct:
          type: number
          format: double
          nullable: true
          example: 20.0
          description: >-
            EV-274a. 🔴 G-GOAL — narrative. The body-fat milestone in percentage points, 3.0..60.0
            with at most one decimal; outside that (e.g. 2.9, 60.1, -1, 200, 20.05), 400
            COACH_MILESTONE_OUT_OF_RANGE naming `milestoneBodyFatPct` and `3.0-60.0`, and nothing is
            written. Never clamped, never rounded. **Omitted = UNCHANGED; `null` = CLEARED.**

    CoachTargetsRequest:
      type: object
      description: EV-185 AC2 — what a coach may write about a trainee's nutrition; four numbers.
      properties:
        calories:
          type: integer
          minimum: 800
          maximum: 8000
        proteinG:
          type: integer
          minimum: 0
          maximum: 500
        carbsG:
          type: integer
          minimum: 0
          maximum: 1200
        fatG:
          type: integer
          minimum: 0
          maximum: 400
      required: [calories, proteinG, carbsG, fatG]
    CoachTargetsResult:
      type: object
      properties:
        targets:
          $ref: "#/components/schemas/CoachNutritionTargets"
        floorCalories:
          type: integer
          nullable: true
          description: >-
            Non-null exactly when the engine's safety floor RAISED the calories, and then equal to
            the stored value. A NUMBER and never a sentence — the floor is 1500/1200 by profile sex
            and this surface does not know the trainee's sex and must not guess it.
      required: [targets]
    CoachMealWeek:
      type: object
      description: EV-185 AC1/AC3 — the trainee's current meal week.
      properties:
        weekStart:
          type: string
          format: date
        mealStructure:
          nullable: true
          description: >-
            EV-190a / N1 — the meal structure this week was GENERATED against, or null when the
            trainee's own stored preference was used. This is the "asked for" half of the
            reconciliation line; the "returned" half is the meal count the portal reads off
            `days[].meals`, so both numbers come from one payload and cannot disagree about which
            week they describe.
          allOf:
            - $ref: "#/components/schemas/CoachMealStructure"
        days:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlannedDay"
        status:
          type: string
          enum: [GENERATING, ACTIVE, REFUSED, ARCHIVED]
          description: >-
            EV-071b / ruling 6 addendum 6.1 — the week's lifecycle state, the same vocabulary the
            trainee's own week carries.


            REFUSED is the reason it exists: a refused week keeps ONLY the meals the trainee had
            already eaten (ruling 5.6), so before this field a coach opening a refused trainee's
            week saw a sparse week with no explanation and nothing to tell it apart from a thin
            one. The portal renders its read-side (C) from THIS value, never from a low day count.
      required: [weekStart, days, status]
    CoachMealStructure:
      type: object
      description: EV-190a — meals per day and snacks, as a property of ONE WEEK.
      properties:
        mealsPerDay:
          type: integer
          minimum: 1
          maximum: 6
        snacksEnabled:
          type: boolean
      required: [mealsPerDay, snacksEnabled]
    CoachPlannedDay:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 6
        date:
          type: string
          format: date
        trainingDay:
          type: boolean
        meals:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlannedMeal"
        origin:
          type: string
          enum: [GENERATED, REPLACED, STANDARD, UNKNOWN]
          description: >-
            EV-071b / ruling 6 addendum 6.1 — what produced THIS DAY, with exactly the four values
            and meanings ruling 6 fixed for `WeeklyPlanDay.origin`. The coach's (A)/(B) line counts
            REPLACED days off this field.


            It cannot be derived client-side: a catalogue day and a model day are identical in this
            payload too, and matching meal names against the stub templates is forbidden. Until a
            client reads this, it renders neither banner and never a guess — absent must be
            indistinguishable from "we do not know".
      required: [index, date, trainingDay, meals, origin]
    CoachPlannedMeal:
      type: object
      properties:
        mealId:
          type: string
          format: uuid
        slot:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        locked:
          type: boolean
          description: >-
            The TRAINEE locked this meal (by swapping it). An apply reuses the plan row and carries
            locked meals forward, so without this flag the confirm dialog's promise — "meals the
            trainee has locked are kept" — is unverifiable on the screen that follows it.
        provenance:
          type: string
          enum: [ENGINE, COACH_RECIPE]
          description: >-
            EV-256c AC10 (ADR-0026 D26.9). Who wrote THIS meal's content. ENGINE = the meal engine;
            COACH_RECIPE = a coach placed one of their recipes on it.
        placedByYou:
          type: boolean
          description: >-
            EV-256c AC10 (story R4). True exactly when the VIEWING coach placed this recipe
            ("Your recipe"); a COACH_RECIPE meal with this false is "Coach recipe" (another coach, or
            an erased one). Always false on an ENGINE meal. Derived server-side; no user id is
            served.
      required: [mealId, slot, name, kcal, proteinG, carbsG, fatG, locked, provenance, placedByYou]
    CoachTraineeDietProfile:
      type: object
      description: >-
        The trainee's stored `nutrition_preferences`, READ-ONLY. Nothing here is submittable: no
        request type on this prefix carries an allergy, a rule or a dislike.
      properties:
        allergies:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            type: string
            enum: [HALAL, KOSHER]
          description: Hard exclusions, enforced exactly like allergies.
        dislikes:
          type: array
          items:
            type: string
      required: [allergies, rules, dislikes]
    CoachFoodLogResponse:
      type: object
      description: EV-284a — the trainee's food log over a range of their days, against their targets.
      properties:
        clientId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          description: >-
            One element per day from..to, ascending. A day with nothing recorded is present, with
            `totals` null.
          items:
            $ref: "#/components/schemas/CoachFoodLogDay"
      required: [clientId, from, to, days]
    CoachFoodLogDay:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The day the entries were filed under (`food_log.logged_on`).
        totals:
          allOf:
            - $ref: "#/components/schemas/CoachFoodLogMacros"
          nullable: true
          description: >-
            What the trainee consumed: entries plus planned meals marked eaten, from the same
            computation as `GET /me/nutrition/today` `consumed`. NULL when nothing was recorded.
        targets:
          allOf:
            - $ref: "#/components/schemas/CoachFoodLogMacros"
          nullable: true
          description: >-
            The day's targets: the target the trainee's own next read serves (the fresh compute
            when a profile edit is owed a refresh, BUG-434), never written by this read,
            training/rest-day adjusted as the trainee's own day read adjusts them; null when the
            trainee has no target yet.
        entries:
          type: array
          description: The day's food log entries, oldest first.
          items:
            $ref: "#/components/schemas/CoachFoodLogEntry"
        eatenMeals:
          type: array
          description: >-
            Planned meals the trainee marked eaten that day. They count in `totals` and are not
            entries.
          items:
            $ref: "#/components/schemas/CoachFoodLogEatenMeal"
      required: [date, entries, eatenMeals]
    CoachFoodLogMacros:
      type: object
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
      required: [calories, proteinG, carbsG, fatG]
    CoachFoodLogEntry:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
          nullable: true
        servingG:
          type: number
          nullable: true
          description: Serving in grams; null for a quick add.
        calories:
          type: integer
        proteinG:
          type: number
          description: >-
            Stored NOT NULL with a default of 0, so a quick add that gave only kcal reads 0 here,
            indistinguishable from a real 0 g.
        carbsG:
          type: number
          description: >-
            Stored NOT NULL with a default of 0, so a quick add that gave only kcal reads 0 here,
            indistinguishable from a real 0 g.
        fatG:
          type: number
          description: >-
            Stored NOT NULL with a default of 0, so a quick add that gave only kcal reads 0 here,
            indistinguishable from a real 0 g.
        source:
          type: string
          enum: [OFF, QUICK, MANUAL]
          description: As stored (`FoodLogEntry.Source`).
        barcode:
          type: string
          nullable: true
          description: >-
            The product code when the entry came from the food database. The app sends it for a
            scanned product AND for a searched one (a search result is resolved by its code), so a
            barcode does not by itself mean "scanned".
        loggedAt:
          type: string
          format: date-time
          description: When the entry was recorded.
      required: [name, calories, proteinG, carbsG, fatG, source, loggedAt]
    CoachFoodLogEatenMeal:
      type: object
      properties:
        name:
          type: string
        slot:
          type: string
          nullable: true
          description: The meal slot, e.g. BREAKFAST.
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        eatenAt:
          type: string
          format: date-time
      required: [name, calories, proteinG, carbsG, fatG, eatenAt]
    CoachNutritionResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        traineeDisplayName:
          type: string
          nullable: true
        targets:
          allOf:
            - $ref: "#/components/schemas/CoachNutritionTargets"
          nullable: true
          description: Null for a trainee who has never had targets.
        week:
          allOf:
            - $ref: "#/components/schemas/CoachMealWeek"
          nullable: true
          description: Null when the trainee has no plan for the current week.
        currentWeekStart:
          type: string
          format: date
          description: The Monday the SERVER considers current. The portal never computes its own.
        dietProfile:
          $ref: "#/components/schemas/CoachTraineeDietProfile"
        recipePlacementEnabled:
          type: boolean
          description: >-
            EV-256c AC15 (story R5). Whether "Use one of my recipes" is available. False while
            bfit.coach.recipes.placement.enabled is off; the portal hides the action and the
            placement POST answers 404.
      required: [clientId, currentWeekStart, dietProfile, recipePlacementEnabled]
    CoachApplyWeekRequest:
      type: object
      properties:
        weekStart:
          type: string
          format: date
          description: >-
            The Monday to apply. Required rather than defaulted: the confirm dialog names a week,
            and a server that silently substituted its own would make that dialog a claim nobody
            checked.
        mealStructure:
          nullable: true
          description: >-
            EV-190a / N1 — meals per day + snacks for THIS WEEK ONLY. Omit it (or send null) to
            generate against the trainee's own stored preference, which is what every apply did
            before EV-190a.
            Its own request type rather than the trainee's preferences payload, and that IS the
            mechanism: `NutritionPreferencesRequest` carries fifteen fields including `allergies`,
            `foodRules` and `dietaryPattern` on a whole-row replace, so an endpoint bound to it
            would wipe a trainee's allergy list on the first partial submission with every
            closed-key-list test still green — `mealsPerDay` is a permitted key.
            Both fields are required together: they are one fact, and a week carrying a coach's
            meal count beside the trainee's own snack answer is a structure nobody chose.
            Any other key inside this object is refused with 400 COACH_FIELD_NOT_ACCEPTED, for the
            same reason the object exists at all.
          allOf:
            - $ref: "#/components/schemas/CoachMealStructure"
      required: [weekStart]
    CoachSwapOptions:
      type: object
      properties:
        mealId:
          type: string
          format: uuid
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CoachSwapCandidate"
      required: [mealId, candidates]
    CoachSwapCandidate:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
      required: [index, name, kcal, proteinG, carbsG, fatG]
    CoachPlaceRecipeRequest:
      type: object
      description: EV-256c. The only field; the trainee is the path's id and the meal its mealId.
      properties:
        recipeId:
          type: string
          format: uuid
          description: One of the calling coach's own recipes.
      required: [recipeId]
    CoachApplySwapRequest:
      type: object
      properties:
        candidateIndex:
          type: integer
          minimum: 0
          maximum: 20
      required: [candidateIndex]
    CoachRoutineResponse:
      type: object
      description: EV-184 AC1 — the trainee's live routine, as the coach sees it.
      properties:
        clientId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
          nullable: true
        planName:
          type: string
          nullable: true
          description: >-
            Null renders AC1's "No active plan" empty state with one "Build a plan" control — never
            a blank page.
        routine:
          allOf:
            - $ref: "#/components/schemas/Routine"
          nullable: true
          description: Null for a trainee who has never had a routine (edge case 9).
        guardrails:
          $ref: "#/components/schemas/CoachRoutineGuardrails"
        hasDraft:
          type: boolean
        draftUpdatedAt:
          type: string
          format: date-time
          nullable: true
        lastChangedBy:
          type: string
          enum: [COACH, TRAINEE]
          nullable: true
          description: >-
            EV-283a — who wrote the live plan: `COACH` (a publish) or `TRAINEE` (the trainee's own
            editor, `PUT /me/coach/routine`, or an AI generation or chat rewrite they started).
            NULL when it was never recorded: a plan written before this field existed, a catalogue
            plan, or no plan at all. Nothing is inferred from the plan's source. Edits made from a
            workout session (add, remove or reorder an exercise) are not recorded: they change
            neither this field nor `lastChangedAt`.
        lastChangedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            EV-283a — when that plan became the live plan: the save itself, or later when the
            trainee went back to it (`POST /plans/select`) or an AI generation they started
            finished. Null exactly when `lastChangedBy` is null.
        changedSinceYourPublish:
          type: boolean
          description: >-
            EV-283a — true when the trainee's own plan became the live plan at or after THIS
            coach's latest publish to them, so publishing now replaces their change (the draft is
            untouched either way). False when the coach's plan is live, when this coach never
            published to this trainee, and when the author was never recorded. Edits made from a
            workout session (add, remove or reorder an exercise) are not recorded, so they never
            set it. Publishing clears it.
      required: [clientId, guardrails, hasDraft, changedSinceYourPublish]
    CoachRoutineGuardrails:
      type: object
      description: >-
        AC1's read-only panel, rendered under "From the trainee's profile — you cannot change these
        here." Display only, and enforced server-side rather than by the UI: the policy resolves
        injuries and equipment from user_profiles, and so does the plans.equipment column the
        trainee's own app reads on GET /me/plan (BUG-185). A draft document must carry a
        constraints block (both lists are required on Routine), but since BUG-195b (ADR-0018 D9)
        the coach sends both lists as [] and a non-empty value is refused with 400
        COACH_DRAFT_SUBJECT_FIELD: a coach never supplies a claim about the trainee's body.
      properties:
        injuries:
          type: array
          items:
            type: string
        equipment:
          type: array
          items:
            type: string
        equipmentChecked:
          type: boolean
          description: >-
            Whether a non-empty equipment list reaches the policy for this trainee. DERIVED from the
            stored profile, never hardcoded: [] is "unanswered", which allows every rung and narrows
            nobody. The portal must render no equipment-safety sentence while this is false.
      required: [injuries, equipment, equipmentChecked]
    CoachRoutineDraftRequest:
      type: object
      description: >-
        BUG-195b / ADR-0018 D1 option 1-D. The WHOLE routine document plus the draft this save may
        replace. See `PUT /coach-portal/clients/{id}/routine/draft` for which fields the server
        resolves and which it refuses.
      required: [document]
      properties:
        replacesDraftUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The `updatedAt` of the draft this save may replace, echoed VERBATIM from the last GET,
            PUT or apply response for this draft, or from a 409's `details.existingUpdatedAt`.
            Absent or null means "only if there is no draft".
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          description: >-
            The full routine document. `goal`, `level`, `constraints.equipment` and
            `constraints.injuries` are the TRAINEE's answers: send `goal`/`level` as served and
            both lists as `[]`; the response carries what was stored.
    CoachRoutineDraftResponse:
      type: object
      description: The coach's unpublished draft for this link.
      properties:
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          nullable: true
          description: Null when no draft exists — the editor then opens on the published routine.
        schemaVersion:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        sourceTemplateId:
          type: string
          format: uuid
          nullable: true
          description: >-
            EV-188a. Which template this draft was started from, for the editor's "Started from
            {name}" line. Null for a hand-built draft, and null again once that template is deleted
            (ON DELETE SET NULL). It is never provenance on the PUBLISHED plan: publish deletes the
            draft row, so after a publish no row anywhere joins a plan to a template — which is what
            makes back-propagation underivable rather than merely disabled.
        unbindableExercises:
          type: array
          items:
            type: string
          description: >-
            EV-188 AC5. Exercise names in this draft that the catalogue would not match today,
            RE-DERIVED on every open and NEVER stored. A stored staleness flag is a cache of an
            opinion about a catalogue that moves: wrong from the moment it is written, surviving the
            sync that fixes it, and needing a sweeper. Because it is transient, a mark computed over
            a half-built index is wrong for at most one page view. The marks may legitimately differ
            between two opens of an UNEDITED draft — that is the honest rendering of a fuzzy matcher
            over a moving catalogue, and nothing here ever removes an exercise.
        catalogChecked:
          type: boolean
          description: >-
            Whether the catalogue check ran at all. FALSE with an empty list means NOT CHECKED,
            which is a different fact from "checked and clean" — the same distinction
            `GuardrailInputs.equipmentChecked` exists for. On a fresh deploy the derived index is
            built over zero rows and a naive recompute would mark every exercise in every draft.
            This read does NOT answer 503 for that: refusing to open a draft because a background
            sync is in flight is a worse failure than an unchecked one.
    CoachTemplateSaveRequest:
      type: object
      description: A routine template to create or replace.
      required: [name, document]
      properties:
        name:
          type: string
          maxLength: 80
          description: >-
            Unique per coach, folded for case and surrounding whitespace. VARCHAR(80) counts
            CHARACTERS; JavaScript's .length counts UTF-16 code units. They agree for BMP characters
            — including Arabic base letters and harakat — and disagree for anything outside the BMP,
            i.e. emoji, where JS counts 2 and Postgres counts 1.
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          description: >-
            The routine document. `constraints.equipment` and `constraints.injuries` are @NotNull on
            the shared Routine type, so a caller CANNOT omit them — and the server reads neither as
            a claim about anybody: both are stored empty and any row where they are not is refused
            when it is read back. On a `DURATION` exercise `reps` is stored as null (BUG-195b): the
            earlier portal sent its "8-12" default on timed exercises, and the value is normalised
            rather than refused so that saving keeps working.
    CoachTemplateRenameRequest:
      type: object
      description: A new name for an existing template.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
    CoachTemplateFromRoutineRequest:
      type: object
      description: Save this trainee's routine into the coach's own library.
      required: [name, source]
      properties:
        name:
          type: string
          maxLength: 80
          description: Pre-named with the plan's name by the portal, editable before saving.
        source:
          type: string
          enum: [PLAN, DRAFT]
          description: >-
            A closed enum rather than a boolean. "From the published plan" and "from my unpublished
            draft" are two facts, and a boolean named fromDraft would make the third source somebody
            adds a second boolean.
    CoachTemplateApplyRequest:
      type: object
      description: Which trainee to put this template on, and what it may replace.
      required: [clientId]
      properties:
        clientId:
          type: string
          format: uuid
          description: >-
            The coach_clients link id for the target trainee. It is a link id in a BODY, which this
            prefix otherwise never does — and it is still not trusted: it is resolved through
            requireActiveLinkRow(principal, clientId, WORKOUTS) exactly as a path segment would be.
            The URL addresses the TEMPLATE because that is the resource the capability is minted
            from; the trainee is the second subject of a two-subject operation and both are checked.
        replacesDraftUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The updatedAt of the draft this apply is allowed to replace, echoed from a previous
            409 COACH_DRAFT_EXISTS. ABSENT means "only if there is no draft".
    CoachTemplateResponse:
      type: object
      description: A routine template in the coach's private library.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        schemaVersion:
          type: integer
        document:
          allOf:
            - $ref: "#/components/schemas/Routine"
          description: >-
            The prescription. `constraints.equipment` and `constraints.injuries` are ALWAYS empty —
            a template carries no answer a trainee gave about themselves. `minutesPerSession` and
            `daysPerWeek` are the coach's own prescription and do survive.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CoachTemplateSummaryResponse:
      type: object
      description: >-
        One row of the library list: name, day count, exercise count, last-updated — and nothing
        else. The two counts are derived from the document in Java, per row, on every list call. NOT
        denormalised counter columns: two columns to keep in step with a document, for a list a
        coach opens by hand.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dayCount:
          type: integer
        exerciseCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CoachTemplateListResponse:
      type: object
      description: >-
        The coach's library, newest-updated first. Unpaged, and that is a bounded decision rather
        than an unbounded query: the cap is 50 rows per coach, enforced at the write under a
        pessimistic lock.
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/CoachTemplateSummaryResponse"
        limit:
          type: integer
          description: >-
            The product cap on templates per coach. Served so the portal can render the refusal copy
            without hard-coding the number. It is a PRODUCT bound — a flat list of 50 needs no
            folders, tags or search — and NOT a storage control: it bounds the count, not the size.
        remaining:
          type: integer
          description: >-
            How many more this coach may create, so "Delete one to make room" can be shown BEFORE
            the 409 rather than only after it.
    CoachTemplateApplyResponse:
      type: object
      description: The trainee's draft, as it now stands after a template was copied into it.
      properties:
        clientId:
          type: string
          format: uuid
        sourceTemplateId:
          type: string
          format: uuid
        sourceTemplateName:
          type: string
        document:
          $ref: "#/components/schemas/Routine"
        updatedAt:
          type: string
          format: date-time
        replacedExistingDraft:
          type: boolean
        unbindableExercises:
          type: array
          items:
            type: string
          description: >-
            Advisory and never persisted. A template holds a NAME, not a catalogue reference, so
            "stale" can only mean "the fuzzy matcher would not bind this name today" — an opinion
            about a catalogue that moves and that can be half-synced. Deleting a coach's programming
            on that opinion would make the same name behave two ways depending on which button the
            coach pressed, and would turn a transient into a permanent loss. The decision moves from
            the matcher to the coach, who can still reach the same end state by pressing Remove.
        catalogChecked:
          type: boolean
          description: >-
            Whether the catalogue check could run. FALSE with an empty list is "not checked", which
            is not the same fact as "checked and clean".
    CoachRecipeSaveRequest:
      type: object
      description: >-
        A recipe to create or replace. One serving. Unknown properties are ignored and never
        stored: the stored document is built from these fields only.
      required: [name, ingredients, kcal, proteinG, carbsG, fatG, steps]
      properties:
        name:
          type: string
          description: >-
            1..80 characters AFTER trimming (Unicode spaces fold, zero-width characters are
            removed). No control character or line break. Unique per coach, ignoring case and
            surrounding spaces.
          example: Chicken rice bowl
        ingredients:
          type: array
          minItems: 1
          maxItems: 25
          description: Each key at most once.
          items:
            $ref: "#/components/schemas/CoachRecipeIngredientRequest"
        kcal:
          type: integer
          minimum: 1
          maximum: 3000
          description: >-
            Must be within max(50, 15%) of 4·proteinG + 4·carbsG + 9·fatG. kcal and the three
            macros must be whole numbers: a fractional value (300.9, 559.99) is refused with
            VALIDATION_ERROR naming the field, never truncated; 50.0 is accepted.
        proteinG:
          type: integer
          minimum: 0
          maximum: 300
        carbsG:
          type: integer
          minimum: 0
          maximum: 300
        fatG:
          type: integer
          minimum: 0
          maximum: 300
        steps:
          type: array
          maxItems: 15
          items:
            type: string
            maxLength: 300
            description: Not blank once trimmed. No control character or line break.
        mealSlots:
          type: array
          nullable: true
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [BREAKFAST, LUNCH, DINNER, SNACK]
          description: >-
            EV-320a. OPTIONAL. Which slots of a week "Apply week" may fill with this recipe. A
            repeated value is folded; the stored order is BREAKFAST, LUNCH, DINNER, SNACK. Omitted on
            create: the recipe is untagged, and the fill treats it as LUNCH and DINNER only. Omitted
            on update: the stored tags are KEPT (so a client that predates the field cannot wipe
            them); sent on update, they replace the stored ones. `[]`, more than 4 values, or any
            other value is 400 VALIDATION_ERROR naming `mealSlots`.
          example: [LUNCH, DINNER]
    CoachRecipeIngredientRequest:
      type: object
      required: [key, quantity, unit]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
          description: >-
            A canonical ingredient key exactly as `GET /coach-portal/ingredients` returned it. A key
            that is blank, has upper case, fails the pattern or is not in the vocabulary is refused
            with COACH_RECIPE_UNKNOWN_INGREDIENT (not VALIDATION_ERROR).
          example: chicken_breast
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 5000
          description: Greater than 0, at most 5000, at most 2 decimal places.
          example: 150
        unit:
          type: string
          enum: [g, ml, piece]
    CoachRecipeResponse:
      type: object
      description: >-
        A recipe in the coach's private library. No timestamps: no client reads one, and the
        library is alphabetical.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CoachRecipeIngredientResponse"
        steps:
          type: array
          items:
            type: string
        unknownKeys:
          type: array
          items:
            type: string
          description: >-
            Keys in this recipe that are no longer in the vocabulary (a key can be retired after the
            recipe was saved). The recipe still reads. Empty in the normal case.
        mealSlots:
          type: array
          nullable: true
          items:
            type: string
            enum: [BREAKFAST, LUNCH, DINNER, SNACK]
          description: >-
            EV-320a. The slots "Apply week" may fill with this recipe, in BREAKFAST, LUNCH, DINNER,
            SNACK order. null when untagged (saved before the field existed, or without it), which
            the fill treats as LUNCH and DINNER only.
    CoachRecipeIngredientResponse:
      type: object
      properties:
        key:
          type: string
          example: chicken_breast
        label:
          type: string
          description: Derived from the key on every read (underscores become spaces); never stored.
          example: chicken breast
        quantity:
          type: number
          example: 150
        unit:
          type: string
          enum: [g, ml, piece]
    CoachRecipeSummaryResponse:
      type: object
      description: One row of the recipe library.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        ingredientCount:
          type: integer
        mealSlots:
          type: array
          nullable: true
          items:
            type: string
            enum: [BREAKFAST, LUNCH, DINNER, SNACK]
          description: EV-320a. The recipe's meal slots, or null when untagged (read as LUNCH and DINNER).
    CoachRecipeListResponse:
      type: object
      description: The coach's recipe library, alphabetical by name.
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/CoachRecipeSummaryResponse"
        limit:
          type: integer
          description: The product cap on recipes per coach (100), so the portal can show "{n} of 100".
          example: 100
        remaining:
          type: integer
          description: How many more this coach may create.
    NutritionTemplateSaveRequest:
      type: object
      description: >-
        A nutrition template to create or replace (EV-273a). A closed key list at every depth: any
        other key is refused with COACH_FIELD_NOT_ACCEPTED.
      required: [name, targets]
      additionalProperties: false
      properties:
        name:
          type: string
          description: >-
            1..80 characters after trimming, no control character or line break. Unique per coach
            among nutrition templates, ignoring case and surrounding spaces.
          example: Cut 1800
        targets:
          $ref: "#/components/schemas/NutritionTemplateTargetsRequest"
        mealStructure:
          allOf:
            - $ref: "#/components/schemas/NutritionTemplateMealStructureRequest"
          nullable: true
          description: Omit (or null) to use the trainee's own meal structure when the template is applied.
    NutritionTemplateTargetsRequest:
      type: object
      description: Absolute daily targets, whole numbers, with CoachTargetsRequest's bounds.
      required: [calories, proteinG, carbsG, fatG]
      additionalProperties: false
      properties:
        calories:
          type: integer
          minimum: 800
          maximum: 8000
          example: 1800
        proteinG:
          type: integer
          minimum: 0
          maximum: 500
          example: 150
        carbsG:
          type: integer
          minimum: 0
          maximum: 1200
          example: 170
        fatG:
          type: integer
          minimum: 0
          maximum: 400
          example: 60
    NutritionTemplateMealStructureRequest:
      type: object
      description: One fact, so both fields are required when the object is sent.
      required: [mealsPerDay, snacksEnabled]
      additionalProperties: false
      properties:
        mealsPerDay:
          type: integer
          description: 1-6 inclusive, else 400 COACH_MEAL_STRUCTURE_OUT_OF_RANGE (never clamped).
          example: 4
        snacksEnabled:
          type: boolean
          example: false
    NutritionTemplateResponse:
      type: object
      description: A nutrition template. No recipe pins until EV-273c.
      required: [id, name, targets, mealStructure, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targets:
          $ref: "#/components/schemas/NutritionTemplateTargets"
        mealStructure:
          allOf:
            - $ref: "#/components/schemas/NutritionTemplateMealStructure"
          nullable: true
          description: Always present; null = use the trainee's own meal structure.
        updatedAt:
          type: string
          format: date-time
    NutritionTemplateTargets:
      type: object
      required: [calories, proteinG, carbsG, fatG]
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
    NutritionTemplateMealStructure:
      type: object
      required: [mealsPerDay, snacksEnabled]
      properties:
        mealsPerDay:
          type: integer
        snacksEnabled:
          type: boolean
    NutritionTemplateListResponse:
      type: object
      description: The coach's nutrition template library, newest-updated first.
      required: [templates, limit, remaining]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/NutritionTemplateResponse"
        limit:
          type: integer
          description: The cap on nutrition templates per coach (50).
          example: 50
        remaining:
          type: integer
          description: How many more this coach may create.
    CoachIngredientOption:
      type: object
      description: An ingredient a coach may put in a recipe.
      properties:
        key:
          type: string
          example: chicken_breast
        label:
          type: string
          example: chicken breast
    CoachPublishPreviewResponse:
      type: object
      description: What publishing this draft would change, and the token that acknowledges it.
      properties:
        repairs:
          type: array
          description: >-
            One line per repair, in the engine's own words. EMPTY means the modal reads "No changes
            were needed" with a single "Publish" control.
          items:
            type: string
        repairCount:
          type: integer
          description: >-
            `repairs.length`, so AC3's heading "We changed N things to keep this safe" cannot
            disagree with the list beside it. Equal BY CONSTRUCTION to the publish result's
            `repairCount`: publish re-runs the policy and refuses on any mismatch, so the two
            numbers cannot differ.
        digest:
          type: string
          description: >-
            SHA-256 over (the link id, the canonical draft document, the canonical ordered repairs).
            Echo it to publish. It is not a timestamp — two writes in one transaction share a now(),
            and the fixed test Clock makes that collision reproducible rather than rare.
        equipmentChecked:
          type: boolean
          description: See CoachRoutineGuardrails.equipmentChecked. Derived, never hardcoded.
      required: [repairs, repairCount, digest, equipmentChecked]
    CoachPublishRequest:
      type: object
      description: >-
        Acknowledge the previewed repairs and publish. Deliberately NOT `{"confirm": true}`: a
        constant carries no information about what was acknowledged. It carries no coachId, no
        traineeId and no routine — the subject is the URL segment and the document is the stored
        draft.
      properties:
        digest:
          type: string
          maxLength: 128
      required: [digest]
    CoachPublishResultResponse:
      type: object
      properties:
        planId:
          type: string
          format: uuid
          description: >-
            The NEW plan id. Every publish creates a new plans row and deactivates the previous one.
        repairs:
          type: array
          items:
            type: string
        repairCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
      required: [planId, repairs, repairCount, publishedAt]
    CoachCatalogPageResponse:
      type: object
      description: A page of catalog exercises, with the facet vocabularies to filter by.
      properties:
        items:
          type: array
          items:
            type: object
            description: The existing ExerciseCatalogDto shape, unchanged.
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        muscles:
          type: array
          description: Every distinct target muscle in the catalog, sorted. Derived from the catalog.
          items:
            type: string
        equipment:
          type: array
          description: Every distinct equipment value in the catalog, sorted. Derived.
          items:
            type: string
      required: [items, page, size, totalElements, totalPages, muscles, equipment]
    MyCoachResponse:
      type: object
      description: >-
        The trainee's current coach — the caller's OWN active link, or `null`. Carries the linked
        coach's id (BUG-201): the client needs a stable per-coach key to remember it has already
        shown the one-time write-disclosure card (EV-197 AC4), and with no id it derived `''` and
        the card never rendered. Nothing else about the coach is published here, and an unlinked
        coach's id is unreachable on this endpoint — no link, no body.
      properties:
        coachId:
          type: string
          format: uuid
          description: >-
            The linked coach's user id. Present whenever the body is non-null. Addresses nothing:
            there is no endpoint that reads a coach by id.
        coachDisplayName:
          type: string
          description: AC6's "Coached by `<name>`".
        since:
          type: string
          format: date-time
          description: AC6's "since `<date>`" — when the trainee accepted.
        scopes:
          type: array
          description: The four scopes granted, exactly as recorded on the link row.
          items:
            type: string
            enum: [WORKOUTS, PROGRESS, NUTRITION, WEIGH_INS]
      required: [coachId, coachDisplayName, since, scopes]
    AcceptCoachInviteRequest:
      type: object
      description: >-
        Accept a coach invite. Deliberately carries NO scopes — the server owns the set (ADR-0012
        D2).
      properties:
        token:
          type: string
          maxLength: 128
          description: >-
            The raw token from the invite link. A credential: never logged.
        privacyPolicyVersion:
          type: string
          maxLength: 32
          description: >-
            The privacy policy version the consent screen displayed. The server rejects a mismatch
            with 409 CONSENT_VERSION_STALE rather than substituting its own, because recording
            consent to a document the app never rendered is the defect BUG-023 exists to prevent.
          example: v1.0
      required: [token, privacyPolicyVersion]
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - code
        - message
    RoutineGenerateRequest:
      type: object
      description: Onboarding profile for routine generation (request wins, stored profile fills gaps).
      properties:
        goal:
          type: string
          description: Primary goal (PrimaryGoal enum).
        level:
          type: string
          description: Experience level (FitnessLevel enum).
        gender:
          type: string
          nullable: true
        heightCm:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
        age:
          type: integer
          nullable: true
        daysPerWeek:
          type: integer
          minimum: 2
          maximum: 6
          description: >
            Training days per week. 2-6 inclusive (EV-123 / BUG-011): this becomes the generated
            plan's weekly_days, which the database constrains to BETWEEN 2 AND 6. A 1 or a 7 is
            rejected at the request boundary with 400 VALIDATION_ERROR, not accepted and then
            failed later as a 409.
          example: 4
        minutesPerSession:
          type: integer
          minimum: 1
        equipment:
          type: array
          items:
            type: string
        environment:
          type: string
          nullable: true
        injuries:
          type: array
          nullable: true
          items:
            type: string
        schedulePreference:
          type: string
          nullable: true
        preferredDays:
          type: array
          nullable: true
          items:
            type: string
        timeOfDay:
          type: string
          nullable: true
        likedExercises:
          type: array
          nullable: true
          items:
            type: string
        avoidedExercises:
          type: array
          nullable: true
          items:
            type: string
        focusAreas:
          type: array
          nullable: true
          items:
            type: string
        preferences:
          type: string
          nullable: true
      required:
        - goal
        - level
        - daysPerWeek
        - minutesPerSession
        - equipment
    RoutineGenerationAcceptedResponse:
      type: object
      description: 202 body for a queued routine generation.
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [GENERATING, COMPLETED, FAILED]
      required:
        - jobId
        - status
    RoutineGenerationStatusResponse:
      type: object
      description: Poll response for an async progressive routine generation (EV-124 / ADR-0002 §7).
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [GENERATING, COMPLETED, FAILED]
        planId:
          type: string
          format: uuid
          nullable: true
          description: >
            The in-progress/active plan id, set once the skeleton materializes the plan. The first
            READY day is startable from THIS plan (POST /workout-sessions/start with its workout id)
            while status is still GENERATING. Null before the skeleton lands.
        progress:
          allOf:
            - $ref: "#/components/schemas/RoutineGenerationProgress"
          nullable: true
          description: Incremental progress; null for a pre-EV-124 job or before the skeleton lands.
        routine:
          type: object
          nullable: true
          description: >
            Partial while GENERATING (contains the READY training days + identity as they land) and
            the finalized full Routine at COMPLETED. Null while only the skeleton header exists and
            when FAILED. Shape is the existing Routine contract.
        error:
          type: string
          nullable: true
          description: Set only when status is FAILED.
      required:
        - jobId
        - status
    RoutineGenerationProgress:
      type: object
