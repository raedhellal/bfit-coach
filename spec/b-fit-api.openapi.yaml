    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          # BUG-390: InitialiseTraineeRequest.EMAIL_TEXT, the same spelling on the server (one class,
          # looped; REQUIRES the JavaScript u flag - without it the class inverts). The four account-email
          # writers carry it (the three that create an account, plus POST /me/account/email, whose
          # ChangeEmailRequest.newEmail is below, EV-316); /auth/login deliberately does not, so an
          # address stored before the rule still signs in.
          pattern: "^[^\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}]*$"
          description: >-
            No control character, no U+2028/U+2029 and no invisible format character
            (Unicode categories Cc, Cf, Zl, Zp: NEL, ZWSP, BOM, LRM, RLO, ZWNJ, ZWJ, ...), anywhere in the
            address; 400 VALIDATION_ERROR on email. IDN domains and non-ASCII local parts are accepted
            as before
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          # BUG-415: maxLength counts characters; bcrypt counts UTF-8 bytes, which JSON Schema
          # cannot state. The server's rule is @PasswordByteLimit.
          description: >-
            8 to 128 characters and at most 72 bytes in UTF-8 (bcrypt's limit; an accented letter
            counts as 2 bytes, most emoji as 4). Longer: 400 VALIDATION_ERROR on password
        fullName:
          type: string
          maxLength: 120
          # The server evaluates the same set as ONE Java character class, [[^...][\u200C\u200D]]*
          # (InitialiseTraineeRequest.NAME_TEXT, BUG-313 B1): the starred alternation below made
          # java.util.regex recurse per character and overflow the stack on long input. This
          # spelling is documentation only (JavaScript has no nested class union); the two accept
          # exactly the same code points (NameTextPatternTest).
          pattern: "^(?:[^\\p{Cc}\\p{Cf}\\u2028\\u2029]|[\\u200C\\u200D])*$"
          description: >-
            Optional. No control character (CR, LF, tab, NUL, ...), no U+2028/U+2029 and no
            invisible format character (bidi overrides and isolates, soft hyphen, BOM, ...); ZWNJ
            and ZWJ are allowed. Otherwise 400 VALIDATION_ERROR on fullName and no account is
            created (BUG-313; the rule EV-204a2 uses for an initialised name).
        consentAccepted:
          type: boolean
          description: >-
            Acceptance of the privacy policy and the terms of service. Must be true — absent or
            false is 400 CONSENT_REQUIRED, and no account is created.
        privacyPolicyVersion:
          type: string
          maxLength: 32
          example: "v1.0"
          description: >-
            The privacy policy version the client displayed, from GET /legal/versions. A mismatch is
            409 CONSENT_VERSION_STALE; the server never substitutes its own value.
        termsVersion:
          type: string
          maxLength: 32
          example: "v1.0"
          description: >-
            The terms of service version the client displayed. A separate field because the two
            documents are versioned and revised independently; one shared string cannot express a
            privacy-only revision.
      required:
        - email
        - password
        - consentAccepted
        - privacyPolicyVersion
        - termsVersion
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        tokens:
          $ref: "#/components/schemas/AuthTokens"
      required:
        - user
        - tokens
    AuthTokens:
      type: object
      properties:
        accessToken:
