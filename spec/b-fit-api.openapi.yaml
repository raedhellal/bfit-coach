          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - plan
        - planName
        - status
    AiCreditStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether AI credit metering is enabled.
        balance:
          type: integer
          description: Remaining credits in the current period.
        monthlyAllowance:
          type: integer
          description: The user's monthly allowance.
        resetsOn:
          type: string
          format: date
          description: When the balance next resets.
      required:
        - enabled
        - balance
        - monthlyAllowance
        - resetsOn
    DailyNutritionResponse:
      type: object
      description: >-
        One day of nutrition: the (carb-cycled) target, what has been consumed, what remains, the
        logged entries, any planned meals from the weekly meal plan, and the logging streak.
      properties:
        date:
          type: string
          format: date
        target:
          $ref: "#/components/schemas/NutritionTargetResponse"
        consumed:
          $ref: "#/components/schemas/NutritionTotals"
        remaining:
          $ref: "#/components/schemas/NutritionTotals"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FoodLogEntryResponse"
        plannedMeals:
          type: array
          nullable: true
          description: >-
            The weekly meal plan's meals for this date, or null when no stored weekly meal plan
            covers it. Eaten planned meals are already counted into `consumed`.
          items:
            $ref: "#/components/schemas/PlannedMealBrief"
        trainingDay:
          type: boolean
          nullable: true
          description: >-
            The day-type of the user's live training schedule (EV-126). `true` on a scheduled
            training day, `false` on a scheduled rest day, and `null` only when the user has no
            active training schedule at all — `null` never means "rest day". Derived from the active
            plan's per-day schedule, not from the stored weekly meal plan, so a plan edited mid-week
            is reflected immediately. Non-null exactly when `target` was carb-cycled from that
            schedule, so the badge and the numbers on the same response always agree. With 7
            training days per week the flag is still `true` even though carb cycling applies no
            delta.
        streakDays:
          type: integer
      required:
        - date
        - target
        - consumed
        - remaining
        - entries
        - streakDays
    NutritionTotals:
      type: object
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
      required:
        - calories
        - proteinG
        - carbsG
        - fatG
    NutritionTargetResponse:
      type: object
      description: >-
        The daily calorie/macro target. On a daily view this is the day's carb-cycled target; the
        stored weekly-average target is unchanged by that adjustment.
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        source:
          type: string
          enum: [AUTO, MANUAL, COACH]
          description: >-
            AUTO = computed from the profile; MANUAL = the trainee set it; COACH = a linked coach
            set it (EV-185a). COACH and MANUAL are both left alone by the profile-change recompute.
        setByName:
          type: string
          nullable: true
          description: >-
            The coach's display name, and a THREE-state field (EV-185a / ADR-0015 D6 ruling (b)).
            ABSENT (the key is not serialised at all) = no coach ever set this target — render no
            byline. `null` = a coach set it and that account has since been erased — render "Set by
            a coach who has left". A string = the coach's professional name
            (`coach_profiles.display_name`, never the nullable account name). Absent and null are
            DIFFERENT documents: a client that cannot tell them apart attributes every
            self-computed target to a coach nobody can name. Present only when `source` is COACH.
        activity:
          type: string
          nullable: true
          enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE]
          description: >-
            The activity level behind the TDEE multiplier, derived from the profile's declared
            weekly training days — deliberately not the plan schedule (EV-125). Null on MANUAL
            targets.
        flags:
          type: array
          items:
            type: string
          description: Human-readable notes, e.g. the carb-cycling note applied to this day.
        disclaimer:
          type: string
          nullable: true
      required:
        - calories
        - proteinG
        - carbsG
        - fatG
        - source
        - flags
    ManualTargetRequest:
      type: object
      description: >-
        The trainee's own target. The bounds are duplicated deliberately in CoachTargetsRequest
        rather than shared — a shared type would widen the coach's contract the day a field is added
        here (ADR-0015 D6). They are kept in step by a reflective test, not by convention.
      properties:
        calories:
          type: integer
          minimum: 800
          maximum: 8000
        proteinG:
          type: integer
          minimum: 0
          maximum: 500
        carbsG:
          type: integer
          minimum: 0
          maximum: 1200
        fatG:
          type: integer
          minimum: 0
          maximum: 400
      required:
        - calories
        - proteinG
        - carbsG
        - fatG
    GenerateWeekRequest:
      type: object
      description: Optional body; an absent body or an absent field means the current week's Monday.
      properties:
        weekStartDate:
          type: string
          format: date
          nullable: true
    WeeklyPlanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        weekStartDate:
          type: string
          format: date
        status:
          type: string
          enum: [GENERATING, ACTIVE, REFUSED, ARCHIVED]
          description: >-
            GENERATING means days are still streaming in — a day with an empty `meals` array has not
            landed yet rather than being a day with no food in it.


            REFUSED (EV-071) means **nothing we can check is safe for this account**: the week was
            declined rather than failed. It carries **zero `days`**, so nothing partial is readable
            as a plan, and it is deliberately distinguishable on a plain GET from GENERATING, from
            ACTIVE and from "no plan yet" (404). A client renders its refusal state from THIS value
            and from the `NO_SAFE_MEAL_PLAN` error code — **never** from an error `message`.


            ARCHIVED was always a legal value of the underlying column and is documented here for
            the first time rather than introduced.
        source:
          type: string
          enum: [AI, STUB]
          description: >-
            Which ENGINE produced the meals, and what the AI-disclosure pill reads. It never learns
            COACH: a coach-applied week is still generated by the engine, and the attribution lives
            on `setByName` (ADR-0015 D6 ruling (d)).
        setByName:
          type: string
          nullable: true
          description: >-
            The same three-state byline `NutritionTargetResponse.setByName` carries, for the week:
            ABSENT = the trainee generated it themselves, `null` = a coach applied it and that
            account has since been erased, a string = the coach's display name. Serving `null` for a
            self-generated week would attribute it to a coach who does not exist.
        days:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanDay"
        generatedAt:
          type: string
          format: date-time
        disclaimer:
          type: string
          nullable: true
      required:
        - id
        - weekStartDate
        - status
        - source
        - days
        - generatedAt
    WeeklyPlanDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        trainingDay:
          type: boolean
        target:
          $ref: "#/components/schemas/WeeklyPlanDayTarget"
        meals:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanMeal"
        origin:
          type: string
          enum: [GENERATED, REPLACED, STANDARD, UNKNOWN]
          description: >-
            EV-071b — what produced THIS DAY. Non-null on every day of every week, including a
            REFUSED one. Recorded where the decision is made and never derived: a catalogue day and
            a model day are identical on the wire, so this is the only thing that distinguishes
            them.


            GENERATED — the model produced this day, it validated, it is served as produced.
            REPLACED — the model produced a day for this date, a blocking violation rejected it
            after the one repair round-trip, and the deterministic catalogue day was served in its
            place. **The only value the EV-071 banners count.**
            STANDARD — the catalogue produced this day and no model day for it ever existed (AI
            disabled, stub adapter, a failed or malformed model call, a day whose group never
            landed). Nothing was rejected, so it NEVER counts toward a banner.
            UNKNOWN — we do not know: a row that predates V55's column, or a day of a GENERATING
            week that has not been produced yet. A week containing ANY UNKNOWN day renders NEITHER
            banner — both banners are claims, and we do not make a claim from data we do not have.


            There is deliberately **no week-level `replacedDayCount`** (ruling 6.1): generation runs
            in day groups, so a week total emitted from a group would be a lower bound. The client
            derives it — `days.filter(d => d.origin === 'REPLACED').length` — on a terminal week
            only (never on GENERATING, never on REFUSED).


            This is NOT the AI on/off signal. That is `source`, it is unchanged, and the
            AI-disclosure pill keeps reading it.
      required:
        - id
        - date
        - trainingDay
        - target
        - meals
        - origin
    WeeklyPlanDayTarget:
      type: object
      properties:
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
      required:
        - calories
        - proteinG
        - carbsG
        - fatG
    WeeklyPlanMeal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slot:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
        ordinal:
          type: integer
        name:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
        fatG:
          type: integer
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanIngredient"
        prepSteps:
          type: array
          items:
            type: string
        imageUrl:
          type: string
          nullable: true
        locked:
          type: boolean
          description: A locked meal is carried forward by a day regeneration and by a coach re-apply.
        eaten:
          type: boolean
        provenance:
          type: string
          enum: [ENGINE, COACH_RECIPE]
          description: >-
            EV-256c AC10 (ADR-0026 D26.9). Who wrote THIS meal. Beside the week's `source`, never
            instead of it: `source` says which engine; this says whether an engine wrote this meal
            at all. EV-256f draws the AI pill per meal from it.
        recipeByName:
          type: string
          nullable: true
          description: >-
            EV-256c AC10. Only on a COACH_RECIPE meal, with the week-level setByName's three states:
            the key is ABSENT on an ENGINE meal; null once the coach who placed it has been erased;
            otherwise the coach's display name (kept after the link is revoked).
      required:
        - id
        - slot
        - ordinal
        - name
        - kcal
        - proteinG
        - carbsG
        - fatG
        - ingredients
        - prepSteps
        - locked
        - eaten
        - provenance
    WeeklyPlanIngredient:
      type: object
      properties:
        name:
          type: string
        quantity:
